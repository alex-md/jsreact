<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

    <head>
        
        <script>
            createHead(
                'JavaScript, CSS & HTML Minifier - Free Online Code Compression Tool',
                'Free online tool to minify and optimize JavaScript, CSS, and HTML code. Reduce file size up to 80%, improve load times, and enhance website performance with advanced Terser compression. Best free code minifier with source map support.'
            );
        </script>

        <!-- Enhanced SEO Meta Tags -->
        <meta name="keywords"
            content="javascript minifier, css minifier, html minifier, code compression, js minify, terser, code optimizer, web performance, minification tool, source map generator, code compressor">
        <meta name="author" content="JSreact">
        <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">

        <!-- Enhanced Social Media Meta Tags -->
        <meta property="article:tag" content="JavaScript Minifier">
        <meta property="article:tag" content="CSS Minifier">
        <meta property="article:tag" content="Code Optimization">
        <meta property="article:tag" content="Terser">
        <meta property="article:tag" content="Web Performance">

        <!-- JSON-LD Structured Data -->
        <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "WebApplication",
            "name": "JSreact Code Minifier",
            "applicationCategory": "DeveloperApplication",
            "operatingSystem": "Any",
            "description": "Free online tool to minify and optimize JavaScript, CSS, and HTML code with advanced compression options using Terser.",
            "offers": {
                "@type": "Offer",
                "price": "0",
                "priceCurrency": "USD"
            },
            "featureList": [
                "JavaScript, CSS, and HTML minification",
                "Terser compression",
                "Source map generation",
                "Multiple compression options",
                "Real-time compression",
                "Code optimization",
                "File size reduction"
            ],
            "browserRequirements": "Requires JavaScript",
            "softwareVersion": "1.0"
        }
        </script>

        <style>
            .layout-container {
                display: grid;
                grid-template-columns: 1fr minmax(300px, 400px);
                gap: 1.5rem;
                align-items: start;
                min-height: calc(100vh - 300px);
            }

            @media (max-width: 1024px) {
                .layout-container {
                    grid-template-columns: 1fr;
                }

                .options-sidebar {
                    order: -1;
                }
            }

            .code-section {
                height: 100%;
                display: flex;
                flex-direction: column;
            }

            .code-container {
                flex: 1;
                display: flex;
                flex-direction: column;
                gap: 1.5rem;
            }

            .code-box {
                flex: 1;
                display: flex;
                flex-direction: column;
            }

            .code-box textarea {
                flex: 1;
                min-height: 300px;
                resize: none;
            }

            .input-card-footer {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding-top: 1rem;
                border-top: 1px solid #e5e7eb;
                margin-top: 1rem;
            }

            .options-sidebar {
                position: sticky;
                top: 1rem;
            }

            .option-group {
                transition: all 0.2s ease;
            }

            .option-group:hover {
                transform: translateY(-1px);
            }
        </style>
      <script type="module" crossorigin src="/assets/minify.100a7c74.js"></script>
      <link rel="modulepreload" crossorigin href="/assets/footer.b7e959e3.js">
      <link rel="modulepreload" crossorigin href="/assets/toast.bf8b0bbc.js">
      <link rel="stylesheet" href="/assets/footer.9686b87b.css">
    </head>

    <body class="bg-gray-50">
        

        <script>
            document.body.appendChild(
                createHeader(
                    'Code Minifier',
                    'Optimize code size and improve website performance'
                )
            );
        </script>

        <main class="container mx-auto px-4 py-12 max-w-7xl">
            <div class="layout-container">
                <!-- Left Column: Code Input/Output -->
                <div class="code-section">
                    <div class="code-container">
                        <!-- Input Box -->
                        <div
                            class="code-box bg-white rounded-xl shadow-lg hover:shadow-xl transition-shadow duration-300 overflow-hidden border border-gray-200">
                            <div class="p-6 space-y-4">
                                <label for="input-code" class="block text-sm font-medium text-gray-700">
                                    Input Code
                                </label>
                                <textarea id="input-code" placeholder="Paste your code here..."
                                    class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-shadow text-gray-900 font-mono"></textarea>
                                <div class="input-card-footer">
                                    <p id="input-size" class="text-sm text-gray-500">0 bytes</p>
                                    <button id="minify-button"
                                        class="px-6 py-3 bg-primary-500 text-white font-medium rounded-lg hover:bg-primary-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 transition-colors">
                                        <i class="fas fa-compress-alt mr-2"></i>
                                        Minify Code
                                    </button>
                                </div>
                            </div>
                        </div>

                        <!-- Output Box -->
                        <div
                            class="code-box bg-white rounded-xl shadow-lg hover:shadow-xl transition-shadow duration-300 overflow-hidden border border-gray-200">
                            <div class="p-6 space-y-4">
                                <label for="output-code" class="block text-sm font-medium text-gray-700">
                                    Minified Code
                                </label>
                                <textarea id="output-code" readonly
                                    class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-shadow text-gray-900 font-mono"></textarea>
                                <div class="flex justify-between items-center">
                                    <p id="output-size" class="text-sm text-gray-500">0 bytes</p>
                                    <div class="flex gap-4">
                                        <button id="copy-button"
                                            class="px-6 py-3 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-colors">
                                            <i class="fas fa-copy mr-2"></i>
                                            Copy Output
                                        </button>
                                        <button id="clear-button"
                                            class="px-6 py-3 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-colors">
                                            <i class="fas fa-trash-alt mr-2"></i>
                                            Clear All
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Right Column: Options -->
                <div class="options-sidebar">
                    <div
                        class="bg-white rounded-xl shadow-lg hover:shadow-xl transition-shadow duration-300 overflow-hidden border border-gray-200">
                        <div class="border-b border-gray-200 px-6 py-4">
                            <h2 class="text-lg font-semibold text-gray-900 flex items-center gap-2">
                                <i class="fas fa-cog text-primary"></i>
                                Settings
                            </h2>
                        </div>
                        <div class="p-6 space-y-6">
                            <!-- File Type Selection -->
                            <div class="option-group space-y-3">
                                <label class="block text-sm font-medium text-gray-700">File Type</label>
                                <select id="file-type"
                                    class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none">
                                    <option value="js">JavaScript</option>
                                    <option value="html">HTML</option>
                                    <option value="css">CSS</option>
                                </select>
                            </div>

                            <!-- JavaScript-specific Options -->
                            <div id="js-options" class="space-y-4">
                                <div class="option-group space-y-3">
                                    <label class="block text-sm font-medium text-gray-700">Optimization Options</label>
                                    <div class="space-y-3">
                                        <label class="flex items-center gap-2 group">
                                            <input type="checkbox" id="compress-code" checked
                                                class="w-4 h-4 text-primary border-gray-300 rounded focus:ring-primary">
                                            <span class="text-sm text-gray-700 group-hover:text-gray-900">Compress
                                                Code</span>
                                        </label>
                                        <label class="flex items-center gap-2 group">
                                            <input type="checkbox" id="mangle-names" checked
                                                class="w-4 h-4 text-primary border-gray-300 rounded focus:ring-primary">
                                            <span class="text-sm text-gray-700 group-hover:text-gray-900">Mangle
                                                Names</span>
                                        </label>
                                        <label class="flex items-center gap-2 group">
                                            <input type="checkbox" id="remove-comments" checked
                                                class="w-4 h-4 text-primary border-gray-300 rounded focus:ring-primary">
                                            <span class="text-sm text-gray-700 group-hover:text-gray-900">Remove
                                                Comments</span>
                                        </label>
                                    </div>
                                </div>

                                <div class="option-group space-y-3">
                                    <label class="block text-sm font-medium text-gray-700">Advanced Options</label>
                                    <div class="space-y-3">
                                        <label class="flex items-center gap-2 group">
                                            <input type="checkbox" id="module-type"
                                                class="w-4 h-4 text-primary border-gray-300 rounded focus:ring-primary">
                                            <span class="text-sm text-gray-700 group-hover:text-gray-900">Process as ES
                                                Module</span>
                                        </label>
                                        <label class="flex items-center gap-2 group">
                                            <input type="checkbox" id="keep-fnames"
                                                class="w-4 h-4 text-primary border-gray-300 rounded focus:ring-primary">
                                            <span class="text-sm text-gray-700 group-hover:text-gray-900">Keep Function
                                                Names</span>
                                        </label>
                                        <label class="flex items-center gap-2 group">
                                            <input type="checkbox" id="keep-classnames"
                                                class="w-4 h-4 text-primary border-gray-300 rounded focus:ring-primary">
                                            <span class="text-sm text-gray-700 group-hover:text-gray-900">Keep Class
                                                Names</span>
                                        </label>
                                    </div>
                                </div>

                                <div class="option-group space-y-3">
                                    <label class="block text-sm font-medium text-gray-700">Target Environment</label>
                                    <select id="ecma-version"
                                        class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none">
                                        <option value="5">ES5 (Highest Compatibility)</option>
                                        <option value="2015">ES2015 (ES6)</option>
                                        <option value="2020" selected>ES2020 (Modern)</option>
                                    </select>
                                </div>
                            </div>

                            <!-- Info Message -->
                            <div class="mt-4 p-4 bg-blue-50 rounded-lg">
                                <p class="text-sm text-blue-700">
                                    <i class="fas fa-info-circle mr-2"></i>
                                    HTML and CSS files use basic minification. JavaScript files use advanced Terser
                                    minification.
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        
        
        
    </body>

</html>
