        <main class="container mx-auto px-4 py-12 max-w-7xl">
            <div class="space-y-6">
                <!-- Input Section -->
                <div
                    class="bg-white rounded-xl shadow-lg hover:shadow-xl transition-shadow duration-300 overflow-hidden border border-gray-200">
                    <div class="p-6 space-y-6">
                        <div class="space-y-4">

                            </label>
                            <textarea id="input-text" rows="3" placeholder="Enter words or phrases..."

                        </div>

                        <!-- Action Buttons -->
                        <div class="flex flex-wrap gap-4">
                            <button id="generate-button"
                                class="px-6 py-3 bg-primary-500 text-white font-medium rounded-lg hover:bg-primary-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 transition-colors">

                            </button>

                            </button>
                        </div>
                    </div>

                <div
                    class="bg-white rounded-xl shadow-lg hover:shadow-xl transition-shadow duration-300 overflow-hidden border border-gray-200">

                        <h2 class="text-lg font-semibold text-gray-900">Generated Names</h2>
                        <button id="copy-all-button"
                            class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-colors text-sm font-medium flex items-center gap-2">
                            <i class="fas fa-copy text-xs"></i> Copy All
                        </button>
                    </div>
                    <div class="p-6">
                        <div id="results" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                            <!-- Results will be dynamically added here -->
                        </div>
                        <div id="loading" class="hidden">
                            <div class="flex items-center justify-center py-8">
                                <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-primary"></div>
                            </div>
                        </div>
                    </div>
                </div>
