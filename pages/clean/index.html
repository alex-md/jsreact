<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

    <head>
        
        <script>
            createHead(
                'Text Cleaner & Formatter',
                'Clean and format text content with powerful text manipulation tools'
            );
        </script>
        <style>
            .option-group {
                background: linear-gradient(135deg, #ffffff, #f8fafc);
                border: 1px solid rgba(59, 148, 184, 0.1);
                box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
                transition: all 0.3s ease;
            }

            .option-group:hover {
                transform: translateY(-2px);
                box-shadow: 0 8px 12px -2px rgba(0, 0, 0, 0.1);
                border-color: rgba(59, 148, 184, 0.2);
            }

            .checkbox-wrapper {
                transition: all 0.2s ease;
                padding: 0.5rem;
                border-radius: 0.5rem;
            }

            .checkbox-wrapper:hover {
                background: rgba(59, 148, 184, 0.05);
            }

            .tooltip {
                position: relative;
            }

            .tooltip:hover .tooltip-text {
                opacity: 1;
                visibility: visible;
                transform: translate(-50%, -0.25rem);
            }

            .tooltip-text {
                position: absolute;
                left: 50%;
                bottom: calc(100% + 0.5rem);
                transform: translate(-50%, 0.5rem);
                padding: 0.5rem 1rem;
                background: #1f2937;
                color: white;
                font-size: 0.875rem;
                white-space: nowrap;
                border-radius: 0.375rem;
                opacity: 0;
                visibility: hidden;
                transition: all 0.2s ease;
                z-index: 50;
                pointer-events: none;
                box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            }

            .tooltip-text::after {
                content: '';
                position: absolute;
                left: 50%;
                top: 100%;
                transform: translateX(-50%);
                border-width: 0.25rem;
                border-style: solid;
                border-color: #1f2937 transparent transparent transparent;
            }

            .option-group h3 {
                position: relative;
                padding-left: 1.5rem;
            }

            .option-group h3::before {
                content: '';
                position: absolute;
                left: 0;
                top: 50%;
                transform: translateY(-50%);
                width: 0.75rem;
                height: 0.75rem;
                background: #3b94b8;
                border-radius: 50%;
                opacity: 0.6;
            }
        </style>
      <script type="module" crossorigin src="../../assets/clean.00b820da.js"></script>
      <link rel="modulepreload" crossorigin href="../../assets/footer.38783371.js">
      <link rel="modulepreload" crossorigin href="../../assets/header.4ed993c7.js">
      <link rel="modulepreload" crossorigin href="../../assets/toast.bf8b0bbc.js">
      <link rel="stylesheet" href="../../assets/footer.a98cf686.css">
    </head>

    <body class="bg-gray-50">
        
        
        <script>
            document.body.appendChild(
                createHeader(
                    'Text Cleaner',
                    'Clean and format your text with powerful tools'
                )
            );
        </script>

        <main role="main" class="container mx-auto px-4 py-12 max-w-7xl">
            <div class="max-w-5xl mx-auto space-y-6">
                <!-- Text Input/Output Section -->
                <section role="region" aria-label="Text editor"
                    class="bg-white rounded-xl shadow-lg hover:shadow-xl transition-shadow duration-300 overflow-hidden border border-gray-200">
                    <div class="p-6 space-y-6">
                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                            <!-- Input Section -->
                            <div>
                                <label for="input-text" class="block text-sm font-medium text-gray-700 mb-2">
                                    Input Text
                                </label>
                                <textarea id="input-text" rows="12" placeholder="Paste your text here..."
                                    class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-shadow text-gray-900 font-mono"></textarea>
                            </div>

                            <!-- Output Section -->
                            <div>
                                <label for="output-text" class="block text-sm font-medium text-gray-700 mb-2">
                                    Output Text
                                </label>
                                <textarea id="output-text" rows="12" readonly
                                    class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-shadow text-gray-900 font-mono"></textarea>
                            </div>
                        </div>

                        <!-- Action Buttons -->
                        <div class="flex flex-wrap gap-4">
                            <button id="clean-button"
                                class="tooltip px-6 py-3 bg-primary-500 text-white font-medium rounded-lg hover:bg-primary-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 transition-colors flex items-center gap-2">
                                <i class="fas fa-magic"></i>
                                Clean Text
                                <span class="tooltip-text">Apply selected cleaning options to the text</span>
                            </button>
                            <button id="copy-button"
                                class="tooltip px-6 py-3 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-colors flex items-center gap-2">
                                <i class="fas fa-copy"></i>
                                Copy Output
                                <span class="tooltip-text">Copy cleaned text to clipboard</span>
                            </button>
                            <button id="clear-button"
                                class="tooltip px-6 py-3 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-colors flex items-center gap-2">
                                <i class="fas fa-trash-alt"></i>
                                Clear All
                                <span class="tooltip-text">Clear all input and output text</span>
                            </button>
                        </div>
                    </div>
                </section>

                <!-- Find and Replace Section -->
                <section role="region" aria-label="Find and replace tools"
                    class="bg-white rounded-xl shadow-lg hover:shadow-xl transition-shadow duration-300 overflow-hidden border border-gray-200">
                    <div class="border-b border-gray-200 px-6 py-4">
                        <h2 class="text-lg font-semibold text-gray-900 flex items-center gap-2">
                            <i class="fas fa-search-replace text-primary"></i>
                            Find and Replace
                        </h2>
                    </div>
                    <div class="p-6">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <!-- Find Input -->
                            <div class="space-y-2">
                                <div class="flex items-center justify-between">
                                    <label for="find-text" class="block text-sm font-medium text-gray-700">
                                        Find
                                    </label>
                                    <div class="tooltip">
                                        <label class="flex items-center space-x-2 text-sm text-gray-600">
                                            <input type="checkbox" id="use-regex"
                                                class="w-4 h-4 text-primary bg-gray-100 border-gray-300 rounded focus:ring-primary">
                                            <span>Use Regex</span>
                                        </label>
                                        <span class="tooltip-text">Enable regular expressions for advanced pattern
                                            matching</span>
                                    </div>
                                </div>
                                <div class="relative">
                                    <input type="text" id="find-text"
                                        class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-shadow"
                                        placeholder="Text to find...">
                                    <span id="match-count"
                                        class="absolute right-3 top-1/2 -translate-y-1/2 text-sm text-gray-500"></span>
                                </div>
                            </div>

                            <!-- Replace Input -->
                            <div class="space-y-2">
                                <label for="replace-text" class="block text-sm font-medium text-gray-700">
                                    Replace With
                                </label>
                                <div class="relative">
                                    <input type="text" id="replace-text"
                                        class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-shadow"
                                        placeholder="Replacement text...">
                                </div>
                            </div>
                        </div>

                        <!-- Action Buttons -->
                        <div class="flex flex-wrap gap-4 mt-6">
                            <button id="find-next"
                                class="tooltip px-6 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-colors flex items-center gap-2">
                                <i class="fas fa-search"></i>
                                Find Next
                                <span class="tooltip-text">Find the next match (Ctrl+F)</span>
                            </button>
                            <button id="replace-next"
                                class="tooltip px-6 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-colors flex items-center gap-2">
                                <i class="fas fa-exchange-alt"></i>
                                Replace
                                <span class="tooltip-text">Replace the current match</span>
                            </button>
                            <button id="replace-all"
                                class="tooltip px-6 py-2 bg-primary-500 text-white rounded-lg hover:bg-primary-600 transition-colors flex items-center gap-2">
                                <i class="fas fa-sync"></i>
                                Replace All
                                <span class="tooltip-text">Replace all matches</span>
                            </button>
                        </div>
                    </div>
                </section>

                <!-- Options Section -->
                <section role="region" aria-label="Cleaning options"
                    class="bg-white rounded-xl shadow-lg hover:shadow-xl transition-shadow duration-300 overflow-hidden border border-gray-200">
                </section>
                <div class="border-b border-gray-200 px-6 py-4 bg-gradient-to-r from-primary/5 to-transparent">
                    <h2 class="text-lg font-semibold text-gray-900 flex items-center gap-3">
                        <i class="fas fa-sliders-h text-primary"></i>
                        Cleaning Options
                        <span class="text-sm font-normal text-gray-500">(Hover for details)</span>
                    </h2>
                </div>
                <div class="p-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        <!-- Basic Cleaning -->
                        <div class="option-group p-5 rounded-xl">
                            <h3 class="font-medium text-gray-900 mb-4 flex items-center gap-2">
                                Basic Cleaning
                                <span class="text-xs text-primary/60">(Recommended)</span>
                            </h3>
                            <div class="space-y-4">
                                <div class="checkbox-wrapper tooltip">
                                    <label class="flex items-start gap-3 cursor-pointer">
                                        <input type="checkbox" id="remove-extra-spaces" checked
                                            class="w-4 h-4 mt-0.5 text-primary bg-gray-100 border-gray-300 rounded focus:ring-primary">
                                        <div>
                                            <span class="text-sm font-medium text-gray-700 block">Remove Extra
                                                Spaces</span>
                                            <span class="text-xs text-gray-500">Consolidates multiple spaces into
                                                one</span>
                                        </div>
                                    </label>
                                </div>
                                <div class="checkbox-wrapper tooltip">
                                    <label class="flex items-start gap-3 cursor-pointer">
                                        <input type="checkbox" id="remove-empty-lines" checked
                                            class="w-4 h-4 mt-0.5 text-primary bg-gray-100 border-gray-300 rounded focus:ring-primary">
                                        <div>
                                            <span class="text-sm font-medium text-gray-700 block">Remove Empty
                                                Lines</span>
                                            <span class="text-xs text-gray-500">Removes blank lines and
                                                whitespace</span>
                                        </div>
                                    </label>
                                </div>
                                <div class="checkbox-wrapper tooltip">
                                    <label class="flex items-start gap-3 cursor-pointer">
                                        <input type="checkbox" id="trim-lines" checked
                                            class="w-4 h-4 mt-0.5 text-primary bg-gray-100 border-gray-300 rounded focus:ring-primary">
                                        <div>
                                            <span class="text-sm font-medium text-gray-700 block">Trim Line
                                                Spaces</span>
                                            <span class="text-xs text-gray-500">Removes leading/trailing
                                                spaces</span>
                                        </div>
                                    </label>
                                </div>
                            </div>
                        </div>

                        <!-- Text Formatting -->
                        <div class="option-group p-5 rounded-xl">
                            <h3 class="font-medium text-gray-900 mb-4">Text Formatting</h3>
                            <div class="space-y-4">
                                <div class="checkbox-wrapper tooltip">
                                    <label class="flex items-start gap-3 cursor-pointer">
                                        <input type="checkbox" id="normalize-quotes" checked
                                            class="w-4 h-4 mt-0.5 text-primary bg-gray-100 border-gray-300 rounded focus:ring-primary">
                                        <div>
                                            <span class="text-sm font-medium text-gray-700 block">Convert Smart
                                                Quotes</span>
                                            <span class="text-xs text-gray-500">Standardizes quote marks</span>
                                        </div>
                                    </label>
                                </div>
                                <div class="checkbox-wrapper tooltip">
                                    <label class="flex items-start gap-3 cursor-pointer">
                                        <input type="checkbox" id="normalize-whitespace" checked
                                            class="w-4 h-4 mt-0.5 text-primary bg-gray-100 border-gray-300 rounded focus:ring-primary">
                                        <div>
                                            <span class="text-sm font-medium text-gray-700 block">Normalize
                                                Whitespace</span>
                                            <span class="text-xs text-gray-500">Standardizes spaces and line
                                                endings</span>
                                        </div>
                                    </label>
                                </div>
                                <div class="checkbox-wrapper tooltip">
                                    <label class="flex items-start gap-3 cursor-pointer">
                                        <input type="checkbox" id="normalize-dashes" checked
                                            class="w-4 h-4 mt-0.5 text-primary bg-gray-100 border-gray-300 rounded focus:ring-primary">
                                        <div>
                                            <span class="text-sm font-medium text-gray-700 block">Convert Em/En
                                                Dashes</span>
                                            <span class="text-xs text-gray-500">Standardizes dash types</span>
                                        </div>
                                    </label>
                                </div>
                            </div>
                        </div>

                        <!-- Advanced Options -->
                        <div class="option-group p-5 rounded-xl">
                            <h3 class="font-medium text-gray-900 mb-4 flex items-center gap-2"></h3>
                            Advanced Options
                            <span class="text-xs text-amber-600">(Use with care)</span>
                            </h3>
                            <div class="space-y-4">
                                <div class="checkbox-wrapper tooltip">
                                    <label class="flex items-start gap-3 cursor-pointer">
                                        <input type="checkbox" id="remove-punctuation"
                                            class="w-4 h-4 mt-0.5 text-primary bg-gray-100 border-gray-300 rounded focus:ring-primary">
                                        <div>
                                            <span class="text-sm font-medium text-gray-700 block">Remove
                                                Punctuation</span>
                                            <span class="text-xs text-gray-500">Strips all punctuation marks</span>
                                        </div>
                                    </label>
                                </div>
                                <div class="checkbox-wrapper tooltip">
                                    <label class="flex items-start gap-3 cursor-pointer">
                                        <input type="checkbox" id="convert-newlines"
                                            class="w-4 h-4 mt-0.5 text-primary bg-gray-100 border-gray-300 rounded focus:ring-primary">
                                        <div>
                                            <span class="text-sm font-medium text-gray-700 block">Convert
                                                Newlines</span>
                                            <span class="text-xs text-gray-500">Changes line breaks to spaces</span>
                                        </div>
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                </section>
            </div>
        </main>

        
        
        
    </body>

</html>
