<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/x-icon" href="/public/favicon.ico">
        <script type="module">
            import { createHead } from '@components/head.js';
            createHead(
                'Online Text Cleaner & Formatter',
                'Clean and format text with our advanced text processing tool'
            );
        </script>

        <!-- Enhanced SEO Meta Tags -->
        <meta name="keywords"
            content="text cleaner, text formatter, whitespace cleanup, string normalizer, content cleaner, text processing tool, remove extra spaces, clean text online, format text tool, text editor">
        <meta name="author" content="JSreact">
        <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">

        <!-- Enhanced Social Media Meta Tags -->
        <meta property="article:tag" content="Text Processing">
        <meta property="article:tag" content="Text Cleaning">
        <meta property="article:tag" content="Content Formatting">
        <meta property="article:tag" content="Text Tools">
        <style>
            .option-group {
                background: hsla(var(--card) / 0.6);
                backdrop-filter: blur(12px);
                -webkit-backdrop-filter: blur(12px);
                border: 1px solid hsla(var(--border) / 0.5);
                border-radius: var(--radius-lg);
                box-shadow:
                    0 4px 6px -1px rgba(0, 0, 0, 0.05),
                    0 2px 4px -1px rgba(0, 0, 0, 0.03),
                    inset 0 0 0 1px rgba(255, 255, 255, 0.1);
                transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                padding: var(--space-4);
                margin-bottom: var(--space-2);
            }

            .option-group:hover {
                transform: translateY(-2px);
                box-shadow: 0 8px 12px -2px rgba(0, 0, 0, 0.1);
                border-color: rgba(59, 148, 184, 0.2);
            }

            .checkbox-wrapper {
                transition: all 0.2s ease;
                padding: 0.5rem;
                border-radius: 0.5rem;
                margin-bottom: 0.5rem;
            }

            .checkbox-wrapper:hover {
                background: rgba(59, 148, 184, 0.05);
            }

            .tooltip {
                position: relative;
            }

            .tooltip:hover .tooltip-text {
                opacity: 1;
                visibility: visible;
                transform: translate(-50%, -0.25rem);
            }

            .tooltip-text {
                position: absolute;
                left: 50%;
                bottom: calc(100% + 0.5rem);
                transform: translate(-50%, 0.5rem);
                padding: var(--space-2) var(--space-4);
                background: hsla(var(--popover) / 0.95);
                color: hsl(var(--popover-foreground));
                font-size: var(--text-sm);
                white-space: nowrap;
                border-radius: var(--radius-md);
                border: 1px solid hsla(var(--border) / 0.1);
                box-shadow: var(--shadow-md);
                backdrop-filter: blur(4px);
                opacity: 0;
                visibility: hidden;
                transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
                z-index: 50;
                pointer-events: none;
                box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            }

            .tooltip-text::after {
                content: '';
                position: absolute;
                left: 50%;
                top: 100%;
                transform: translateX(-50%);
                border-width: 0.25rem;
                border-style: solid;
                border-color: #1f2937 transparent transparent transparent;
            }

            .option-group h3 {
                position: relative;
                padding-left: 1rem;
            }

            .option-group h3::before {
                content: '';
                position: absolute;
                left: 0;
                top: 50%;
                transform: translateY(-50%);
                width: 0.5rem;
                height: 0.5rem;
                background: #3b94b8;
                border-radius: 50%;
                opacity: 0.6;
            }

            /* Additional spacing styles for cleaning options */
            .cleaning-options-grid {
                display: grid;
                gap: 0.75rem;
                grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            }

            .checkbox-wrapper label {
                font-size: 0.75rem;
                line-height: 1rem;
            }

            .checkbox-wrapper .description {
                font-size: 0.625rem;
                line-height: 0.875rem;
                color: #6b7280;
                margin-top: 0.25rem;
            }

            /* Responsive adjustments */
            @media (max-width: 640px) {
                .cleaning-options-grid {
                    grid-template-columns: 1fr;
                }

                .option-group {
                    padding: 0.75rem;
                }

                .checkbox-wrapper {
                    padding: 0.25rem;
                }

                .tooltip-text {
                    font-size: 0.625rem;
                }
            }
        </style>
    </head>

    <body class="bg-gray-50">
        <script type="module">
            import { createNavbar } from '@components/navbar.js';
            createNavbar();
        </script>

        <div id="header"></div>
        <!-- <script type="module">
            import { createHeader } from '@components/header.js';
            const header = createHeader(
                'Online Text Cleaner & Formatter',
                'Clean and format text with our advanced text processing tool'
            );
            document.getElementById('header').appendChild(header);
        </script> -->

        <main class="container mx-auto px-4 py-12 max-w-7xl">
            <div class="grid grid-cols-1 lg:grid-cols-[1fr_minmax(300px,400px)] gap-6">
                <!-- Left Column: Input/Output -->
                <div class="code-section">
                    <div class="code-container space-y-6">
                        <!-- Input Box -->
                        <div
                            class="code-box bg-white rounded-xl shadow-lg hover:shadow-xl transition-shadow duration-300 overflow-hidden border border-gray-200">
                            <div class="p-6 space-y-4">
                                <label for="input-text" class="block text-sm font-medium text-gray-700">
                                    Input Text
                                </label>
                                <textarea id="input-text" rows="12" placeholder="Paste your text here..."
                                    class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-shadow text-gray-900 font-mono"></textarea>
                                <div class="flex justify-between items-center">
                                    <button id="clear-button"
                                        class="tooltip px-6 py-3 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-colors flex items-center gap-2">
                                        <i class="fas fa-trash-alt"></i>
                                        Clear All
                                        <span class="tooltip-text">Clear all input and output text</span>
                                    </button>
                                    <button id="clean-button"
                                        class="tooltip px-6 py-3 bg-primary-500 text-white font-medium rounded-lg hover:bg-primary-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 transition-colors flex items-center gap-2">
                                        <i class="fas fa-magic"></i>
                                        Clean Text
                                        <span class="tooltip-text">Apply selected cleaning options to the text</span>
                                    </button>
                                </div>
                            </div>
                        </div>

                        <!-- Output Box -->
                        <div
                            class="code-box bg-white rounded-xl shadow-lg hover:shadow-xl transition-shadow duration-300 overflow-hidden border border-gray-200">
                            <div class="p-6 space-y-4">
                                <label for="output-text" class="block text-sm font-medium text-gray-700">
                                    Output Text
                                </label>
                                <textarea id="output-text" rows="12" readonly
                                    class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-shadow text-gray-900 font-mono"></textarea>
                                <div class="flex justify-end">
                                    <button id="copy-button"
                                        class="tooltip px-6 py-3 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-colors flex items-center gap-2">
                                        <i class="fas fa-copy"></i>
                                        Copy Output
                                        <span class="tooltip-text">Copy cleaned text to clipboard</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Right Column: Options -->
                <div class="options-sidebar space-y-6">
                    <!-- Find and Replace -->
                    <section
                        class="bg-white rounded-xl shadow-lg hover:shadow-xl transition-shadow duration-300 overflow-hidden border border-gray-200">
                        <div class="border-b border-gray-200 px-6 py-4">
                            <h2 class="text-lg font-semibold text-gray-900 flex items-center gap-2">
                                <i class="fas fa-search-replace text-primary"></i>
                                Find and Replace
                            </h2>
                        </div>
                        <div class="p-6">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <!-- Find Input -->
                                <div class="space-y-2">
                                    <div class="flex items-center justify-between">
                                        <label for="find-text" class="block text-sm font-medium text-gray-700">
                                            Find
                                        </label>
                                        <div class="tooltip">
                                            <label class="flex items-center space-x-2 text-sm text-gray-600">
                                                <input type="checkbox" id="use-regex"
                                                    class="w-4 h-4 text-primary bg-gray-100 border-gray-300 rounded focus:ring-primary">
                                                <span>Use Regex</span>
                                            </label>
                                            <span class="tooltip-text">Enable regular expressions for advanced pattern
                                                matching</span>
                                        </div>
                                    </div>
                                    <div class="relative">
                                        <input type="text" id="find-text"
                                            class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-shadow"
                                            placeholder="Text to find...">
                                        <span id="match-count"
                                            class="absolute right-3 top-1/2 -translate-y-1/2 text-sm text-gray-500"></span>
                                    </div>
                                </div>

                                <!-- Replace Input -->
                                <div class="space-y-2">
                                    <label for="replace-text" class="block text-sm font-medium text-gray-700">
                                        Replace With
                                    </label>
                                    <div class="relative">
                                        <input type="text" id="replace-text"
                                            class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-shadow"
                                            placeholder="Replacement text...">
                                    </div>
                                </div>
                            </div>

                            <!-- Action Buttons -->
                            <div class="flex flex-wrap gap-4 mt-6">
                                <button id="find-next"
                                    class="tooltip px-6 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-colors flex items-center gap-2">
                                    <i class="fas fa-search"></i>
                                    Find Next
                                    <span class="tooltip-text">Find the next match (Ctrl+F)</span>
                                </button>
                                <button id="replace-next"
                                    class="tooltip px-6 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-colors flex items-center gap-2">
                                    <i class="fas fa-exchange-alt"></i>
                                    Replace
                                    <span class="tooltip-text">Replace the current match</span>
                                </button>
                                <button id="replace-all"
                                    class="tooltip px-6 py-2 bg-primary-500 text-white rounded-lg hover:bg-primary-600 transition-colors flex items-center gap-2">
                                    <i class="fas fa-sync"></i>
                                    Replace All
                                    <span class="tooltip-text">Replace all matches</span>
                                </button>
                            </div>
                        </div>
                    </section>

                    <!-- Cleaning Options -->
                    <section
                        class="bg-white rounded-xl shadow-lg hover:shadow-xl transition-shadow duration-300 overflow-hidden border border-gray-200">
                        <div class="border-b border-gray-200 px-6 py-4">
                            <h2 class="text-lg font-semibold text-gray-900 flex items-center gap-2">
                                <i class="fas fa-sliders-h text-primary"></i>
                                Cleaning Options
                            </h2>
                        </div>
                        <div class="p-6">
                            <div class="cleaning-options-grid">
                                <!-- Basic Cleaning -->
                                <div class="option-group">
                                    <h3 class="text-sm font-medium text-gray-900 mb-4">Basic Cleaning</h3>
                                    <div class="space-y-3">
                                        <div class="checkbox-wrapper">
                                            <label class="flex items-start gap-3 cursor-pointer">
                                                <input type="checkbox" id="remove-extra-spaces" checked
                                                    class="w-4 h-4 mt-0.5 text-primary bg-gray-100 border-gray-300 rounded focus:ring-primary">
                                                <div>
                                                    <span class="block font-medium">Remove Extra Spaces</span>
                                                    <span class="description">Consolidates multiple spaces into
                                                        one</span>
                                                </div>
                                            </label>
                                        </div>
                                        <div class="checkbox-wrapper">
                                            <label class="flex items-start gap-3 cursor-pointer">
                                                <input type="checkbox" id="remove-empty-lines" checked
                                                    class="w-4 h-4 mt-0.5 text-primary bg-gray-100 border-gray-300 rounded focus:ring-primary">
                                                <div>
                                                    <span class="block font-medium">Remove Empty Lines</span>
                                                    <span class="description">Removes blank lines and whitespace</span>
                                                </div>
                                            </label>
                                        </div>
                                        <div class="checkbox-wrapper">
                                            <label class="flex items-start gap-3 cursor-pointer">
                                                <input type="checkbox" id="trim-lines" checked
                                                    class="w-4 h-4 mt-0.5 text-primary bg-gray-100 border-gray-300 rounded focus:ring-primary">
                                                <div>
                                                    <span class="block font-medium">Trim Line Spaces</span>
                                                    <span class="description">Removes leading/trailing spaces</span>
                                                </div>
                                            </label>
                                        </div>
                                    </div>
                                </div>

                                <!-- Text Formatting -->
                                <div class="option-group">
                                    <h3 class="text-sm font-medium text-gray-900 mb-4">Text Formatting</h3>
                                    <div class="space-y-3">
                                        <div class="checkbox-wrapper">
                                            <label class="flex items-start gap-3 cursor-pointer">
                                                <input type="checkbox" id="normalize-quotes" checked
                                                    class="w-4 h-4 mt-0.5 text-primary bg-gray-100 border-gray-300 rounded focus:ring-primary">
                                                <div>
                                                    <span class="block font-medium">Convert Smart Quotes</span>
                                                    <span class="description">Standardizes quote marks</span>
                                                </div>
                                            </label>
                                        </div>
                                        <div class="checkbox-wrapper">
                                            <label class="flex items-start gap-3 cursor-pointer">
                                                <input type="checkbox" id="normalize-whitespace" checked
                                                    class="w-4 h-4 mt-0.5 text-primary bg-gray-100 border-gray-300 rounded focus:ring-primary">
                                                <div>
                                                    <span class="block font-medium">Normalize Whitespace</span>
                                                    <span class="description">Standardizes spaces and line
                                                        endings</span>
                                                </div>
                                            </label>
                                        </div>
                                        <div class="checkbox-wrapper tooltip">
                                            <label class="flex items-start gap-3 cursor-pointer">
                                                <input type="checkbox" id="normalize-dashes" checked
                                                    class="w-4 h-4 mt-0.5 text-primary bg-gray-100 border-gray-300 rounded focus:ring-primary">
                                                <div>
                                                    <span class="text-sm font-medium text-gray-700 block">Convert Em/En
                                                        Dashes</span>
                                                    <span class="text-xs text-gray-500">Standardizes dash types</span>
                                                </div>
                                            </label>
                                        </div>
                                    </div>
                                </div>

                                <!-- Advanced Options -->
                                <div class="option-group">
                                    <h3 class="text-sm font-medium text-gray-900 mb-4">Advanced Options</h3>
                                    <div class="space-y-3">
                                        <div class="checkbox-wrapper">
                                            <label class="flex items-start gap-3 cursor-pointer">
                                                <input type="checkbox" id="remove-punctuation"
                                                    class="w-4 h-4 mt-0.5 text-primary bg-gray-100 border-gray-300 rounded focus:ring-primary">
                                                <div>
                                                    <span class="block font-medium">Remove Punctuation</span>
                                                    <span class="description">Strips all punctuation marks</span>
                                                </div>
                                            </label>
                                        </div>
                                        <div class="checkbox-wrapper">
                                            <label class="flex items-start gap-3 cursor-pointer">
                                                <input type="checkbox" id="convert-newlines"
                                                    class="w-4 h-4 mt-0.5 text-primary bg-gray-100 border-gray-300 rounded focus:ring-primary">
                                                <div>
                                                    <span class="block font-medium">Convert Newlines</span>
                                                    <span class="description">Changes line breaks to spaces</span>
                                                </div>
                                            </label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>
                </div>
            </div>
        </main>

        <script type="module" src="@components/footer.js"></script>
        <script type="module" src="@components/toast.js"></script>
        <script type="module" src="./index.js"></script>
    </body>

</html>
