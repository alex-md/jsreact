<!DOCTYPE html>
<html lang="en">

    <head>
        <!-- Google tag (gtag.js) -->
        <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZEFG04PXR7"></script>
        <script>
            window.dataLayer = window.dataLayer || [];
            function gtag() { dataLayer.push(arguments); }
            gtag('js', new Date());
            gtag('config', 'G-ZEFG04PXR7');
        </script>
        <title>Keyword Density Analyzer</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Analyze keyword density and distribution in your text content.">
        <link rel="icon" type="image/png" href="./images/icon.png">
        <link rel="icon" type="image/png" sizes="16x16" href="./images/icon-16x16.png">
        <link rel="shortcut icon" href="./images/favicon.ico">
        <meta name="theme-color" content="#ffffff">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/7.2.0/mdb.min.css">
        <link rel="stylesheet" href="./styles/global.css">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    </head>

    <body class="bg-light">
        <header class="py-5 bg-white mb-4">
            <div class="container">
                <h1 class="fw-bold mt-4 text-center display-4 text-muted">Keyword Density Analyzer</h1>
                <p class="text-center lead text-muted">Analyze keyword distribution and density in your content</p>
            </div>
        </header>

        <main class="container pb-5">
            <div class="row g-4">
                <div class="col-lg-6">
                    <div class="card h-100">
                        <div class="card-body p-4">
                            <h2 class="h5 mb-4 fw-bold">Input Text</h2>
                            <div class="mb-4">
                                <label for="text-input" class="form-label">Paste your text here:</label>
                                <textarea id="text-input" class="form-control shadow-sm"></textarea>
                            </div>
                            <div class="mb-4">
                                <label for="keyword-input" class="form-label">Enter keywords:</label>
                                <input type="text" id="keyword-input" class="form-control shadow-sm"
                                    placeholder="e.g., keyword1, keyword2, etc..">
                            </div>
                            <div class="row g-3 align-items-end">
                                <div class="col-sm-6">
                                    <label for="window-size" class="form-label">Window Size:</label>
                                    <div class="input-group">
                                        <input type="number" id="window-size" value="80" class="form-control shadow-sm"
                                            min="1">
                                        <button id="auto-window" class="btn btn-outline-primary">Auto</button>
                                    </div>
                                </div>
                                <div class="col-sm-6">
                                    <div class="d-grid">
                                        <input type="file" id="file-upload" class="form-control shadow-sm">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-lg-6">
                    <div class="card h-100">
                        <div class="card-body p-4">
                            <h2 class="h5 mb-4 fw-bold d-flex align-items-center">
                                <i class="fas fa-chart-bar me-2"></i>Analysis Results
                            </h2>

                            <!-- Metrics Overview -->
                            <div class="metrics-grid">
                                <div class="metric-card shadow-sm">
                                    <div class="metric-value" id="density-value">0%</div>
                                    <div class="metric-label">Keyword Density</div>
                                    <div class="progress density-progress mt-2">
                                        <div class="progress-bar bg-success" id="density-bar" style="width: 0%"></div>
                                    </div>
                                </div>
                                <div class="metric-card shadow-sm">
                                    <div class="metric-value" id="keywords-found">0</div>
                                    <div class="metric-label">Keywords Found</div>
                                </div>
                            </div>

                            <!-- Keyword Analysis -->
                            <div class="result-card shadow-sm p-3 mb-4"></div>
                            <h6 class="fw-bold mb-3">Keyword Distribution</h6>
                            <div id="keyword-stats" class="d-flex flex-wrap gap-2"></div>
                        </div>

                        <!-- Text Analysis -->
                        <div class="result-card shadow-sm p-3">
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <h6 class="fw-bold mb-0">Analyzed Text</h6>
                                <div class="d-flex gap-2 align-items-center">
                                    <div class="badge bg-light text-dark" id="cluster-info"></div>
                                    <button id="jump-to-cluster" class="btn btn-sm btn-primary d-none">
                                        <i class="fas fa-arrow-down me-1"></i>Jump to Cluster
                                    </button>
                                </div>
                            </div>
                            <div id="highlighted-text" class="p-3 bg-light rounded position-relative"></div>
                        </div>
                    </div>
                </div>
            </div>
            </div>
        </main>

        <div id="loading" class="loading-overlay position-fixed top-0 start-0 w-100 h-100 d-none">
            <div class="h-100 d-flex align-items-center justify-content-center">
                <div class="spinner-border text-primary"></div>
            </div>
        </div>

        <script src="./components/navbar.js"></script>
        <script src="./scripts/keyword.js"></script>
    </body>

</html>
