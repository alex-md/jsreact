<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
    <head>
        <script src="./components/head.js"></script>
        <script>
            createHead(
                'Keyword Density Analyzer',
                'Analyze keyword density and distribution in your text with advanced visualization tools.'
            );
        </script>
    </head>

    <body class="bg-gray-50">
        <script src="./components/navbar.js"></script>
        <script src="./components/header.js"></script>
        <script>
            document.body.appendChild(
                createHeader(
                    'Keyword Density Analyzer',
                    'Analyze keyword density and distribution in your text'
                )
            );
        </script>

        <main class="container mx-auto px-4 py-12 max-w-7xl">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <!-- Left Column: Input and Options -->
                <div class="space-y-6">
                    <!-- Input Section -->
                    <div class="bg-white rounded-xl shadow-lg hover:shadow-xl transition-shadow duration-300 overflow-hidden border border-gray-200">
                        <div class="p-6 space-y-4">
                            <h2 class="text-lg font-semibold text-gray-900">Text Input</h2>
                            <textarea id="input-text" rows="10" placeholder="Enter or paste your text here..."
                                class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-shadow text-gray-900"></textarea>
                            <div class="flex items-center gap-4">
                                <input type="file" id="file-input" accept=".txt" class="hidden">
                                <button id="upload-button"
                                    class="px-6 py-3 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-colors">
                                    Upload Text File
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Keywords Input -->
                    <div class="bg-white rounded-xl shadow-lg hover:shadow-xl transition-shadow duration-300 overflow-hidden border border-gray-200">
                        <div class="p-6 space-y-4">
                            <h2 class="text-lg font-semibold text-gray-900">Keywords</h2>
                            <div class="flex gap-3">
                                <input type="text" id="keyword-input" placeholder="Enter a keyword"
                                    class="flex-1 px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-shadow text-gray-900">
                                <button id="add-keyword"
                                    class="px-6 py-3 bg-primary text-white font-medium rounded-lg hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors">
                                    Add
                                </button>
                            </div>
                            <div id="keywords-list" class="flex flex-wrap gap-2 min-h-[2rem]"></div>
                            <div class="flex items-center gap-3">
                                <label for="window-size" class="text-sm font-medium text-gray-700">Window Size (words):</label>
                                <input type="number" id="window-size" value="100" min="10" max="1000"
                                    class="w-32 px-4 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-shadow text-gray-900">
                                <span class="text-sm text-gray-500">(10-1000 words)</span>
                            </div>
                        </div>
                    </div>

                    <button id="analyze-button"
                        class="w-full px-6 py-3 bg-primary text-white font-medium rounded-lg hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors">
                        Analyze Text
                    </button>
                </div>

                <!-- Right Column: Results -->
                <div id="results-section" class="hidden space-y-6">
                    <!-- Overview Section -->
                    <div class="bg-white rounded-xl shadow-lg hover:shadow-xl transition-shadow duration-300 overflow-hidden border border-gray-200">
                        <div class="p-6">
                            <h2 class="text-lg font-semibold text-gray-900 mb-4">Overview</h2>
                            <div class="grid grid-cols-2 gap-4">
                                <div class="bg-gray-50 rounded-lg p-4 text-center">
                                    <div class="text-sm font-medium text-gray-600">Total Words</div>
                                    <div id="total-words" class="text-2xl font-bold text-gray-900 mt-1">0</div>
                                </div>
                                <div class="bg-gray-50 rounded-lg p-4 text-center">
                                    <div class="text-sm font-medium text-gray-600">Total Keywords</div>
                                    <div id="total-keywords" class="text-2xl font-bold text-gray-900 mt-1">0</div>
                                </div>
                                <div class="bg-gray-50 rounded-lg p-4 text-center">
                                    <div class="text-sm font-medium text-gray-600">Overall Density</div>
                                    <div id="keyword-density" class="text-2xl font-bold text-gray-900 mt-1">0%</div>
                                </div>
                                <div class="bg-gray-50 rounded-lg p-4 text-center">
                                    <div class="text-sm font-medium text-gray-600">Intersection Score</div>
                                    <div id="intersection-score" class="text-2xl font-bold text-gray-900 mt-1">0</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Keyword Analysis -->
                    <div class="bg-white rounded-xl shadow-lg hover:shadow-xl transition-shadow duration-300 overflow-hidden border border-gray-200">
                        <div class="p-6">
                            <h2 class="text-lg font-semibold text-gray-900 mb-4">Keyword Analysis</h2>
                            <div class="overflow-x-auto">
                                <table class="w-full">
                                    <thead class="bg-gray-50">
                                        <tr>
                                            <th class="px-4 py-3 text-left text-sm font-medium text-gray-700">Keyword</th>
                                            <th class="px-4 py-3 text-left text-sm font-medium text-gray-700">Occurrences</th>
                                            <th class="px-4 py-3 text-left text-sm font-medium text-gray-700">Density</th>
                                            <th class="px-4 py-3 text-left text-sm font-medium text-gray-700">Top Cluster</th>
                                        </tr>
                                    </thead>
                                    <tbody id="keyword-table"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    <!-- Best Intersection -->
                    <div id="intersection-section" class="bg-white rounded-xl shadow-lg hover:shadow-xl transition-shadow duration-300 overflow-hidden border border-gray-200">
                        <div class="p-6">
                            <h2 class="text-lg font-semibold text-gray-900 mb-4">Best Keyword Intersection</h2>
                            <div id="intersection-text" class="p-4 bg-gray-50 rounded-lg text-gray-900"></div>
                        </div>
                    </div>

                    <!-- Distribution Chart -->
                    <div class="bg-white rounded-xl shadow-lg hover:shadow-xl transition-shadow duration-300 overflow-hidden border border-gray-200">
                        <div class="p-6">
                            <h2 class="text-lg font-semibold text-gray-900 mb-4">Distribution</h2>
                            <div id="distribution-chart" class="h-48 flex items-end gap-1"></div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <script src="./components/footer.js"></script>
        <script src="./scripts/keyword.js"></script>
    </body>
</html>
