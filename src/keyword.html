<!DOCTYPE html>
<html lang="en" class="scroll-smooth dark">

    <head>
        <!-- Google Analytics and common scripts -->
        <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZEFG04PXR7"></script>
        <script src="./scripts/common.js"></script>
        <script>
            initializeCommon();
        </script>

        <!-- Dark mode initialization -->
        <script>
            // Set dark mode as default
            if (!('theme' in localStorage)) {
                localStorage.theme = 'dark'
            }
        </script>

        <!-- Page-specific meta -->
        <title>Keyword Density Analyzer</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Analyze keyword density and distribution in your text content.">
        
        <!-- Canonical URL -->
        <link rel="canonical" href="https://jsreact.com/keyword.html">

        <!-- Favicons -->
        <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
        <link rel="manifest" href="/site.webmanifest">
        <link rel="shortcut icon" href="/favicon.ico">

        <!-- Tailwind CSS -->
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = {
                darkMode: 'class',
                theme: {
                    extend: {
                        colors: {
                            primary: '#0ea5e9',
                            secondary: '#27272a',
                        }
                    }
                }
            }
        </script>

        <!-- Font Awesome -->
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

        <!-- Custom styles -->
        <link href="./styles/global.css" rel="stylesheet">
        <style>
            /* Custom highlight styles */
            .highlight {
                @apply bg-primary/20 text-gray-700 dark:text-gray-200 px-1 rounded;
                transition: background-color 0.2s ease;
            }
            .highlight:hover {
                @apply bg-primary/30;
            }
            .highlight.active {
                @apply bg-primary/40 font-medium;
            }
            .cluster {
                @apply bg-yellow-100 dark:bg-yellow-900/30 px-1 rounded;
            }
            #keyword-stats {
                @apply text-gray-700 dark:text-gray-200;
            }
            #keyword-stats .keyword-stat {
                @apply flex items-center justify-between p-2 rounded hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors;
            }
            #keyword-stats .keyword-count {
                @apply text-sm font-medium text-gray-500 dark:text-gray-300;
            }
            #keyword-stats .keyword-bar {
                @apply h-1.5 bg-primary rounded-full transition-all duration-300;
            }
            #keyword-stats .keyword-bar-bg {
                @apply h-1.5 bg-gray-200 dark:bg-gray-700 rounded-full w-full;
            }
        </style>

        <!-- Theme color -->
        <meta name="theme-color" content="#09090b">
    </head>

    <body class="bg-gray-50 dark:bg-gray-900 min-h-screen">
        <header class="py-12 bg-white dark:bg-gray-800 shadow-sm">
            <div class="container mx-auto px-4 max-w-7xl">
                <h1 class="text-4xl md:text-5xl font-bold text-center text-gray-900 dark:text-white">
                    Keyword Density Analyzer
                </h1>
                <p class="mt-4 text-xl text-gray-600 dark:text-gray-300 text-center max-w-3xl mx-auto">
                    Analyze keyword distribution and density in your content
                </p>
            </div>
        </header>

        <main class="container mx-auto px-4 py-8 max-w-7xl">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <!-- Input Section -->
                <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm hover:shadow-md transition-shadow duration-300 overflow-hidden border border-gray-200 dark:border-gray-700">
                    <div class="p-8">
                        <h2 class="text-xl font-semibold text-gray-900 dark:text-white mb-8">Input Text</h2>
                        <div class="space-y-8">
                            <div>
                                <label for="text-input" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-3">
                                    Paste your text here:
                                </label>
                                <textarea id="text-input" rows="12" 
                                    class="w-full px-4 py-3 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-shadow text-gray-900 dark:text-white font-mono text-sm leading-relaxed"></textarea>
                            </div>
                            <div>
                                <label for="keyword-input" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-3">
                                    Enter keywords (comma-separated):
                                </label>
                                <input type="text" id="keyword-input" 
                                    class="w-full px-4 py-3 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-shadow text-gray-900 dark:text-white"
                                    placeholder="e.g., keyword1, keyword2, etc..">
                            </div>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                                <div>
                                    <label for="window-size" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-3">
                                        Window Size:
                                    </label>
                                    <div class="flex gap-3">
                                        <input type="number" id="window-size" value="80" min="1"
                                            class="flex-1 px-4 py-2 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-shadow text-gray-900 dark:text-white">
                                        <button id="auto-window" 
                                            class="px-4 py-2 bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors">
                                            Auto
                                        </button>
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-3">
                                        Upload File:
                                    </label>
                                    <input type="file" id="file-upload" accept=".txt,.doc,.docx"
                                        class="w-full px-4 py-2 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-shadow text-gray-700 dark:text-gray-300 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:bg-primary file:text-white hover:file:bg-primary/90">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Results Section -->
                <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm hover:shadow-md transition-shadow duration-300 overflow-hidden border border-gray-200 dark:border-gray-700">
                    <div class="p-8">
                        <h2 class="text-xl font-semibold text-gray-900 dark:text-white mb-8 flex items-center">
                            <i class="fas fa-chart-bar mr-2"></i>Analysis Results
                        </h2>

                        <div class="grid grid-cols-2 gap-6 mb-8">
                            <div class="bg-gray-50 dark:bg-gray-900 rounded-lg p-6">
                                <div class="text-3xl font-bold text-gray-900 dark:text-white mb-2" id="density-value">0%</div>
                                <div class="text-sm text-gray-600 dark:text-gray-400">Keyword Density</div>
                                <div class="mt-3 bg-gray-200 dark:bg-gray-700 rounded-full h-2">
                                    <div class="bg-primary h-2 rounded-full transition-all duration-300" id="density-bar" style="width: 0%"></div>
                                </div>
                            </div>
                            <div class="bg-gray-50 dark:bg-gray-900 rounded-lg p-6">
                                <div class="text-3xl font-bold text-gray-900 dark:text-white mb-2" id="keywords-found">0</div>
                                <div class="text-sm text-gray-600 dark:text-gray-400">Keywords Found</div>
                            </div>
                        </div>

                        <div class="bg-gray-50 dark:bg-gray-900 rounded-lg p-6 mb-8" id="keyword-stats">
                            <!-- Keyword stats will be populated here -->
                        </div>

                        <div>
                            <div class="flex justify-between items-center mb-4">
                                <h3 class="text-lg font-semibold text-gray-900 dark:text-white">Analyzed Text</h3>
                                <div class="flex items-center gap-3">
                                    <span class="px-3 py-1.5 bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300 rounded text-sm" id="cluster-info"></span>
                                    <button id="jump-to-cluster" 
                                        class="hidden px-4 py-1.5 bg-primary text-white rounded-lg text-sm hover:bg-primary/90 transition-colors">
                                        <i class="fas fa-arrow-down mr-1"></i>Jump to Cluster
                                    </button>
                                </div>
                            </div>
                            <div class="bg-gray-50 dark:bg-gray-900 rounded-lg p-6 h-auto">
                                <div id="highlighted-text" class="text-gray-700 dark:text-gray-200 font-mono text-sm leading-relaxed whitespace-pre-wrap"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <div id="loading" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50">
            <div class="h-full flex items-center justify-center">
                <div class="animate-spin rounded-full h-12 w-12 border-4 border-primary border-t-transparent"></div>
            </div>
        </div>

        <script src="./components/navbar.js"></script>
        <script src="./scripts/keyword.js"></script>
    </body>

</html>
