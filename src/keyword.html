<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyword Density Analyzer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/@shadcn/ui@0.0.1/dist/shadcn-ui.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="components/navbar.js"></script>
    <script src="components/header.js"></script>
    <script src="components/footer.js"></script>
    <script src="scripts/keyword.js"></script>
    <style>
        /* Override any dark mode styles */
        :root {
            color-scheme: light;
        }
        /* Ensure the page takes at least full viewport height */
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        main {
            flex: 1;
        }
        /* Make results section scrollable if needed */
        .results-scroll {
            max-height: calc(100vh - 2rem);
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #e5e7eb transparent;
        }
        .results-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .results-scroll::-webkit-scrollbar-track {
            background: transparent;
        }
        .results-scroll::-webkit-scrollbar-thumb {
            background-color: #e5e7eb;
            border-radius: 3px;
        }
        /* Ensure table header stays visible */
        .sticky-header {
            position: sticky;
            top: 0;
            background: white;
            z-index: 10;
        }
        /* Wider layout */
        .container {
            max-width: 1600px !important;
        }
        @media (min-width: 1024px) {
            .lg\:gap-12 {
                gap: 3rem;
            }
        }
        /* Enhanced overview stats styling */
        .stat-card {
            background: linear-gradient(145deg, #f1f1f1 0%, #d3d3d3 100%);
            box-shadow: 
                0 4px 6px -1px rgba(0, 0, 0, 0.1),
                0 2px 4px -1px rgba(0, 0, 0, 0.06),
                inset 0 2px 4px 0 rgba(255, 255, 255, 0.9);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, #3b82f6 0%, #60a5fa 100%);
            opacity: 0.5;
        }
        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 
                0 10px 15px -3px rgba(0, 0, 0, 0.1),
                0 4px 6px -2px rgba(0, 0, 0, 0.05),
                inset 0 2px 4px 0 rgba(255, 255, 255, 0.9);
        }
        .stat-value {
            background: linear-gradient(45deg, #1e40af, #3b82f6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }
        .stat-label {
            position: relative;
            z-index: 1;
        }
        .stat-label::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #3b82f6, transparent);
            opacity: 0.3;
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- Navbar and Header will be inserted here by JavaScript -->
    </div>

    <main class="container mx-auto px-6 py-8">
        <div class="mx-auto grid grid-cols-1 lg:grid-cols-2 lg:gap-12 gap-6">
            <!-- Left Column: Input and Options -->
            <div class="space-y-6">
                <!-- Input Section -->
                <div class="bg-white rounded-lg shadow p-8">
                    <h2 class="text-xl font-semibold mb-6 text-gray-900">Text Input</h2>
                    <div class="space-y-4">
                        <textarea
                            id="input-text"
                            class="w-full h-48 p-4 border rounded-md focus:ring-2 focus:ring-blue-500 text-base"
                            placeholder="Enter or paste your text here..."></textarea>
                        <div class="flex items-center space-x-4">
                            <input
                                type="file"
                                id="file-input"
                                accept=".txt"
                                class="hidden"
                            />
                            <button id="upload-button" class="px-6 py-2.5 bg-gray-100 hover:bg-gray-200 rounded-md text-gray-900">
                                Upload Text File
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Keywords Input -->
                <div class="bg-white rounded-lg shadow p-8">
                    <h2 class="text-xl font-semibold mb-6 text-gray-900">Keywords</h2>
                    <div class="space-y-4">
                        <div class="flex space-x-3">
                            <input
                                type="text"
                                id="keyword-input"
                                class="flex-1 p-3 border rounded-md text-base"
                                placeholder="Enter a keyword"
                            />
                            <button id="add-keyword" class="px-6 py-2.5 bg-blue-500 text-white rounded-md hover:bg-blue-600">
                                Add
                            </button>
                        </div>
                        <div id="keywords-list" class="flex flex-wrap gap-2 min-h-[2rem]"></div>
                        <div class="flex items-center space-x-3 mt-4">
                            <label for="window-size" class="text-base text-gray-600">Window Size (words):</label>
                            <input
                                type="number"
                                id="window-size"
                                class="w-32 p-3 border rounded-md text-base"
                                value="100"
                                min="10"
                                max="1000"
                            />
                            <span class="text-base text-gray-500">(10-1000 words)</span>
                        </div>
                    </div>
                </div>

                <button id="analyze-button" class="w-full py-4 bg-blue-600 text-white rounded-md hover:bg-blue-700 text-lg">
                    Analyze Text
                </button>
            </div>

            <!-- Right Column: Results -->
            <div id="results-section" class="hidden results-scroll space-y-8">
                <!-- Overview Section -->
                <div class="bg-white rounded-lg shadow-lg p-8">
                    <h2 class="text-xl font-semibold mb-6 text-gray-900 flex items-center gap-2">
                        <i class="fas fa-chart-pie text-blue-600"></i>
                        Overview
                    </h2>
                    <div class="grid grid-cols-2 gap-6">
                        <div class="stat-card text-center p-6 rounded-lg">
                            <div class="stat-label text-base text-gray-600">Total Words</div>
                            <div id="total-words" class="stat-value text-3xl font-bold mt-2">0</div>
                        </div>
                        <div class="stat-card text-center p-6 rounded-lg">
                            <div class="stat-label text-base text-gray-600">Total Keywords</div>
                            <div id="total-keywords" class="stat-value text-3xl font-bold mt-2">0</div>
                        </div>
                        <div class="stat-card text-center p-6 rounded-lg">
                            <div class="stat-label text-base text-gray-600">Overall Density</div>
                            <div id="keyword-density" class="stat-value text-3xl font-bold mt-2">0%</div>
                        </div>
                        <div class="stat-card text-center p-6 rounded-lg">
                            <div class="stat-label text-base text-gray-600">Intersection Score</div>
                            <div id="intersection-score" class="stat-value text-3xl font-bold mt-2">0</div>
                        </div>
                    </div>
                </div>

                <!-- Keyword Analysis -->
                <div class="bg-white rounded-lg shadow p-8">
                    <h2 class="text-xl font-semibold mb-6 text-gray-900">Keyword Analysis</h2>
                    <div class="overflow-x-auto">
                        <table class="w-full">
                            <thead class="bg-gray-50 sticky-header">
                                <tr>
                                    <th class="px-6 py-4 text-left text-base">Keyword</th>
                                    <th class="px-6 py-4 text-left text-base">Occurrences</th>
                                    <th class="px-6 py-4 text-left text-base">Density</th>
                                    <th class="px-6 py-4 text-left text-base">Top Cluster</th>
                                </tr>
                            </thead>
                            <tbody id="keyword-table"></tbody>
                        </table>
                    </div>
                </div>

                <!-- Best Intersection -->
                <div id="intersection-section" class="bg-white rounded-lg shadow p-8">
                    <h2 class="text-xl font-semibold mb-6 text-gray-900">Best Keyword Intersection</h2>
                    <div id="intersection-text" class="p-6 bg-gray-50 rounded-lg text-base"></div>
                </div>

                <!-- Distribution Chart -->
                <div class="bg-white rounded-lg shadow p-8">
                    <h2 class="text-xl font-semibold mb-6 text-gray-900">Distribution</h2>
                    <div id="distribution-chart" class="h-48 flex items-end space-x-1"></div>
                </div>

                <!-- Text Analysis -->
                <div class="bg-white rounded-lg shadow p-8">
                    <h2 class="text-xl font-semibold mb-6 text-gray-900">Text Analysis</h2>
                    <div class="space-y-4">
                        <div class="flex items-center justify-between">
                            <h3 class="text-lg font-medium">Highlighted Text</h3>
                            <div class="flex gap-4 text-base">
                                <span class="inline-flex items-center">
                                    <span class="w-4 h-4 inline-block bg-yellow-200 mr-2"></span>
                                    Keywords
                                </span>
                                <span class="inline-flex items-center">
                                    <span class="w-4 h-4 inline-block bg-green-200 mr-2"></span>
                                    Highest Density
                                </span>
                            </div>
                        </div>
                        <div id="highlighted-text" class="p-6 bg-gray-50 rounded-lg whitespace-pre-wrap text-gray-900 leading-relaxed text-base"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Force light mode
        document.documentElement.classList.remove('dark');
        localStorage.theme = 'light';
        
        document.addEventListener('DOMContentLoaded', () => {
            // Create and insert navbar
            const navbar = createNavbar();
            // Remove dark mode toggle button
            const darkModeBtn = navbar.querySelector('button[aria-label="Toggle dark mode"]');
            if (darkModeBtn) {
                darkModeBtn.remove();
            }
            document.getElementById('app').appendChild(navbar);

            // Create and insert header
            const header = createHeader('Keyword Density Analyzer', 'Analyze keyword frequency and distribution in your text');
            document.getElementById('app').appendChild(header);

            // Override any attempts to switch to dark mode
            const observer = new MutationObserver((mutations) => {
                mutations.forEach((mutation) => {
                    if (mutation.attributeName === 'class') {
                        document.documentElement.classList.remove('dark');
                    }
                });
            });
            
            observer.observe(document.documentElement, {
                attributes: true,
                attributeFilter: ['class']
            });
        });
    </script>
</body>
</html>
