<!DOCTYPE html>
<html lang="en" class="light">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Diff Checker</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link href="https://cdn.jsdelivr.net/npm/@shadcn/ui@0.0.1/dist/shadcn-ui.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
        <script src="https://cdnjs.cloudflare.com/ajax/libs/diff_match_patch/20121119/diff_match_patch.js"></script>
        <script src="components/navbar.js"></script>
        <script src="components/header.js"></script>
        <script src="components/footer.js"></script>
        <script src="scripts/diff.js"></script>
        <style>
            /* Override any dark mode styles */
            :root {
                color-scheme: light;
            }
            .diff-add {
                background-color: #dcfce7;
                color: #166534;
                text-decoration: none;
                padding: 0.125rem 0.25rem;
                margin: 0 0.125rem;
                border-radius: 0.25rem;
            }
            .diff-remove {
                background-color: #fee2e2;
                color: #991b1b;
                text-decoration: line-through;
                padding: 0.125rem 0.25rem;
                margin: 0 0.125rem;
                border-radius: 0.25rem;
            }
            .tooltip {
                position: relative;
            }
            .tooltip:hover .tooltip-text {
                opacity: 1;
                visibility: visible;
                transform: translate(-50%, -0.25rem);
            }
            .tooltip-text {
                position: absolute;
                left: 50%;
                bottom: calc(100% + 0.5rem);
                transform: translate(-50%, 0.5rem);
                padding: 0.5rem 1rem;
                background: #1f2937;
                color: white;
                font-size: 0.875rem;
                white-space: nowrap;
                border-radius: 0.375rem;
                opacity: 0;
                visibility: hidden;
                transition: all 0.2s ease;
                z-index: 50;
                pointer-events: none;
                box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            }
            .tooltip-text::after {
                content: '';
                position: absolute;
                left: 50%;
                top: 100%;
                transform: translateX(-50%);
                border-width: 0.25rem;
                border-style: solid;
                border-color: #1f2937 transparent transparent transparent;
            }
        </style>
    </head>

    <body class="bg-gray-50 min-h-screen">
        <div id="app">
            <!-- Navbar and Header will be inserted here by JavaScript -->
        </div>

        <main class="container mx-auto px-4 py-8">
            <div class="max-w-7xl mx-auto space-y-6">
                <!-- Text Input Section -->
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <!-- Original Text -->
                    <div class="bg-white rounded-xl shadow-sm border border-gray-100">
                        <div class="p-6 space-y-4">
                            <label for="original-text" class="block text-sm font-medium text-gray-700">
                                Original Text
                            </label>
                            <textarea 
                                id="original-text" 
                                rows="12" 
                                placeholder="Enter original text..."
                                class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-shadow text-gray-900 font-mono resize-none"
                            ></textarea>
                        </div>
                    </div>

                    <!-- Modified Text -->
                    <div class="bg-white rounded-xl shadow-sm border border-gray-100">
                        <div class="p-6 space-y-4">
                            <label for="modified-text" class="block text-sm font-medium text-gray-700">
                                Modified Text
                            </label>
                            <textarea 
                                id="modified-text" 
                                rows="12" 
                                placeholder="Enter modified text..."
                                class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-shadow text-gray-900 font-mono resize-none"
                            ></textarea>
                        </div>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="flex justify-center gap-4">
                    <button 
                        id="compare-button"
                        class="tooltip px-8 py-3 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors flex items-center gap-2"
                    >
                        <i class="fas fa-code-compare"></i>
                        Compare Texts
                        <span class="tooltip-text">Compare the two texts and show differences</span>
                    </button>
                    <button 
                        id="clear-button"
                        class="tooltip px-8 py-3 bg-gray-100 text-gray-700 font-medium rounded-lg hover:bg-gray-200 transition-colors flex items-center gap-2"
                    >
                        <i class="fas fa-trash-alt"></i>
                        Clear All
                        <span class="tooltip-text">Clear both text areas</span>
                    </button>
                </div>

                <!-- Diff Output -->
                <div id="diff-container" class="bg-white rounded-xl shadow-sm border border-gray-100 hidden">
                    <div class="border-b border-gray-200 px-6 py-4">
                        <h2 class="text-lg font-semibold text-gray-900 flex items-center gap-2">
                            <i class="fas fa-list-ul text-blue-600"></i>
                            Differences Found
                        </h2>
                    </div>
                    <div class="p-6">
                        <div class="mb-4 flex items-center gap-4">
                            <div class="flex items-center gap-2">
                                <span class="inline-block w-3 h-3 bg-green-100 rounded-full"></span>
                                <span class="text-sm text-gray-600">Added text</span>
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="inline-block w-3 h-3 bg-red-100 rounded-full"></span>
                                <span class="text-sm text-gray-600">Removed text</span>
                            </div>
                        </div>
                        <div id="diff-output" class="font-mono text-sm text-gray-900 whitespace-pre-wrap break-words"></div>
                    </div>
                </div>

                <!-- Error Message -->
                <div id="error-message" class="bg-red-50 text-red-700 p-4 rounded-lg hidden"></div>
            </div>
        </main>

        <!-- Toast Notification -->
        <div id="toast" class="fixed bottom-4 right-4 transform translate-y-full opacity-0 transition-all duration-300">
            <div class="bg-gray-800 text-white px-6 py-3 rounded-lg shadow-lg flex items-center gap-2">
                <i class="fas fa-info-circle"></i>
                <span id="toast-message"></span>
            </div>
        </div>

        <script>
            // Force light mode
            document.documentElement.classList.remove('dark');
            localStorage.theme = 'light';
            
            document.addEventListener('DOMContentLoaded', () => {
                // Create and insert navbar
                const navbar = createNavbar();
                // Remove dark mode toggle button
                const darkModeBtn = navbar.querySelector('button[aria-label="Toggle dark mode"]');
                if (darkModeBtn) {
                    darkModeBtn.remove();
                }
                document.getElementById('app').appendChild(navbar);

                // Create and insert header
                const header = createHeader('Diff Checker', 'Compare text differences between two versions');
                document.getElementById('app').appendChild(header);

                // Override any attempts to switch to dark mode
                const observer = new MutationObserver((mutations) => {
                    mutations.forEach((mutation) => {
                        if (mutation.attributeName === 'class') {
                            document.documentElement.classList.remove('dark');
                        }
                    });
                });
                
                observer.observe(document.documentElement, {
                    attributes: true,
                    attributeFilter: ['class']
                });
            });
        </script>
    </body>
</html>
