<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

    <head>
        <meta charset="UTF-8" />

        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Natural Keyword Inserter</title>
        <link rel="icon" href="/favicon.ico" type="image/x-icon" />

        <!-- Tailwind CSS -->
        <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.3.2/dist/tailwind.min.css" rel="stylesheet" />

        <script type="module">
            import { createHead } from '@components/head.js';

            createHead(
                'Keyword Inserter - Natural Text Insertion Tool',
                'Insert keywords and phrases into text naturally while preserving readability. Use the free text insertion tool for SEO drafts and content editing.',
                {
                    canonicalPath: '/insert/',
                    keywords: 'keyword inserter, text insertion tool, natural keyword insertion, SEO keyword tool, content editing tool, insert keywords into text'
                }
            );
        </script>

        <!-- SEO Meta Tags -->
        <meta name="keywords"
            content="keyword inserter, text insertion tool, natural keyword insertion, SEO keyword tool, content editing tool, insert keywords into text" />
        <meta name="author" content="JSreact" />
        <meta name="robots" content="index, follow" />
        <link rel="stylesheet" href="/assets/styles/global.css">
    </head>

    <body class="page-insert bg-background text-foreground antialiased pt-20 md:pt-16">
        <!--
    sticky navbar is ~4rem tall;
    on mobile, extra menu adds ~1rem,
    so pt-20 (5rem) mobile → md:pt-16 (4rem) desktop
  -->
        <main class="flex items-center justify-center max-h">
            <div class="w-full max-w-3xl bg-card rounded-2xl shadow-lg p-8 space-y-6">
                <!-- Title -->
                <h1 class="text-4xl font-extrabold text-center text-foreground">
                    Natural Keyword Inserter
                </h1>

                <!-- Error Message -->
                <div id="error-display" class="min-h-[1.5rem] text-red-600 font-medium"></div>

                <!-- Form -->
                <div class="space-y-6">
                    <!-- Text Input -->
                    <div>
                        <label for="text-input" class="block text-sm font-medium text-foreground">Enter your text</label>
                        <textarea id="text-input" rows="6" placeholder="Paste or type your text here…"
                            class="mt-1 block w-full px-4 py-3 border border-border rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 resize-y"></textarea>
                    </div>

                    <!-- Keyword Input -->
                    <div>
                        <label for="keyword-input" class="block text-sm font-medium text-foreground">Enter keyword (must
                            end in 'ing')</label>
                        <input type="text" id="keyword-input" placeholder="e.g., running, thinking, developing"
                            class="mt-1 block w-full px-4 py-3 border border-border rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
                    </div>

                    <!-- Frequency Slider -->
                    <div>
                        <div class="flex justify-between items-center">
                            <label for="frequency-slider" class="text-sm font-medium text-foreground">
                                Insertion Frequency
                                <span class="text-xs text-muted-foreground">(1 = Few, 10 = Many)</span>
                            </label>
                            <span id="frequency-value" class="text-sm font-semibold text-primary">5</span>
                        </div>
                        <input type="range" id="frequency-slider" min="1" max="10" value="5"
                            class="w-full mt-2 accent-blue-600" />
                    </div>
                </div>

                <!-- Action Button -->
                <button id="process-button"
                    class="w-full py-3 bg-primary text-primary-foreground font-semibold rounded-lg shadow hover:bg-primary focus:outline-none focus:ring-4 focus:ring-blue-300 transition-colors">
                    Insert Keyword
                </button>

                <!-- Output -->
                <div id="output-area" class="mt-8 bg-muted rounded-lg p-6 border border-border space-y-4">
                    <div class="flex justify-between items-center">
                        <h2 class="text-2xl font-bold text-foreground">Modified Text</h2>
                        <button id="copy-result-button"
                            class="px-4 py-2 bg-card text-foreground border border-border rounded-lg hover:bg-background focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors text-sm font-medium flex items-center gap-2">
                            <i class="fas fa-copy"></i> Copy
                        </button>
                    </div>
                    <p id="insertion-count" class="font-medium text-green-600">
                        Keywords inserted: 0
                    </p>
                    <div id="result-text"
                        class="bg-card p-4 rounded-md border border-border font-mono whitespace-pre-wrap min-h-[4rem]">
                    </div>
                </div>
            </div>
        </main>

        <script type="module" src="/components/toast.js"></script>
        <script type="module" src="./index.js"></script>

        <script type="module">
            import { initPageShell } from '@components/pageShell.js';
            initPageShell();
        </script>

    </body>


</html>
