<!DOCTYPE html>
<html lang="en" class="scroll-smooth dark">

    <head>
        <!-- Google Analytics -->
        <script src="./scripts/common.js"></script>
        <script>
            initializeCommon();
        </script>
        <title>Online Text Cleaner - Remove Formatting, Punctuation, and Whitespace | JSReact</title>

        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description"
            content="This free online text cleaner can be used to remove unwanted formatting, punctuation, and whitespace from your text. Includes a Find and Replace feature.">
        <meta name="keywords" content="text, cleaning, tool, formatting, punctuation, whitespace, find, replace">
        <link rel="canonical" href="https://jsreact.com/clean" />
        <link rel="icon" type="image/png" href="./images/favicon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="./images/favicon-16x16.png">
        <link rel="shortcut icon" href="./images/favicon.ico">
        
        <!-- Tailwind CSS -->
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = {
                darkMode: 'class',
                theme: {
                    extend: {
                        colors: {
                            primary: '#0ea5e9',
                            secondary: '#27272a',
                        }
                    }
                }
            }
        </script>

        <!-- Dark mode initialization -->
        <script>
            // Set dark mode as default
            if (!('theme' in localStorage)) {
                localStorage.theme = 'dark';
            }
        </script>
        
        <!-- Font Awesome -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
        
        <!-- Custom Styles -->
        <link rel="stylesheet" href="./styles/global.css">
        <style>
            #liveToast {
                visibility: hidden;
            }
            #liveToast.hidden {
                visibility: hidden;
                opacity: 0;
                transform: translateY(1rem);
            }
            #liveToast:not(.hidden) {
                visibility: visible;
                opacity: 1;
                transform: translateY(0);
            }
        </style>
        
        <meta name="theme-color" content="#09090b">
    </head>

    <body class="bg-gray-50 dark:bg-gray-900">
        <header class="py-16 bg-white dark:bg-gray-800 shadow-sm">
            <div class="container mx-auto px-4 max-w-7xl">
                <h1 class="text-4xl md:text-5xl font-bold text-center text-gray-900 dark:text-white">
                    Text Cleaner
                </h1>
                <p class="mt-4 text-xl text-gray-600 dark:text-gray-300 text-center max-w-3xl mx-auto">
                    Clean and format your text with powerful tools
                </p>
            </div>
        </header>

        <main class="container mx-auto px-4 py-12 max-w-7xl">
            <div class="space-y-6">
                <!-- Text Input/Output Section -->
                <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm hover:shadow-md transition-shadow duration-300 overflow-hidden border border-gray-200 dark:border-gray-700">
                    <div class="p-6">
                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                            <!-- Input -->
                            <div>
                                <label for="input" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                                    Input Text
                                </label>
                                <textarea id="input" 
                                    class="w-full px-4 py-3 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-shadow min-h-[300px] text-gray-900 dark:text-white"
                                    placeholder="Enter your text here"></textarea>
                            </div>
                            
                            <!-- Output -->
                            <div>
                                <label for="output" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                                    Output Text
                                </label>
                                <textarea id="output" 
                                    class="w-full px-4 py-3 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-shadow min-h-[300px] text-gray-900 dark:text-white"
                                    placeholder="Cleaned text will appear here" readonly></textarea>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm hover:shadow-md transition-shadow duration-300 overflow-hidden border border-gray-200 dark:border-gray-700">
                    <div class="p-6">
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <button type="button" id="cleanBtn"
                                class="px-6 py-3 bg-primary text-white font-medium rounded-lg hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors"
                                title="Trim, remove line breaks, remove double spaces">
                                Remove Line Breaks
                            </button>
                            <button type="button" id="removePunctuationBtn"
                                class="px-6 py-3 bg-primary text-white font-medium rounded-lg hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors">
                                Remove Punctuation
                            </button>
                            <button type="button" id="liveToastBtn"
                                class="px-6 py-3 bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors">
                                Copy to Clipboard
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Find and Replace Section -->
                <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm hover:shadow-md transition-shadow duration-300 overflow-hidden border border-gray-200 dark:border-gray-700">
                    <div class="p-6">
                        <h2 class="text-xl font-semibold text-gray-900 dark:text-white mb-6">Find and Replace</h2>
                        <div class="grid grid-cols-1 md:grid-cols-12 gap-4">
                            <div class="md:col-span-5">
                                <label for="findInput" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                                    Find
                                </label>
                                <input type="text" id="findInput" 
                                    class="w-full px-4 py-3 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-shadow text-gray-900 dark:text-white"
                                    placeholder="Text to find">
                            </div>
                            <div class="md:col-span-5">
                                <label for="replaceInput" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                                    Replace
                                </label>
                                <input type="text" id="replaceInput" 
                                    class="w-full px-4 py-3 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-shadow text-gray-900 dark:text-white"
                                    placeholder="Replace with">
                            </div>
                            <div class="md:col-span-2 flex items-end">
                                <button type="button" id="replaceBtn"
                                    class="w-full px-6 py-3 bg-primary text-white font-medium rounded-lg hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors">
                                    Replace All
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Toast Notification -->
            <div class="fixed bottom-4 right-4 z-50">
                <div id="liveToast" 
                    class="hidden bg-gray-800 text-white px-6 py-3 rounded-lg shadow-lg transform transition-all duration-300 ease-in-out opacity-0 translate-y-2 pointer-events-none">
                    <div class="flex items-center space-x-2">
                        <i class="fas fa-check-circle text-green-400"></i>
                        <span>Copied to clipboard!</span>
                    </div>
                </div>
            </div>
        </main>

        <script src="./components/navbar.js"></script>
        <script src="./scripts/clean.js"></script>
    </body>

</html>
