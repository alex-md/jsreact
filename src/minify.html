<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

    <head>
        <script src="./components/head.js"></script>
        <script>
            createHead(
                'Code Minifier',
                'Minify your JavaScript, CSS, and HTML code to reduce file size and improve load times.'
            );
        </script>
    </head>

    <body class="bg-gray-50">
        <script src="./components/navbar.js"></script>
        <script src="./components/header.js"></script>
        <script>
            document.body.appendChild(
                createHeader(
                    'Code Minifier',
                    'Minify your JavaScript, CSS, and HTML code'
                )
            );
        </script>

        <main class="container mx-auto px-4 py-12 max-w-7xl">
            <div class="space-y-6">
                <!-- Code Input/Output Section -->
                <div
                    class="bg-white rounded-xl shadow-lg hover:shadow-xl transition-shadow duration-300 overflow-hidden border border-gray-200">
                    <div class="p-6 space-y-6">
                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                            <!-- Input Section -->
                            <div>
                                <label for="input-code" class="block text-sm font-medium text-gray-700 mb-2">
                                    Input Code
                                </label>
                                <textarea id="input-code" rows="15" placeholder="Paste your code here..."
                                    class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-shadow text-gray-900 font-mono"></textarea>
                                <p id="input-size" class="mt-1 text-sm text-gray-500">0 bytes</p>
                            </div>

                            <!-- Output Section -->
                            <div>
                                <label for="output-code" class="block text-sm font-medium text-gray-700 mb-2">
                                    Minified Code
                                </label>
                                <textarea id="output-code" rows="15" readonly
                                    class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-shadow text-gray-900 font-mono"></textarea>
                                <p id="output-size" class="mt-1 text-sm text-gray-500">0 bytes</p>
                            </div>
                        </div>

                        <!-- Action Buttons -->
                        <div class="flex flex-wrap gap-4">
                            <button id="minify-button"
                                class="inline-flex items-center justify-center gap-2 px-6 py-3 bg-primary text-white font-medium rounded-lg hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all disabled:opacity-50 disabled:cursor-not-allowed">
                                <i class="fas fa-compress-alt"></i>
                                Minify Code
                            </button>
                            <button id="copy-button"
                                class="px-6 py-3 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-colors">
                                Copy Output
                            </button>
                            <button id="clear-button"
                                class="px-6 py-3 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-colors">
                                Clear All
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Options Section -->
                <div
                    class="bg-white rounded-xl shadow-lg hover:shadow-xl transition-shadow duration-300 overflow-hidden border border-gray-200">
                    <div class="border-b border-gray-200 px-6 py-4">
                        <h2 class="text-lg font-semibold text-gray-900 flex items-center gap-2">
                            <i class="fas fa-sliders-h text-primary"></i>
                            Compiler Options
                        </h2>
                    </div>
                    <div class="p-6 space-y-6">
                        <!-- Optimization Level -->
                        <div class="space-y-3">
                            <label class="block text-sm font-medium text-gray-900">Optimization Level</label>
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                                <div class="relative">
                                    <input type="radio" id="whitespace-only" name="optimization" value="WHITESPACE_ONLY"
                                        class="peer absolute opacity-0 w-full h-full cursor-pointer">
                                    <label for="whitespace-only" class="block p-4 bg-gray-50 rounded-lg border-2 border-gray-200 cursor-pointer
                                        peer-checked:border-primary peer-checked:bg-primary/5 peer-focus:ring-2 peer-focus:ring-primary/20
                                        transition-all">
                                        <div class="flex items-center justify-between">
                                            <span class="font-medium">Basic</span>
                                            <i class="fas fa-feather text-primary"></i>
                                        </div>
                                        <p class="mt-1 text-sm text-gray-600">Removes whitespace and comments only</p>
                                    </label>
                                </div>
                                <div class="relative">
                                    <input type="radio" id="simple" name="optimization" value="SIMPLE_OPTIMIZATIONS"
                                        checked class="peer absolute opacity-0 w-full h-full cursor-pointer">
                                    <label for="simple" class="block p-4 bg-gray-50 rounded-lg border-2 border-gray-200 cursor-pointer
                                        peer-checked:border-primary peer-checked:bg-primary/5 peer-focus:ring-2 peer-focus:ring-primary/20
                                        transition-all">
                                        <div class="flex items-center justify-between">
                                            <span class="font-medium">Standard</span>
                                            <i class="fas fa-optimize text-primary"></i>
                                        </div>
                                        <p class="mt-1 text-sm text-gray-600">Basic optimizations and name mangling</p>
                                    </label>
                                </div>
                                <div class="relative">
                                    <input type="radio" id="advanced" name="optimization" value="ADVANCED_OPTIMIZATIONS"
                                        class="peer absolute opacity-0 w-full h-full cursor-pointer">
                                    <label for="advanced" class="block p-4 bg-gray-50 rounded-lg border-2 border-gray-200 cursor-pointer
                                        peer-checked:border-primary peer-checked:bg-primary/5 peer-focus:ring-2 peer-focus:ring-primary/20
                                        transition-all">
                                        <div class="flex items-center justify-between">
                                            <span class="font-medium">Advanced</span>
                                            <i class="fas fa-rocket text-primary"></i>
                                        </div>
                                        <p class="mt-1 text-sm text-gray-600">Aggressive optimizations (may break code)
                                        </p>
                                    </label>
                                </div>
                            </div>
                        </div>

                        <!-- Additional Options -->
                        <div class="space-y-3">
                            <label class="block text-sm font-medium text-gray-900">Additional Options</label>
                            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                <div class="flex items-center gap-2 group">
                                    <input type="checkbox" id="use-types" class="w-4 h-4 text-primary border-gray-300 rounded focus:ring-primary
                                        focus:ring-offset-0 transition-all cursor-pointer">
                                    <label for="use-types"
                                        class="text-sm text-gray-700 cursor-pointer group-hover:text-gray-900">
                                        Enable Type Checking
                                        <span class="tooltip">Type-based optimizations</span>
                                    </label>
                                </div>
                                <div class="flex items-center gap-2 group">
                                    <input type="checkbox" id="language-out" checked class="w-4 h-4 text-primary border-gray-300 rounded focus:ring-primary
                                        focus:ring-offset-0 transition-all cursor-pointer">
                                    <label for="language-out"
                                        class="text-sm text-gray-700 cursor-pointer group-hover:text-gray-900">
                                        Modern Output (ES2020)
                                        <span class="tooltip">Use modern JavaScript features</span>
                                    </label>
                                </div>
                                <div class="flex items-center gap-2 group">
                                    <input type="checkbox" id="source-map" class="w-4 h-4 text-primary border-gray-300 rounded focus:ring-primary
                                        focus:ring-offset-0 transition-all cursor-pointer">
                                    <label for="source-map"
                                        class="text-sm text-gray-700 cursor-pointer group-hover:text-gray-900">
                                        Generate Source Map
                                        <span class="tooltip">Create source map file</span>
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <script src="./components/footer.js"></script>
        <script src="./components/toast.js"></script>
        <script src="./scripts/minify.js"></script>
    </body>

</html>
