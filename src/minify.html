<!DOCTYPE html>
<html lang="en" class="scroll-smooth dark">

    <head>
        <!-- Google Analytics -->
        <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZEFG04PXR7"></script>
        <script>
            initializeCommon();
        </script>
        
        <!-- Common JS -->
        <script src="./scripts/common.js"></script>

        <!-- Basic Meta Tags -->
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="description" content="Try out Terser, a JavaScript parser, mangler/compressor, and beautifier toolkit for ES6+ with Terser Playground.">
        <meta name="keywords" content="Terser, JavaScript, ES6+, parser, compressor, beautifier, playground">
        <title>Terser Playground | JavaScript Parser, Compressor & Beautifier</title>

        <!-- Canonical URL -->
        <link rel="canonical" href="https://jsreact.com/minify.html">

        <!-- Favicon -->
        <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
        <link rel="manifest" href="/favicon/site.webmanifest">

        <!-- Tailwind CSS -->
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = {
                darkMode: 'class',
                theme: {
                    extend: {
                        colors: {
                            primary: '#0ea5e9',
                            secondary: '#27272a',
                        }
                    }
                }
            }
        </script>

        <!-- Dark mode initialization -->
        <script>
            // Set dark mode as default
            if (!('theme' in localStorage)) {
                localStorage.theme = 'dark';
            }
        </script>

        <!-- Font Awesome -->
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

        <!-- Custom Styles -->
        <link href="./styles/global.css" rel="stylesheet">

        <!-- Theme Color -->
        <meta name="theme-color" content="#09090b">
    </head>

    <body class="bg-gray-50 dark:bg-gray-900">
        <header class="py-16 bg-white dark:bg-gray-800 shadow-sm">
            <div class="container mx-auto px-4 max-w-7xl">
                <h1 class="text-4xl md:text-5xl font-bold text-center text-gray-900 dark:text-white">
                    Terser Playground
                </h1>
                <p class="mt-4 text-xl text-gray-600 dark:text-gray-300 text-center max-w-3xl mx-auto">
                    A JavaScript parser, mangler/compressor, and beautifier toolkit for ES6+
                </p>
            </div>
        </header>

        <main class="container mx-auto px-4 py-12 max-w-7xl">
            <div class="space-y-8">
                <div>
                    <p class="text-xl text-gray-600 dark:text-gray-300 text-center max-w-3xl mx-auto">
                        Enter your JavaScript code below, choose some options, and click the "Minify" button to see the output.
                    </p>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm hover:shadow-md transition-shadow duration-300 overflow-hidden border border-gray-200 dark:border-gray-700">
                        <div class="p-6">
                            <h2 class="text-xl font-semibold text-gray-900 dark:text-white mb-4">Input JavaScript</h2>
                            <textarea id="input" class="w-full px-4 py-3 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-shadow font-mono" 
                                rows="12" 
                                placeholder="Input JavaScript Code:"></textarea>
                            <span id="inputSizeLabel" class="mt-2 text-sm text-gray-500 dark:text-gray-400 block"></span>
                        </div>
                    </div>

                    <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm hover:shadow-md transition-shadow duration-300 overflow-hidden border border-gray-200 dark:border-gray-700">
                        <div class="p-6">
                            <h2 class="text-xl font-semibold text-gray-900 dark:text-white mb-4">Output</h2>
                            <textarea id="output" class="w-full px-4 py-3 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-shadow font-mono" 
                                rows="12" 
                                readonly 
                                placeholder="Output:"></textarea>
                            <span id="outputSizeLabel" class="mt-2 text-sm text-gray-500 dark:text-gray-400 block"></span>
                        </div>
                    </div>
                </div>

                <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm hover:shadow-md transition-shadow duration-300 overflow-hidden border border-gray-200 dark:border-gray-700">
                    <div class="p-6">
                        <h2 class="text-xl font-semibold text-gray-900 dark:text-white mb-4">Options</h2>
                        <div class="flex flex-wrap gap-6">
                            <label class="inline-flex items-center">
                                <input type="checkbox" id="compress" checked
                                    class="w-4 h-4 text-primary bg-gray-100 border-gray-300 rounded focus:ring-primary dark:focus:ring-primary dark:ring-offset-gray-800 focus:ring-2 dark:bg-gray-700 dark:border-gray-600">
                                <span class="ml-2 text-sm font-medium text-gray-900 dark:text-gray-300">Compress</span>
                            </label>
                            <label class="inline-flex items-center">
                                <input type="checkbox" id="mangle" checked
                                    class="w-4 h-4 text-primary bg-gray-100 border-gray-300 rounded focus:ring-primary dark:focus:ring-primary dark:ring-offset-gray-800 focus:ring-2 dark:bg-gray-700 dark:border-gray-600">
                                <span class="ml-2 text-sm font-medium text-gray-900 dark:text-gray-300">Mangle</span>
                            </label>
                            <label class="inline-flex items-center">
                                <input type="checkbox" id="beautify" checked
                                    class="w-4 h-4 text-primary bg-gray-100 border-gray-300 rounded focus:ring-primary dark:focus:ring-primary dark:ring-offset-gray-800 focus:ring-2 dark:bg-gray-700 dark:border-gray-600">
                                <span class="ml-2 text-sm font-medium text-gray-900 dark:text-gray-300">Beautify</span>
                            </label>
                        </div>
                        <div class="mt-6 flex justify-center">
                            <button id="minify" 
                                class="inline-flex items-center justify-center px-6 py-3 border border-transparent text-base font-medium rounded-lg text-white bg-primary hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors">
                                Minify
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <script src="./components/navbar.js"></script>
        <script src="./scripts/minify.js"></script>
    </body>

</html>
