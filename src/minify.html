<!DOCTYPE html>
<html lang="en" class="scroll-smooth dark">
    <head>
        <script src="./components/head.js"></script>
        <script>
            createHead(
                'Code Minifier',
                'Minify your JavaScript, CSS, and HTML code to reduce file size and improve load times.'
            );
        </script>
    </head>

    <body class="bg-gray-50 dark:bg-gray-900">
        <script src="./components/header.js"></script>
        <script>
            document.body.appendChild(
                createHeader(
                    'Code Minifier',
                    'Minify your JavaScript, CSS, and HTML code'
                )
            );
        </script>

        <main class="container mx-auto px-4 py-12 max-w-7xl">
            <div class="space-y-6">
                <!-- Code Input/Output Section -->
                <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm hover:shadow-md transition-shadow duration-300 overflow-hidden border border-gray-200 dark:border-gray-700">
                    <div class="p-6 space-y-6">
                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                            <!-- Input Section -->
                            <div>
                                <label for="input-code" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                                    Input Code
                                </label>
                                <textarea id="input-code" rows="15" placeholder="Paste your code here..."
                                    class="w-full px-4 py-3 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-shadow text-gray-900 dark:text-white font-mono"></textarea>
                            </div>

                            <!-- Output Section -->
                            <div>
                                <label for="output-code" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                                    Minified Code
                                </label>
                                <textarea id="output-code" rows="15" readonly
                                    class="w-full px-4 py-3 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-shadow text-gray-900 dark:text-white font-mono"></textarea>
                            </div>
                        </div>

                        <!-- Action Buttons -->
                        <div class="flex flex-wrap gap-4">
                            <button id="minify-button"
                                class="px-6 py-3 bg-primary text-white font-medium rounded-lg hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors">
                                Minify Code
                            </button>
                            <button id="copy-button"
                                class="px-6 py-3 bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors">
                                Copy Output
                            </button>
                            <button id="clear-button"
                                class="px-6 py-3 bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors">
                                Clear All
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Options Section -->
                <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm hover:shadow-md transition-shadow duration-300 overflow-hidden border border-gray-200 dark:border-gray-700">
                    <div class="border-b border-gray-200 dark:border-gray-700 px-6 py-4">
                        <h2 class="text-lg font-semibold text-gray-900 dark:text-white">Minification Options</h2>
                    </div>
                    <div class="p-6 space-y-4">
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                            <div class="flex items-center">
                                <input type="checkbox" id="remove-comments" checked
                                    class="w-4 h-4 text-primary bg-gray-100 border-gray-300 rounded focus:ring-primary dark:bg-gray-700 dark:border-gray-600">
                                <label for="remove-comments" class="ml-2 text-sm text-gray-700 dark:text-gray-300">
                                    Remove Comments
                                </label>
                            </div>
                            <div class="flex items-center">
                                <input type="checkbox" id="mangle-names" checked
                                    class="w-4 h-4 text-primary bg-gray-100 border-gray-300 rounded focus:ring-primary dark:bg-gray-700 dark:border-gray-600">
                                <label for="mangle-names" class="ml-2 text-sm text-gray-700 dark:text-gray-300">
                                    Mangle Variable Names
                                </label>
                            </div>
                            <div class="flex items-center">
                                <input type="checkbox" id="compress-code" checked
                                    class="w-4 h-4 text-primary bg-gray-100 border-gray-300 rounded focus:ring-primary dark:bg-gray-700 dark:border-gray-600">
                                <label for="compress-code" class="ml-2 text-sm text-gray-700 dark:text-gray-300">
                                    Compress Code
                                </label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <script src="./components/navbar.js"></script>
        <script src="./components/footer.js"></script>
        <script src="./components/toast.js"></script>
        <script src="./scripts/minify.js"></script>
    </body>
</html>
