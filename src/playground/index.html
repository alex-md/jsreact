<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

    <head>
        <meta charset="UTF-8">

        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/x-icon" href="/favicon.ico">

        <!-- Tailwind CSS is handled by Vite/PostCSS, CDN removed -->
        <!-- Tailwind CSS (if not already included globally) -->
        <script src="https://cdn.tailwindcss.com"></script>

        <!-- Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

        <!-- Font Awesome 6 Free CDN for icons -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
            crossorigin="anonymous" referrerpolicy="no-referrer" />

        <script type="module">
            import { createHead } from '@components/head.js';
            createHead(
                'JavaScript Playground - HTML CSS JS Online Editor',
                'Write HTML, CSS, and JavaScript in a browser playground with live preview, package controls, and an online code editor workflow.',
                {
                    keywords: 'javascript playground, code editor, html editor, css editor, online IDE, react playground, coding environment, html css js editor',
                    baseUrl: 'https://jsreact.com',
                    publishDate: '2025-05-07',
                    canonicalPath: '/playground/'
                }
            );
        </script>

        <title>JavaScript Playground | jsreact.com</title>
    </head>

    <body class="bg-gray-50 min-h-screen flex flex-col">

        <!-- Header will be injected by header.js -->
        <div id="header"></div>
        <script type="module">
            import { initPageShell } from '@components/pageShell.js';
            initPageShell({
                title: 'Code Playground',
                description: 'Live HTML, CSS, and JavaScript editor with instant previews.'
            });
        </script>

        <!-- Navbar will be injected by navbar.js -->
        <div id="navbar"></div>

        <main class="flex-grow flex flex-col items-center justify-center">
            <div id="root" class="w-full h-[80vh] rounded-lg overflow-hidden border shadow-lg">
            </div>
            </div>
        </main>

        <!-- Footer will be injected by footer.js -->
        <div id="footer"></div>
        <!-- Toast notifications container -->
        <div id="toast"></div>

        <script type="module" src="./main.jsx"></script>
    </body>

</html>
