<!DOCTYPE html>
<html lang="en" class="scroll-smooth dark">

    <head>
        <!-- Google Analytics -->
        <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZEFG04PXR7"></script>
        <script src="./scripts/common.js"></script>
        <script>initializeCommon();</script>

        <!-- Dark mode initialization -->
        <script>
            // Set dark mode as default
            if (!('theme' in localStorage)) {
                localStorage.theme = 'dark';
            }
        </script>

        <!-- Page-specific meta -->
        <title>Expression Finder</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Find expressions using arithmetic operations and parentheses to reach a target number.">
        
        <!-- Canonical URL -->
        <link rel="canonical" href="https://toolbot.ai/expression.html">

        <!-- Favicons -->
        <link rel="icon" type="image/png" href="./images/favicon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="./images/favicon-16x16.png">
        <link rel="shortcut icon" href="./images/favicon.ico">

        <!-- Tailwind CSS -->
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = {
                darkMode: 'class',
                theme: {
                    extend: {
                        colors: {
                            primary: '#0ea5e9',
                            secondary: '#27272a',
                        }
                    }
                }
            }
        </script>

        <!-- Font Awesome -->
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

        <!-- Custom styles -->
        <link href="./styles/global.css" rel="stylesheet">

        <!-- Theme color -->
        <meta name="theme-color" content="#09090b">
    </head>

    <body class="bg-gray-50 dark:bg-gray-900">
        <header class="py-16 bg-white dark:bg-gray-800 shadow-sm">
            <div class="container mx-auto px-4 max-w-7xl">
                <h1 class="text-4xl md:text-5xl font-bold text-center text-gray-900 dark:text-white">
                    Expression Finder
                </h1>
                <p class="mt-4 text-xl text-gray-600 dark:text-gray-300 text-center max-w-3xl mx-auto">
                    Find expressions using arithmetic operations and parentheses
                </p>
            </div>
        </header>

        <main class="container mx-auto px-4 py-12 max-w-7xl">
            <div class="max-w-3xl mx-auto space-y-6">
                <!-- Info Section -->
                <div class="text-center">
                    <button id="info-toggle"
                        class="px-6 py-2 bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors">
                        What is this?
                    </button>
                    <div id="calculator-description" class="hidden mt-4 bg-white dark:bg-gray-800 rounded-xl p-6 text-gray-600 dark:text-gray-300">
                        Enter a series of numbers and a target number, and our calculator will find a
                        valid expression using parentheses and basic arithmetic operations.
                    </div>
                </div>

                <!-- Main Calculator Card -->
                <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm hover:shadow-md transition-shadow duration-300 overflow-hidden border border-gray-200 dark:border-gray-700">
                    <div class="p-6 space-y-6">
                        <form id="expression-form" class="space-y-6">
                            <div>
                                <label for="numbers-input" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                                    Enter numbers (comma-separated):
                                </label>
                                <div class="flex gap-2">
                                    <input type="text" id="numbers-input" required
                                        class="flex-1 px-4 py-3 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-shadow">
                                    <button id="random-numbers-button" type="button"
                                        class="px-4 py-2 bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors">
                                        <i class="fas fa-random mr-2"></i>Generate
                                    </button>
                                </div>
                            </div>

                            <div>
                                <label for="target-input" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                                    Enter target number:
                                </label>
                                <input type="number" id="target-input" required
                                    class="w-full px-4 py-3 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-shadow">
                            </div>

                            <button type="submit" id="submit-button"
                                class="w-full px-6 py-3 bg-primary text-white font-medium rounded-lg hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors">
                                Find Expression
                            </button>
                        </form>

                        <div id="solution-output" class="hidden p-4 bg-gray-50 dark:bg-gray-900 rounded-lg text-center text-gray-900 dark:text-white"></div>

                        <!-- Advanced Settings -->
                        <div class="relative">
                            <button id="advanced-settings-toggle"
                                class="w-full px-6 py-3 bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors">
                                Advanced Settings
                            </button>
                            <div id="advanced-settings" class="hidden mt-4 p-4 bg-gray-50 dark:bg-gray-900 rounded-lg space-y-4">
                                <div>
                                    <label for="num-integers-input" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                                        Generated values
                                    </label>
                                    <input type="number" id="num-integers-input" placeholder="6"
                                        class="w-full px-4 py-2 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-shadow">
                                </div>
                                <div>
                                    <label for="max-number-input" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                                        Value upper limit
                                    </label>
                                    <input type="number" id="max-number-input" placeholder="60"
                                        class="w-full px-4 py-2 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-shadow">
                                </div>
                                <div class="flex items-center">
                                    <input type="checkbox" id="exponents-checkbox"
                                        class="w-4 h-4 text-primary bg-gray-100 border-gray-300 rounded focus:ring-primary dark:bg-gray-700 dark:border-gray-600">
                                    <label for="exponents-checkbox" class="ml-2 text-sm text-gray-700 dark:text-gray-300">
                                        Include Exponents
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <script src="./components/navbar.js"></script>
        <script src="./scripts/expression.js"></script>
    </body>

</html>
