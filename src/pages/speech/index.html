<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

    <head>
        <script type="module" src="../../components/head.js"></script>
        <script type="module">
            import { createHead } from '../../components/head.js';
            createHead(
                'Speech Tools - Text to Speech & Speech to Text',
                'Free online tool to convert between speech and text using OpenAI APIs. Features high-quality text-to-speech synthesis and accurate speech recognition.'
            );
        </script>
        <script src="https://unpkg.com/wavesurfer.js@7/dist/wavesurfer.min.js"></script>
    </head>

    <body class="bg-gray-50">
        <script type="module">
            import { createNavbar } from '/components/navbar.js';
            import { createHeader } from '/components/header.js';

            createNavbar();
            document.body.appendChild(
                createHeader(
                    'Speech Tools',
                    'Convert between speech and text using AI'
                )
            );
        </script>

        <main class="container mx-auto px-4 py-12 max-w-7xl">
            <div class="space-y-6">
                <!-- API Key Section -->
                <section
                    class="bg-white rounded-xl shadow-lg hover:shadow-xl transition-shadow duration-300 overflow-hidden border border-gray-200">
                    <div class="p-6">
                        <h2 class="text-lg font-semibold text-gray-900 flex items-center gap-2 mb-4">
                            <i class="fas fa-key text-primary"></i>
                            API Configuration
                        </h2>
                        <div class="flex gap-4">
                            <input type="password" id="apiKeyInput"
                                class="flex-1 px-4 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none"
                                placeholder="Enter your OpenAI API key">
                            <button id="saveApiKey"
                                class="px-6 py-2 bg-primary-500 text-white font-medium rounded-lg hover:bg-primary-600 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                                Save API Key
                            </button>
                        </div>
                    </div>
                </section>

                <!-- Main Features Grid -->
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <!-- Speech to Text Card -->
                    <section
                        class="bg-white rounded-xl shadow-lg hover:shadow-xl transition-shadow duration-300 overflow-hidden border border-gray-200">
                        <div class="p-6 space-y-4">
                            <h2 class="text-lg font-semibold text-gray-900 flex items-center gap-2">
                                <i class="fas fa-microphone text-primary"></i>
                                Speech to Text
                            </h2>
                            <div class="space-y-4">
                                <input type="file" id="audioFileInput" accept=".mp3,.mp4,.wav,.m4a"
                                    class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-primary-50 file:text-primary-700 hover:file:bg-primary-100">
                                <button id="transcribeFile" disabled
                                    class="w-full px-6 py-3 bg-primary-500 text-white font-medium rounded-lg hover:bg-primary-600 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                                    <i class="fas fa-wave-square mr-2"></i>
                                    Transcribe File
                                </button>
                                <textarea id="transcriptionOutput" readonly rows="8"
                                    class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none font-mono"
                                    placeholder="Transcription will appear here..."></textarea>
                            </div>
                        </div>
                    </section>

                    <!-- Text to Speech Card -->
                    <section
                        class="bg-white rounded-xl shadow-lg hover:shadow-xl transition-shadow duration-300 overflow-hidden border border-gray-200">
                        <div class="p-6 space-y-4">
                            <h2 class="text-lg font-semibold text-gray-900 flex items-center gap-2">
                                <i class="fas fa-volume-up text-primary"></i>
                                Text to Speech
                            </h2>
                            <div class="space-y-4">
                                <!-- Voice Selection -->
                                <div class="space-y-2">
                                    <label class="block text-sm font-medium text-gray-700">Voice</label>
                                    <select id="voiceSelect"
                                        class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none">
                                        <option value="alloy">Alloy (female)</option>
                                        <option value="echo">Echo (female)</option>
                                        <option value="fable">Fable (female)</option>
                                        <option value="nova">Nova (female)</option>
                                        <option value="shimmer">Shimmer (female)</option>
                                        <option value="onyx">Onyx (male)</option>
                                        <option value="ash">Ash (male)</option>
                                        <option value="coral">Coral (female)</option>
                                        <option value="sage">Sage (male)</option>
                                    </select>
                                </div>

                                <!-- Speed Control -->
                                <div class="space-y-2">
                                    <label class="block text-sm font-medium text-gray-700">
                                        Speaking Speed: <span id="speedValue">1.0</span>x
                                    </label>
                                    <input type="range" id="speedSlider"
                                        class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-primary-500"
                                        min="0.25" max="4.0" step="0.25" value="1.0">
                                </div>

                                <!-- HD Model Toggle -->
                                <label class="flex items-center gap-2 cursor-pointer">
                                    <input type="checkbox" id="hdModel"
                                        class="w-4 h-4 text-primary bg-gray-100 border-gray-300 rounded focus:ring-primary">
                                    <span class="text-sm text-gray-700">Use HD Model (higher quality, slower
                                        generation)</span>
                                </label>

                                <!-- Text Input -->
                                <textarea id="textInput" rows="4"
                                    class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none"
                                    placeholder="Enter text to convert to speech..."></textarea>

                                <button id="generateSpeech" disabled
                                    class="w-full px-6 py-3 bg-primary-500 text-white font-medium rounded-lg hover:bg-primary-600 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                                    <i class="fas fa-play mr-2"></i>
                                    Generate Speech
                                </button>

                                <!-- Audio Player -->
                                <div class="space-y-2">
                                    <div id="waveform" class="bg-gray-50 rounded-lg"></div>
                                    <audio id="audioPlayer" controls class="w-full"></audio>
                                </div>
                            </div>
                        </div>
                    </section>
                </div>
            </div>
        </main>

        <script type="module" src="../../components/footer.js"></script>
        <script type="module" src="../../components/toast.js"></script>
        <script type="module" src="./speech.js"></script>
    </body>

</html>
