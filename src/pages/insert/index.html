<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

    <head>
        <script type="module" src="../../components/head.js"></script>
        <script>
            createHead(
                'Insert Tool - Text Insertion and Manipulation',
                'Insert and manipulate text with powerful tools. Format, process, and modify text content easily.'
            );
        </script>

        <!-- Enhanced SEO Meta Tags -->
        <meta name="keywords" content="text insert, text manipulation, text processing, content insertion, text tools">
        <meta name="author" content="JSreact">
        <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">


        <style>
            h1 {
                text-align: center;
                color: #2c3e50;
                margin-bottom: 20px;
            }

            label {
                display: block;
                margin-bottom: 8px;
                font-weight: bold;
                color: #34495e;
            }

            textarea,
            input[type="text"] {
                width: 100%;
                padding: 10px;
                margin-bottom: 20px;
                border: 1px solid #ccc;
                border-radius: 4px;
                box-sizing: border-box;
                /* Include padding in width */
                font-size: 1rem;
            }

            textarea {
                min-height: 150px;
                resize: vertical;
            }

            /* Slider Styles */
            .slider-container {
                margin-bottom: 25px;
            }

            .slider-label {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 10px;
                /* Increased space */
            }

            input[type="range"] {
                width: 100%;
                cursor: pointer;
                margin-top: 5px;
                /* Space between label and slider */
            }

            #frequency-value {
                font-weight: bold;
                color: #3498db;
                min-width: 20px;
                /* Ensure space for two digits */
                text-align: right;
            }

            /* End Slider Styles */


            button:hover {
                background-color: #2980b9;
            }

            button:disabled {
                background-color: #bdc3c7;
                cursor: not-allowed;
            }

            #output-area {
                margin-top: 30px;
                border-top: 1px solid #eee;
                padding-top: 20px;
            }

            #output-area h2 {
                margin-bottom: 10px;
                color: #2c3e50;
            }

            #result-text {
                background-color: #ecf0f1;
                padding: 15px;
                border-radius: 4px;
                white-space: pre-wrap;
                /* Preserve line breaks and spaces */
                word-wrap: break-word;
                /* Break long words */
                border: 1px solid #bdc3c7;
                font-family: monospace;
                /* Often better for seeing exact text */
                min-height: 50px;
            }

            #insertion-count {
                margin-top: 15px;
                font-weight: bold;
                color: #27ae60;
            }

            .error-message {
                color: #e74c3c;
                font-weight: bold;
                margin-bottom: 15px;
                min-height: 1.2em;
                /* Prevent layout shift */
            }

            #process-button {
                background-color: #336bb8;
                color: white;
                box-shadow: 0px 0px 3px #ccc;
                border: 1px solid #336bb8;
                display: flex;
                padding: 10px 20px;
                font-size: 1rem;
            }
        </style>
    </head>

    <body class="bg-gray-50">
        <script type="module">
            import { createNavbar } from '/components/navbar.js';
            createNavbar();
        </script>

        <script>
            document.body.appendChild(
                createHeader(
                    'Insert Tool',
                    'Insert and manipulate text content'
                )
            );
        </script>

        <main class="container mx-auto px-4 py-12 max-w-7xl">

            <div class="container">
                <h1>Natural Keyword Inserter</h1>

                <div id="error-display" class="error-message"></div>

                <label for="text-input">Enter your text:</label>
                <textarea id="text-input" placeholder="Paste or type your text here..."></textarea>

                <label for="keyword-input">Enter keyword (must end in 'ing'):</label>
                <input type="text" id="keyword-input" placeholder="e.g., running, thinking, developing">

                <div class="slider-container">
                    <div class="slider-label">
                        <label for="frequency-slider">Insertion Frequency (1=Few, 10=Many):</label>
                        <span id="frequency-value">5</span>
                    </div>
                    <input type="range" id="frequency-slider" min="1" max="10" value="5">
                </div>

                <button id="process-button" class="btn-modern bg-primary text-primary-foreground hover:bg-accent">Insert
                    Keyword</button>

                <div id="output-area">
                    <h2>Modified Text:</h2>
                    <p id="insertion-count">Keywords inserted: 0</p>
                    <div id="result-text"></div>
                </div>
            </div>

        </main>

        <script type="module" src="../../components/footer.js"></script>
        <script type="module" src="../../components/toast.js"></script>
        <script type="module" src="./index.js"></script>
    </body>

</html>
