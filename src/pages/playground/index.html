<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

    <head>
        <script type="module" src="../../components/head.js"></script>
        <script>
            createHead(
                'Online Code Playground - Interactive HTML, CSS & JavaScript Editor',
                'Free online code editor with live preview. Write, test, and experiment with HTML, CSS, and JavaScript in real-time. Features library imports, console output, and auto-reload.'
            );
        </script>
        <!-- Icons -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
        <!-- SEO Meta Tags (These are fine as-is, but I've added a few) -->
        <meta name="keywords"
            content="code playground, online editor, html editor, css editor, javascript editor, live preview, code testing, web development tools, CDN import, library management, web dev, coding, frontend">
        <meta name="author" content="JSReact Tools">
        <meta name="robots" content="index, follow">
        <meta name="revisit-after" content="7 days">
        <meta name="language" content="English">


        <!-- Monaco Editor -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
        <style>
            :root {
                --bg-primary: #1e1e1e;
                --bg-secondary: #252526;
                --bg-tertiary: #2d2d2d;
                --text-primary: #d4d4d4;
                --text-secondary: #9cdcfe;
                --border-color: #404040;
                --accent-color: #0e639c;
                --accent-hover: #1177bb;
                --error-color: #f87171;
                --success-color: #4ade80;
                --warning-color: #fbbf24;
            }

            body {
                font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
                background-color: var(--bg-primary);
                color: var(--text-primary);
                margin: 0;
                padding: 0;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
            }

            /* Override nav styles */
            nav {
                position: sticky !important;
                top: 0 !important;
                z-index: 50 !important;
                border-bottom-width: 1px !important;
                width: 100% !important;
                background-color: #132743 !important;
                backdrop-filter: blur(8px) !important;
                color: white;
            }

            nav.nav-link {
                color: white !important;
            }

            main {
                flex: 1;
                padding: 1rem;
                background-color: var(--bg-primary);
            }

            .container {
                max-width: none;
                padding: 0 1rem;
                margin: 0 auto;
            }

            /* Library Menu Styles */
            .library-menu {
                position: absolute;
                top: 100%;
                right: 0;
                width: 300px;
                max-height: calc(100vh - 200px);
                overflow-y: auto;
                background: var(--bg-secondary);
                border: 1px solid var(--border-color);
                border-radius: 0.5rem;
                box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
                z-index: 50;
                padding: 1rem;
                margin-top: 0.5rem;
                display: none;
                color: var(--text-primary);
            }

            .library-menu.visible {
                display: block;
            }

            .library-category {
                margin-bottom: 1.5rem;
                border-top: 1px solid var(--border-color);
                padding-top: 1rem;
            }

            .library-category:first-child {
                border-top: none;
                padding-top: 0;
            }

            .library-category-title {
                color: var(--text-secondary);
                font-weight: 600;
                font-size: 0.875rem;
                margin-bottom: 0.75rem;
                padding-bottom: 0.25rem;
                border-bottom: 1px solid var(--border-color);
            }

            .library-item {
                display: flex;
                align-items: center;
                padding: 0.625rem;
                border-radius: 0.375rem;
                cursor: pointer;
                transition: all 0.2s;
                margin-bottom: 0.25rem;
            }

            .library-item:hover {
                background-color: var(--bg-tertiary);
            }

            .library-item-icon {
                width: 24px;
                height: 24px;
                display: flex;
                align-items: center;
                justify-content: center;
                margin-right: 0.75rem;
                font-size: 1.125rem;
            }

            .library-item-icon i {
                display: block;
            }

            .library-item-info {
                flex: 1;
            }

            .library-item-name {
                font-size: 0.875rem;
                font-weight: 500;
                color: var(--text-primary);
            }

            .library-item-version {
                font-size: 0.75rem;
                color: var(--text-secondary);
            }

            /* Custom CDN Input */
            #cdn-url-input,
            #cdn-type {
                width: 100%;
                padding: 0.5rem;
                background: var(--bg-tertiary);
                border: 1px solid var(--border-color);
                border-radius: 0.375rem;
                color: var(--text-primary);
                font-size: 0.875rem;
                outline: none;
            }

            #cdn-url-input:focus,
            #cdn-type:focus {
                border-color: var(--accent-color);
                box-shadow: 0 0 0 2px rgba(14, 99, 156, 0.2);
            }

            .custom-cdn-controls {
                display: flex;
                gap: 0.5rem;
                margin-top: 0.5rem;
            }

            #cdn-type {
                flex: 1;
            }

            #cdn-type option {
                background: var(--bg-secondary);
                color: var(--text-primary);
            }

            /* Button Styles */
            .btn {
                display: inline-flex;
                align-items: center;
                gap: 0.5rem;
                padding: 0.5rem 1rem;
                border-radius: 0.375rem;
                font-size: 0.875rem;
                font-weight: 500;
                cursor: pointer;
                transition: all 0.2s;
                background: var(--bg-secondary);
                color: var(--text-primary);
                border: 1px solid var(--border-color);
            }

            .btn:hover {
                background: var(--bg-tertiary);
            }

            .btn-primary {
                background: var(--accent-color);
                border-color: var(--accent-color);
                color: white;
            }

            .btn-primary:hover {
                background: var(--accent-hover);
            }

            /* Editor Container */
            .editor-container {
                height: calc(100vh - 12rem);
                display: flex;
                border: 1px solid var(--border-color);
                border-radius: 0.5rem;
                overflow: hidden;
                margin: 1rem 0;
                background: var(--bg-secondary);
            }

            .editor-pane {
                flex: 1;
                min-width: 200px;
                max-width: calc(100% - 300px);
                position: relative;
                overflow: hidden;
            }

            #editor {
                width: 100%;
                height: 100%;
            }

            .resizer {
                width: 4px;
                background: var(--border-color);
                cursor: col-resize;
                transition: background-color 0.2s;
            }

            .resizer:hover,
            .resizer.active {
                background: var(--accent-color);
            }

            .preview-pane {
                background: #ffffff;
                flex: 1;
                border-left: 1px solid var(--border-color);
                min-width: 300px;
            }

            #preview-frame {
                width: 100%;
                height: 100%;
                border: none;
                background: #ffffff;
            }

            /* Toggle Switch */
            .toggle-switch {
                position: relative;
                display: inline-block;
                width: 44px;
                height: 24px;
            }

            .toggle-switch input {
                opacity: 0;
                width: 0;
                height: 0;
            }

            .toggle-slider {
                position: absolute;
                cursor: pointer;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background-color: var(--bg-tertiary);
                transition: .4s;
                border-radius: 24px;
                border: 1px solid var(--border-color);
            }

            .toggle-slider:before {
                position: absolute;
                content: "";
                height: 18px;
                width: 18px;
                left: 2px;
                bottom: 2px;
                background-color: var(--text-primary);
                transition: .4s;
                border-radius: 50%;
            }

            input:checked+.toggle-slider {
                background-color: var(--accent-color);
            }

            input:checked+.toggle-slider:before {
                transform: translateX(20px);
            }

            /* Tab Buttons */
            .tab-button {
                padding: 0.5rem 1rem;
                background: var(--bg-secondary);
                color: var(--text-primary);
                border: 1px solid var(--border-color);
                border-bottom: none;
                border-radius: 0.5rem 0.5rem 0 0;
                cursor: pointer;
                transition: all 0.2s;
            }

            .tab-button:hover {
                background: var(--bg-tertiary);
            }

            .tab-button.active {
                background: var(--accent-color);
                color: white;
                border-color: var(--accent-color);
            }

            /* Console */
            .console-container {
                height: 200px;
                background: var(--bg-secondary);
                color: var(--text-primary);
                border-top: 2px solid var(--border-color);
                font-family: 'Consolas', 'Monaco', monospace;
                padding: 0.5rem;
                display: none;
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                z-index: 1000;
            }

            .console-container.visible {
                display: block;
            }

            .console-line {
                padding: 0.25rem 0.5rem;
                font-size: 0.875rem;
                border-bottom: 1px solid var(--border-color);
            }

            .console-line.error {
                color: var(--error-color);
            }

            .console-line.warn {
                color: var(--warning-color);
            }

            .console-line.info {
                color: var(--text-secondary);
            }

            /* Header and Navigation */
            header,
            nav {
                background: var(--bg-secondary);
                border-bottom: 1px solid var(--border-color);
                padding: 1rem;
            }

            /* Links */
            a {
                color: var(--accent-color);
                text-decoration: none;
                transition: color 0.2s;
            }

            a:hover {
                color: var(--accent-hover);
            }

            /* Scrollbar Styles */
            ::-webkit-scrollbar {
                width: 10px;
                height: 10px;
            }

            ::-webkit-scrollbar-track {
                background: var(--bg-secondary);
            }

            ::-webkit-scrollbar-thumb {
                background: var(--border-color);
                border-radius: 5px;
            }

            ::-webkit-scrollbar-thumb:hover {
                background: var(--accent-color);
            }

            /* Controls Layout */
            .controls-wrapper {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 1rem;
                position: relative;
            }

            .tab-group {
                display: flex;
                gap: 0.25rem;
            }

            .library-picker {
                position: relative;
            }

            .controls-bottom {
                display: flex;
                padding-top: 2rem;
                padding-bottom: 2rem;

            }

            .button-group {
                display: flex;
                gap: 0.5rem;
            }

            .auto-reload-toggle {
                display: flex;
                align-items: center;
                gap: 0.5rem;
            }

            .toggle-label {
                font-size: 0.875rem;
                color: var(--text-primary);
            }

            /* Ensure preview iframe takes full space */
            #preview-frame {
                width: 100%;
                height: 100%;
                border: none;
            }

            /* Remove any remaining Tailwind classes that might interfere */
            .container {
                max-width: none !important;
                padding: 0 1rem !important;
            }
        </style>
    </head>
    <!--  modern dark jsfiddle themed -->

    <body>
        <script type="module">
            import { createNavbar } from '/components/navbar.js';
            createNavbar();
        </script>
        <script>
            document.body.appendChild(
                createHeader(
                    'Code Playground',
                    'Write, test, and experiment with code in real-time'
                )
            );
        </script>

        <main class="container">
            <!-- Tabs and Library -->
            <div class="controls-wrapper">
                <div class="tab-group">
                    <button id="html-tab" class="tab-button active">HTML</button>
                    <button id="css-tab" class="tab-button">CSS</button>
                    <button id="js-tab" class="tab-button">JavaScript</button>
                </div>
                <div class="library-picker">
                    <button id="library-button" class="btn" aria-label="Import Library">
                        <i class="fas fa-puzzle-piece"></i>
                        Import Library
                    </button>
                    <!-- Library Selection Menu -->
                    <div id="library-menu" class="library-menu">
                        <!-- CSS Frameworks -->
                        <div class="library-category">
                            <h4 class="library-category-title">CSS Frameworks</h4>
                            <div class="library-list">
                                <div class="library-item" data-library="bootstrap">
                                    <div class="library-item-icon">
                                        <i class="fab fa-bootstrap"></i>
                                    </div>
                                    <div class="library-item-info">
                                        <div class="library-item-name">Bootstrap</div>
                                        <div class="library-item-version">v5.3.2</div>
                                    </div>
                                </div>
                                <div class="library-item" data-library="tailwind">
                                    <div class="library-item-icon">
                                        <i class="fab fa-css3" style="color: #38bdf8"></i>
                                    </div>
                                    <div class="library-item-info">
                                        <div class="library-item-name">Tailwind CSS</div>
                                        <div class="library-item-version">v3.3.5</div>
                                    </div>
                                </div>
                                <div class="library-item" data-library="bulma">
                                    <div class="library-item-icon">
                                        <i class="fas fa-leaf" style="color: #00d1b2"></i>
                                    </div>
                                    <div class="library-item-info">
                                        <div class="library-item-name">Bulma</div>
                                        <div class="library-item-version">v0.9.4</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <!-- UI Component Libraries -->
                        <div class="library-category">
                            <h4 class="library-category-title">UI Components</h4>
                            <div class="library-list">
                                <div class="library-item" data-library="daisyui">
                                    <div class="library-item-icon">
                                        <i class="fas fa-flower" style="color: #fbbf24"></i>
                                    </div>
                                    <div class="library-item-info">
                                        <div class="library-item-name">DaisyUI</div>
                                        <div class="library-item-version">v4.4.2</div>
                                    </div>
                                </div>
                                <div class="library-item" data-library="materialui">
                                    <div class="library-item-icon">
                                        <i class="fas fa-square" style="color: #1976d2"></i>
                                    </div>
                                    <div class="library-item-info">
                                        <div class="library-item-name">Material Design</div>
                                        <div class="library-item-version">v3.0.0</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <!-- JS Frameworks -->
                        <div class="library-category">
                            <h4 class="library-category-title">JavaScript Libraries</h4>
                            <div class="library-list">
                                <div class="library-item" data-library="jquery">
                                    <div class="library-item-icon">
                                        <i class="fab fa-js" style="color: #f7df1e"></i>
                                    </div>
                                    <div class="library-item-info">
                                        <div class="library-item-name">jQuery</div>
                                        <div class="library-item-version">v3.7.1</div>
                                    </div>
                                </div>
                                <div class="library-item" data-library="alpine">
                                    <div class="library-item-icon">
                                        <i class="fas fa-mountain" style="color: #77c1d2"></i>
                                    </div>
                                    <div class="library-item-info">
                                        <div class="library-item-name">Alpine.js</div>
                                        <div class="library-item-version">v3.13.0</div>
                                    </div>
                                </div>
                                <div class="library-item" data-library="react">
                                    <div class="library-item-icon">
                                        <i class="fab fa-react" style="color: #61dafb"></i>
                                    </div>
                                    <div class="library-item-info">
                                        <div class="library-item-name">React</div>
                                        <div class="library-item-version">v18.2.0</div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Custom CDN Input -->
                        <div class="library-category">
                            <h4 class="library-category-title">Custom CDN Link</h4>
                            <div class="custom-cdn-wrapper">
                                <input type="text" id="cdn-url-input"
                                    placeholder="Paste CDN URL here (e.g., https://cdn.../library.js)"
                                    aria-label="Custom CDN URL">
                                <div class="custom-cdn-controls">
                                    <select id="cdn-type" aria-label="CDN Type">
                                        <option value="js">JavaScript</option>
                                        <option value="css">CSS</option>
                                    </select>
                                    <button id="add-cdn-library" class="btn btn-primary">
                                        Add Library
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Editor and Preview -->
            <div class="editor-container">
                <!-- Editor Pane -->
                <div class="editor-pane">
                    <div id="editor"></div>
                </div>
                <!-- Resizer -->
                <div id="resizer" class="resizer"></div>
                <!-- Preview Pane -->
                <div class="preview-pane">
                    <iframe id="preview-frame" title="Code Preview"></iframe>
                </div>
            </div>

            <!-- Action Buttons and Console Toggle -->
            <div class="controls-bottom" controls-bottom flex mx-auto py-8>
                <div class="button-group">
                    <button id="run-button" class="btn btn-primary">
                        <i class="fas fa-play"></i> Run
                    </button>
                    <button id="copy-all-button" class="btn btn-primary">
                        <i class="fas fa-copy"></i> Merge & Copy
                    </button>
                    <button id="clear-button" class="btn">
                        <i class="fas fa-trash-alt"></i> Clear
                    </button>
                    <button id="toggle-console" class="btn">
                        <i class="fas fa-terminal"></i> Console
                    </button>
                </div>
                <div class="auto-reload-toggle">
                    <label class="toggle-switch" for="auto-reload">
                        <input type="checkbox" id="auto-reload" checked>
                        <span class="toggle-slider"></span>
                    </label>
                    <span class="toggle-label">Auto-reload</span>
                </div>
            </div>

            <!-- Console Section -->
            <div id="console" class="console-container mt-4 rounded-lg">
                <div id="console-content" aria-live="polite"></div> <!-- Added aria-live for accessibility -->
            </div>
        </main>

        <script type="module" src="../../components/footer.js"></script>
        <script type="module" src="../../components/toast.js"></script>
        <script type="module" src="./playground.js"></script>
    </body>

</html>
