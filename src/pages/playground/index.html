<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

    <head>
        <script type="module">
            import { createHead } from '@components/head.js';
            createHead(
                'Online Code Editor & Web Playground - Live HTML, CSS & JavaScript Editor',
                'Free online code editor and web playground with live preview. Write, test, and debug HTML, CSS, and JavaScript code in real-time. Features library imports, console output, auto-reload, and multiple pane layouts.'
            );
        </script>

        <!-- Enhanced SEO Meta Tags -->
        <meta name="keywords"
            content="online code editor, web playground, live code preview, html editor, css editor, javascript editor, code testing, web development tools, live coding, frontend playground">
        <meta name="author" content="JSreact">
        <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">

        <!-- Enhanced Social Media Meta Tags -->
        <meta property="article:tag" content="Code Editor">
        <meta property="article:tag" content="Web Development">
        <meta property="article:tag" content="Live Preview">
        <meta property="article:tag" content="Frontend Tools">

        <!-- Icons -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

        <!-- Monaco Editor -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
        <style>
            :root {
                --bg-primary: #1e1e1e;
                --bg-secondary: #252526;
                --bg-tertiary: #2d2d2d;
                --text-primary: #d4d4d4;
                --text-secondary: #9cdcfe;
                --border-color: #404040;
                --accent-color: #0e639c;
                --accent-hover: #1177bb;
                --error-color: #f87171;
                --error-color-alpha: rgba(248, 113, 113, 0.1);
                --success-color: #4ade80;
                --warning-color: #fbbf24;
                --warning-color-alpha: rgba(251, 191, 36, 0.1);
                --accent-color-alpha: rgba(14, 99, 156, 0.1);
            }

            body {
                font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
                background-color: var(--bg-primary);
                color: var(--text-primary);
                margin: 0;
                padding: 0;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
            }

            main {
                flex: 1;
                padding: 1rem;
                background-color: var(--bg-gray-800);
            }

            .container {
                max-width: none;
                padding: 0 1rem;
                margin: 0 auto;
            }

            /* Library Menu Styles */
            .library-menu {
                position: absolute;
                top: 100%;
                right: 0;
                width: 300px;
                max-height: calc(100vh - 200px);
                overflow-y: auto;
                background: var(--bg-secondary);
                border: 1px solid var(--border-color);
                border-radius: 0.5rem;
                box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
                z-index: 50;
                padding: 1rem;
                margin-top: 0.5rem;
                display: none;
                color: var(--text-primary);
            }

            .library-menu.visible {
                display: block;
            }

            .library-category {
                margin-bottom: 1.5rem;
                border-top: 1px solid var(--border-color);
                padding-top: 1rem;
            }

            .library-category:first-child {
                border-top: none;
                padding-top: 0;
            }

            .library-category-title {
                color: var(--text-secondary);
                font-weight: 600;
                font-size: 0.875rem;
                margin-bottom: 0.75rem;
                padding-bottom: 0.25rem;
                border-bottom: 1px solid var(--border-color);
            }

            .library-item {
                display: flex;
                align-items: center;
                padding: 0.625rem;
                border-radius: 0.375rem;
                cursor: pointer;
                transition: all 0.2s;
                margin-bottom: 0.25rem;
            }

            .library-item:hover {
                background-color: var(--bg-tertiary);
            }

            .library-item-icon {
                width: 24px;
                height: 24px;
                display: flex;
                align-items: center;
                justify-content: center;
                margin-right: 0.75rem;
                font-size: 1.125rem;
            }

            .library-item-icon i {
                display: block;
            }

            .library-item-info {
                flex: 1;
            }

            .library-item-name {
                font-size: 0.875rem;
                font-weight: 500;
                color: var(--text-primary);
            }

            .library-item-version {
                font-size: 0.75rem;
                color: var(--text-secondary);
            }

            /* Custom CDN Input */
            #cdn-url-input,
            #cdn-type {
                width: 100%;
                padding: 0.5rem;
                background: var(--bg-tertiary);
                border: 1px solid var(--border-color);
                border-radius: 0.375rem;
                color: var(--text-primary);
                font-size: 0.875rem;
                outline: none;
            }

            #cdn-url-input:focus,
            #cdn-type:focus {
                border-color: var(--accent-color);
                box-shadow: 0 0 0 2px rgba(14, 99, 156, 0.2);
            }

            .custom-cdn-controls {
                display: flex;
                gap: 0.5rem;
                margin-top: 0.5rem;
            }

            #cdn-type {
                flex: 1;
            }

            #cdn-type option {
                background: var(--bg-secondary);
                color: var(--text-primary);
            }

            /* Button Styles */
            .btn {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: var(--space-2);
                padding: var(--space-3) var(--space-6);
                font-size: var(--text-base);
                font-weight: 600;
                line-height: var(--leading-snug);
                border-radius: var(--radius-lg);
                border: 1px solid transparent;
                cursor: pointer;
                transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
                position: relative;
                overflow: hidden;
                background: hsl(var(--secondary));
                color: hsl(var(--secondary-foreground));
            }

            .btn:hover {
                background: hsl(var(--primary));
                color: hsl(var(--primary-foreground));
                transform: translateY(-1px);
            }

            .btn-primary {
                background: linear-gradient(135deg,
                        hsl(var(--primary)) 0%,
                        hsl(var(--primary-dark)) 100%);
                color: hsl(var(--primary-foreground));
                box-shadow:
                    0 4px 12px -2px hsla(var(--primary) / 0.3),
                    inset 0 0 0 1px hsla(var(--primary-foreground) / 0.1);
            }

            .btn-primary:hover {
                transform: translateY(-1px);
                background: linear-gradient(135deg,
                        hsl(var(--primary-dark)) 0%,
                        hsl(var(--primary)) 100%);
                box-shadow:
                    0 8px 16px -4px hsla(var(--primary) / 0.5),
                    inset 0 0 0 1px hsla(var(--primary-foreground) / 0.2);
            }

            /* Editor Container */
            .editor-container {
                height: calc(100vh - 12rem);
                display: flex;
                border: 1px solid hsla(var(--border) / 0.5);
                border-radius: var(--radius-xl);
                overflow: hidden;
                margin: var(--space-4) 0;
                background: hsla(var(--card) / 0.6);
                backdrop-filter: blur(12px);
                -webkit-backdrop-filter: blur(12px);
                box-shadow: var(--shadow-lg);
                background: var(--bg-secondary);
            }

            .editor-pane {
                flex: 1;
                min-width: 200px;
                max-width: calc(100% - 300px);
                position: relative;
                overflow: hidden;
            }

            #editor {
                width: 100%;
                height: 100%;
            }

            .resizer {
                width: 4px;
                background: var(--border-color);
                cursor: col-resize;
                transition: background-color 0.2s;
            }

            .resizer:hover,
            .resizer.active {
                background: var(--accent-color);
            }

            .preview-pane {
                background: #ffffff;
                flex: 1;
                border-left: 1px solid var(--border-color);
                min-width: 300px;
            }

            #preview-frame {
                width: 100%;
                height: 100%;
                border: none;
                background: #ffffff;
            }

            /* Toggle Switch */
            .toggle-switch {
                position: relative;
                display: inline-block;
                width: 44px;
                height: 24px;
            }

            .toggle-switch input {
                opacity: 0;
                width: 0;
                height: 0;
            }

            .toggle-slider {
                position: absolute;
                cursor: pointer;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background-color: var(--bg-tertiary);
                transition: .4s;
                border-radius: 24px;
                border: 1px solid var(--border-color);
            }

            .toggle-slider:before {
                position: absolute;
                content: "";
                height: 18px;
                width: 18px;
                left: 2px;
                bottom: 2px;
                background-color: var(--text-primary);
                transition: .4s;
                border-radius: 50%;
            }

            input:checked+.toggle-slider {
                background-color: var(--accent-color);
            }

            input:checked+.toggle-slider:before {
                transform: translateX(20px);
            }

            /* Tab Buttons */
            .tab-button {
                padding: 0.5rem 1rem;
                background: var(--bg-secondary);
                color: var(--text-primary);
                border: 1px solid var(--border-color);
                border-bottom: none;
                border-radius: 0.5rem 0.5rem 0 0;
                cursor: pointer;
                transition: all 0.2s;
            }

            .tab-button:hover {
                background: var(--bg-tertiary);
            }

            .tab-button.active {
                background: var(--accent-color);
                color: white;
                border-color: var(--accent-color);
            }

            /* Console */
            .console-container {
                height: 200px;
                background: var(--bg-secondary);
                color: var(--text-primary);
                border: 1px solid var(--border-color);
                border-radius: 8px;
                font-family: 'Consolas', 'Monaco', monospace;
                padding: 1rem;
                display: none;
                overflow-y: auto;
            }

            .console-container.visible {
                display: block;
            }

            #console-content {
                height: 100%;
                overflow-y: auto;
            }

            .console-line {
                padding: 0.25rem;
                font-size: 0.875rem;
                line-height: 1.4;
                border-bottom: 1px solid var(--border-color);
                white-space: pre-wrap;
                word-break: break-word;
            }

            .console-line:last-child {
                border-bottom: none;
            }

            .console-line.error {
                color: var(--error-color);
                background-color: var(--error-color-alpha);
            }

            .console-line.warn {
                color: var(--warning-color);
                background-color: var(--warning-color-alpha);
            }

            .console-line.info {
                color: var(--text-secondary);
                background-color: var(--accent-color-alpha);
            }

            /* Header and Navigation */
            nav {
                background: var(--bg-secondary);
                border-bottom: 1px solid var(--border-color);
                padding: 1rem;
            }

            /* Scrollbar Styles */
            ::-webkit-scrollbar {
                width: 10px;
                height: 10px;
            }

            ::-webkit-scrollbar-track {
                background: var(--bg-secondary);
            }

            ::-webkit-scrollbar-thumb {
                background: var(--border-color);
                border-radius: 5px;
            }

            ::-webkit-scrollbar-thumb:hover {
                background: var(--accent-color);
            }

            /* Controls Layout */
            .controls-wrapper {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 1rem;
                position: relative;
            }

            .tab-group {
                display: flex;
                gap: 0.25rem;
            }

            .library-picker {
                position: relative;
            }

            .controls-bottom {
                display: flex;
                padding-top: 2rem;
                padding-bottom: 2rem;

            }

            .button-group {
                display: flex;
                gap: 0.5rem;
            }

            .auto-reload-toggle {
                display: flex;
                align-items: center;
                gap: 0.5rem;
            }

            .toggle-label {
                font-size: 0.875rem;
                color: var(--text-primary);
            }

            /* Ensure preview iframe takes full space */
            #preview-frame {
                width: 100%;
                height: 100%;
                border: none;
            }

            /* Remove any remaining Tailwind classes that might interfere */
            .container {
                max-width: none !important;
                padding: 0 1rem !important;
            }
        </style>
    </head>
    <!--  modern dark jsfiddle themed -->

    <body class="bg-background text-foreground">
        <script type="module">
            import { createNavbar } from '@components/navbar.js';
            createNavbar();
        </script>

        <div id="header"></div>


        <main class="py-8">
            <!-- Tabs and Library -->
            <div class="controls-wrapper flex flex-wrap items-center justify-between gap-4 mb-4">
                <div class="tab-group flex gap-2">
                    <button id="html-tab" class="tab-button active" aria-label="HTML Tab"><i
                            class="fab fa-html5 mr-1"></i>HTML</button>
                    <button id="css-tab" class="tab-button" aria-label="CSS Tab"><i
                            class="fab fa-css3-alt mr-1"></i>CSS</button>
                    <button id="js-tab" class="tab-button" aria-label="JavaScript Tab"><i
                            class="fab fa-js-square mr-1"></i>JavaScript</button>
                </div>
                <div class="library-picker relative">
                    <button id="library-button" class="btn btn-secondary shadow-sm" aria-label="Import Library">
                        <i class="fas fa-puzzle-piece"></i>
                        Import Library
                    </button>
                    <!-- Library Selection Menu -->
                    <div id="library-menu" class="library-menu">
                        <!-- CSS Frameworks -->
                        <div class="library-category">
                            <h4 class="library-category-title">CSS Frameworks</h4>
                            <div class="library-list">
                                <div class="library-item" data-library="bootstrap">
                                    <div class="library-item-icon">
                                        <i class="fab fa-bootstrap"></i>
                                    </div>
                                    <div class="library-item-info">
                                        <div class="library-item-name">Bootstrap</div>
                                        <div class="library-item-version">v5.3.2</div>
                                    </div>
                                </div>
                                <div class="library-item" data-library="tailwind">
                                    <div class="library-item-icon">
                                        <i class="fab fa-css3" style="color: #38bdf8"></i>
                                    </div>
                                    <div class="library-item-info">
                                        <div class="library-item-name">Tailwind CSS</div>
                                        <div class="library-item-version">v3.3.5</div>
                                    </div>
                                </div>
                                <div class="library-item" data-library="bulma">
                                    <div class="library-item-icon">
                                        <i class="fas fa-leaf" style="color: #00d1b2"></i>
                                    </div>
                                    <div class="library-item-info">
                                        <div class="library-item-name">Bulma</div>
                                        <div class="library-item-version">v0.9.4</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <!-- UI Component Libraries -->
                        <div class="library-category">
                            <h4 class="library-category-title">UI Components</h4>
                            <div class="library-list">
                                <div class="library-item" data-library="daisyui">
                                    <div class="library-item-icon">
                                        <i class="fas fa-flower" style="color: #fbbf24"></i>
                                    </div>
                                    <div class="library-item-info">
                                        <div class="library-item-name">DaisyUI</div>
                                        <div class="library-item-version">v4.4.2</div>
                                    </div>
                                </div>
                                <div class="library-item" data-library="materialui">
                                    <div class="library-item-icon">
                                        <i class="fas fa-square" style="color: #1976d2"></i>
                                    </div>
                                    <div class="library-item-info">
                                        <div class="library-item-name">Material Design</div>
                                        <div class="library-item-version">v3.0.0</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <!-- JS Frameworks -->
                        <div class="library-category">
                            <h4 class="library-category-title">JavaScript Libraries</h4>
                            <div class="library-list">
                                <div class="library-item" data-library="jquery">
                                    <div class="library-item-icon">
                                        <i class="fab fa-js" style="color: #f7df1e"></i>
                                    </div>
                                    <div class="library-item-info">
                                        <div class="library-item-name">jQuery</div>
                                        <div class="library-item-version">v3.7.1</div>
                                    </div>
                                </div>
                                <div class="library-item" data-library="alpine">
                                    <div class="library-item-icon">
                                        <i class="fas fa-mountain" style="color: #77c1d2"></i>
                                    </div>
                                    <div class="library-item-info">
                                        <div class="library-item-name">Alpine.js</div>
                                        <div class="library-item-version">v3.13.0</div>
                                    </div>
                                </div>
                                <div class="library-item" data-library="react">
                                    <div class="library-item-icon">
                                        <i class="fab fa-react" style="color: #61dafb"></i>
                                    </div>
                                    <div class="library-item-info">
                                        <div class="library-item-name">React</div>
                                        <div class="library-item-version">v18.2.0</div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Custom CDN Input -->
                        <div class="library-category">
                            <h4 class="library-category-title">Custom CDN Link</h4>
                            <div class="custom-cdn-wrapper">
                                <input type="text" id="cdn-url-input"
                                    placeholder="Paste CDN URL here (e.g., https://cdn.../library.js)"
                                    aria-label="Custom CDN URL">
                                <div class="custom-cdn-controls">
                                    <select id="cdn-type" aria-label="CDN Type">
                                        <option value="js">JavaScript</option>
                                        <option value="css">CSS</option>
                                    </select>
                                    <button id="add-cdn-library" class="btn btn-primary">
                                        Add Library
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Editor and Preview -->
            <div class="editor-container flex rounded-2xl shadow-elegant overflow-hidden border border-border bg-card">
                <!-- Editor Pane -->
                <div class="editor-pane bg-background">
                    <div id="editor"></div>
                </div>
                <!-- Resizer -->
                <div id="resizer" class="resizer"></div>
                <!-- Preview Pane -->
                <div class="preview-pane bg-white border-l border-border">
                    <iframe id="preview-frame" title="Code Preview" class="rounded-none"></iframe>
                </div>
            </div>

            <!-- Action Buttons and Console Toggle -->
            <div class="controls-bottom flex flex-wrap items-center justify-between gap-4 py-6">
                <div class="button-group flex gap-2">
                    <button id="run-button" class="btn btn-primary shadow-sm"><i class="fas fa-play"></i> Run</button>
                    <button id="copy-all-button" class="btn btn-secondary"><i class="fas fa-copy"></i> Merge &
                        Copy</button>
                    <button id="clear-button" class="btn"><i class="fas fa-trash-alt"></i> Clear</button>
                    <button id="toggle-console" class="btn"><i class="fas fa-terminal"></i> Console</button>
                </div>
                <div class="auto-reload-toggle flex items-center gap-2">
                    <label class="toggle-switch" for="auto-reload">
                        <input type="checkbox" id="auto-reload" checked>
                        <span class="toggle-slider"></span>
                    </label>
                    <span class="toggle-label">Auto-reload</span>
                </div>
            </div> <!-- Console Section -->
            <div id="console" class="console-container">
                <div id="console-content" aria-live="polite">
                    <div class="console-line info">Console ready. Click "Run" to execute your code.</div>
                </div>
            </div>
        </main>

        <script type="module" src="../../components/footer.js"></script>
        <script type="module" src="../../components/toast.js"></script>
        <script type="module" src="./index.js"></script>
    </body>

</html>
