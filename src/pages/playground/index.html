<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/x-icon" href="/public/favicon.ico">

        <!-- Tailwind CSS is handled by Vite/PostCSS, CDN removed -->
        <!-- Tailwind CSS (if not already included globally) -->
        <script src="https://cdn.tailwindcss.com"></script>

        <!-- Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

        <!-- Font Awesome 6 Free CDN for icons -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
            crossorigin="anonymous" referrerpolicy="no-referrer" />

        <script type="module">
            import { createHead } from '@components/head.js';
            createHead(
                'JavaScript Playground',
                'Interactive JavaScript coding environment with HTML, CSS and real-time preview.',
                {
                    // SEO enhancements
                    keywords: 'javascript playground, code editor, html editor, css editor, online IDE, react playground, coding environment',
                    baseUrl: 'https://jsreact.com',
                    publishDate: '2025-05-07',
                    modifiedDate: '2025-05-07',
                    route: '/playground/',
                    canonical: 'https://jsreact.com/playground/'
                }
            );
        </script>

        <title>JavaScript Playground | jsreact.com</title>
    </head>

    <body class="bg-gray-50 dark:bg-gray-900 min-h-screen flex flex-col">

        <!-- Header will be injected by header.js -->
        <div id="header"></div>
        <script type="module">
            import { createHeader } from '@components/header.js';
            createHeader();
        </script>

        <!-- Navbar will be injected by navbar.js -->
        <div id="navbar"></div>
        <script type="module">
            import { createNavbar } from '@components/navbar.js';
            createNavbar('/playground/');
        </script>

        <main class="flex-grow">
            <div class="container mx-auto px-4 py-8">
                <div class="mb-6 text-center">
                    <h1 class="text-3xl font-bold text-gray-900 dark:text-white mb-2">JavaScript Playground</h1>
                    <p class="text-lg text-gray-600 dark:text-gray-300">
                        Interactive code editor with real-time preview for HTML, CSS, and JavaScript.
                    </p>
                </div>

                <div id="root"
                    class="w-full h-[80vh] rounded-lg overflow-hidden border border-gray-200 dark:border-gray-700 shadow-lg">
                </div>
            </div>
        </main>

        <!-- Footer will be injected by footer.js -->
        <div id="footer"></div>
        <script type="module">
            import { createFooter } from '@components/footer.js';
            createFooter();
        </script> <!-- Toast notifications container -->
        <div id="toast"></div>

        <script type="module" src="./main.jsx"></script>
    </body>

</html>
