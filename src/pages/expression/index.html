<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

    <head>
        <script src="../../components/head.js"></script>
        <script>
            createHead(
                'Expression Finder',
                'Find expressions using arithmetic operations and parentheses to reach a target number.'
            );
        </script>
    </head>

    <body class="bg-gray-50">
        <script src="../../components/navbar.js"></script>
        <script>
            document.body.appendChild(
                createHeader(
                    'Expression Finder',
                    'Find expressions using arithmetic operations and parentheses'
                )
            );
        </script>

        <main class="container mx-auto px-4 py-12 max-w-7xl">
            <div class="max-w-3xl mx-auto space-y-6">
                <!-- Info Section -->
                <div class="text-center">
                    <button id="info-toggle"
                        class="px-6 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-colors">
                        What is this?
                    </button>
                    <div id="calculator-description"
                        class="hidden fixed bottom-4 right-4 max-w-sm bg-white rounded-xl p-6 text-gray-600 shadow-xl border border-gray-200 transform transition-all duration-300 translate-y-full opacity-0 z-50">
                        <h3 class="text-lg font-semibold text-gray-900 mb-2">Expression Finder</h3>
                        <p class="mb-4">Enter a series of numbers and a target number, and our calculator will find a
                            valid expression using parentheses and basic arithmetic operations to reach that target.</p>
                        <p class="mb-2"><strong>Example:</strong></p>
                        <p>Numbers: 1,2,3,4</p>
                        <p>Target: 24</p>
                        <p>Result: ((4*3)*2)/1 = 24</p>
                    </div>
                </div>

                <!-- Main Calculator Card -->
                <div
                    class="bg-white rounded-xl shadow-lg hover:shadow-xl transition-shadow duration-300 overflow-hidden border border-gray-200">
                    <div class="p-6 space-y-6">
                        <form id="expression-form" class="space-y-6">
                            <div>
                                <label for="numbers-input" class="block text-sm font-medium text-gray-700 mb-2">
                                    Enter numbers (comma-separated):
                                </label>
                                <div class="flex gap-2">
                                    <input type="text" id="numbers-input" required
                                        class="flex-1 px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-shadow text-gray-900"
                                        placeholder="e.g., 1,2,3,4">
                                    <button id="random-numbers-button" type="button"
                                        class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-colors">
                                        <i class="fas fa-random mr-2"></i>Generate
                                    </button>
                                </div>
                            </div>

                            <div>
                                <label for="target-input" class="block text-sm font-medium text-gray-700 mb-2">
                                    Enter target number:
                                </label>
                                <input type="number" id="target-input" required
                                    class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-shadow text-gray-900"
                                    placeholder="e.g., 24">
                            </div>

                            <button type="submit" id="submit-button"
                                class="w-full px-6 py-3 bg-primary text-white font-medium rounded-lg hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors">
                                Find Expression
                            </button>
                        </form>

                        <div id="solution-output" class="hidden p-4 bg-gray-50 rounded-lg text-center text-gray-900">
                        </div>

                        <!-- Advanced Settings -->
                        <div class="relative">
                            <button id="advanced-settings-toggle"
                                class="w-full px-6 py-3 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-colors">
                                Advanced Settings
                            </button>
                            <div id="advanced-settings" class="hidden mt-4 p-4 bg-gray-50 rounded-lg space-y-4">
                                <div>
                                    <label for="num-integers-input"
                                        class="block text-sm font-medium text-gray-700 mb-2">
                                        Generated values
                                    </label>
                                    <input type="number" id="num-integers-input" placeholder="6"
                                        class="w-full px-4 py-2 bg-white border border-gray-200 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-shadow text-gray-900">
                                </div>
                                <div>
                                    <label for="max-number-input" class="block text-sm font-medium text-gray-700 mb-2">
                                        Value upper limit
                                    </label>
                                    <input type="number" id="max-number-input" placeholder="60"
                                        class="w-full px-4 py-2 bg-white border border-gray-200 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-shadow text-gray-900">
                                </div>
                                <div class="flex items-center">
                                    <input type="checkbox" id="exponents-checkbox"
                                        class="w-4 h-4 text-primary bg-gray-100 border-gray-300 rounded focus:ring-primary">
                                    <label for="exponents-checkbox" class="ml-2 text-sm text-gray-700">
                                        Include Exponents
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <script src="../../components/footer.js"></script>
        <script src="../../components/toast.js"></script>
        <script src="./expression.js"></script>
    </body>

</html>
