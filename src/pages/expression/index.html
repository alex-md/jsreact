<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script type="module">
            import { createHead } from '@components/head.js';
            createHead(
                'Expression Evaluator',
                'Evaluate mathematical and logical expressions with our easy-to-use calculator'
            );
        </script>
        <!-- Add KaTeX -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
        <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
        <!--For auto-rendering, if needed -->
        <script src="https://cdn.jsdelivr.net/npm/mathjs@12.2.1/lib/browser/math.js"></script>
    </head>

    <body class="bg-gray-50">
        <script type="module">
            import { createNavbar } from '@components/navbar.js';
            createNavbar();
        </script>

        <div id="header"></div>
        <!-- <script type="module">
            import { createHeader } from '@components/header.js';
            const header = createHeader(
                'Regular Expression Tester',
                'Test and validate your regular expressions in real-time'
            );
            document.getElementById('header').appendChild(header);
        </script> -->

        <style>
            #calculator-description {
                transition: transform 0.3s ease, opacity 0.3s ease;
            }

            #calculator-description.hiding {
                transform: translateY(100%);
                opacity: 0;
            }
        </style>

        <main class="container mx-auto px-4 py-8 max-w-3xl">
            <!-- Reduced max-w for smaller screens -->
            <div class="max-w-3xl mx-auto space-y-4">
                <!-- Reduced space-y -->

                <!-- Info Section -->
                <div class="text-center">
                    <button id="info-toggle"
                        class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-colors text-sm">
                        What is this?
                    </button>
                    <div id="calculator-description"
                        class="hidden fixed bottom-2 right-2 max-w-sm bg-white rounded-xl p-4 text-gray-600 shadow-xl border border-gray-200 transform transition-all duration-300 translate-y-full opacity-0 z-50 text-sm">
                        <!-- Reduced padding and font size -->
                        <h3 class="text-lg font-semibold text-gray-900 mb-1">Expression Finder</h3>
                        <!-- Reduced mb -->
                        <p class="mb-2">Enter a series of numbers and a target number, and our calculator will find a
                            valid expression using parentheses and basic arithmetic operations to reach that target.</p>
                        <p class="mb-1"><strong>Example:</strong></p>
                        <!-- Reduced mb -->
                        <p>Numbers: 1,2,3,4</p>
                        <p>Target: 24</p>
                        <p>Result: ((4*3)*2)/1 = 24</p>
                    </div>
                </div>

                <!-- Main Calculator Card -->
                <div
                    class="bg-white rounded-xl shadow-lg hover:shadow-xl transition-shadow duration-300 overflow-hidden border border-gray-200">
                    <div class="p-4 space-y-4 sm:p-6 sm:space-y-6">
                        <!-- Responsive padding and spacing -->
                        <form id="expression-form" class="space-y-4 sm:space-y-6">
                            <!-- Responsive spacing -->
                            <div>
                                <label for="numbers-input" class="block text-sm font-medium text-gray-700 mb-1">
                                    <!-- Reduced mb -->
                                    Enter numbers (comma-separated):
                                </label>
                                <div class="flex flex-col sm:flex-row gap-2">
                                    <!-- Stack on small screens -->
                                    <input type="text" id="numbers-input" required
                                        class="flex-1 px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-shadow text-gray-900 text-sm"
                                        placeholder="e.g., 1,2,3,4">
                                    <button id="random-numbers-button" type="button"
                                        class="w-full sm:w-auto px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-colors text-sm">
                                        <!-- Full width on small screens -->
                                        <i class="fas fa-random mr-2"></i>Generate
                                    </button>
                                </div>
                            </div>

                            <div>
                                <label for="target-input" class="block text-sm font-medium text-gray-700 mb-1">
                                    <!-- Reduced mb -->
                                    Enter target number:
                                </label>
                                <input type="number" id="target-input" required
                                    class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-shadow text-gray-900 text-sm"
                                    placeholder="e.g., 24">
                            </div>

                            <button type="submit" id="submit-button"
                                class="w-full px-4 py-2 bg-primary-500 text-white font-medium rounded-lg hover:bg-primary-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 transition-colors text-sm">
                                Find Expression
                            </button>
                        </form>

                        <div id="solution-output"
                            class="hidden p-3 bg-gray-50 rounded-lg text-center text-gray-900 text-sm">
                        </div>

                        <!-- Advanced Settings -->
                        <div class="relative">
                            <button id="advanced-settings-toggle"
                                class="w-full px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-colors text-sm">
                                Advanced Settings
                            </button>
                            <div id="advanced-settings" class="hidden mt-2 p-3 bg-gray-50 rounded-lg space-y-2">
                                <!-- Reduced spacing -->
                                <div>
                                    <label for="num-integers-input"
                                        class="block text-sm font-medium text-gray-700 mb-1">
                                        Generated values
                                    </label>
                                    <input type="number" id="num-integers-input" placeholder="5"
                                        class="w-full px-3 py-1 bg-white border border-gray-200 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-shadow text-gray-900 text-sm">
                                </div>
                                <div>
                                    <label for="max-number-input" class="block text-sm font-medium text-gray-700 mb-1">
                                        Value upper limit
                                    </label>
                                    <input type="number" id="max-number-input" placeholder="30"
                                        class="w-full px-3 py-1 bg-white border border-gray-200 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-shadow text-gray-900 text-sm">
                                </div>
                                <div class="flex items-center">
                                    <input type="checkbox" id="exponents-checkbox"
                                        class="w-4 h-4 text-primary bg-gray-100 border-gray-300 rounded focus:ring-primary">
                                    <label for="exponents-checkbox" class="ml-2 text-sm text-gray-700">
                                        Include Exponents
                                    </label>
                                </div>
                                <div class="flex items-center">
                                    <input type="checkbox" id="sqrt-checkbox"
                                        class="w-4 h-4 text-primary bg-gray-100 border-gray-300 rounded focus:ring-primary">
                                    <label for="sqrt-checkbox" class="ml-2 text-sm text-gray-700">Allow Square
                                        Roots</label>
                                </div>
                                <div class="flex items-center">
                                    <input type="checkbox" id="no-parentheses-checkbox"
                                        class="w-4 h-4 text-primary bg-gray-100 border-gray-300 rounded focus:ring-primary">
                                    <label for="no-parentheses-checkbox" class="ml-2 text-sm text-gray-700">
                                        Solve Without Parentheses
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <script type="module" src="../../components/footer.js"></script>
        <script type="module" src="../../components/toast.js"></script>
        <script type="module" src="./index.js"></script>
    </body>

</html>
