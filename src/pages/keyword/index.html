<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- Production-ready Tailwind CSS -->
        <script src="https://cdn.tailwindcss.com"></script>

        <!-- Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

        <script type="module">
            import { createHead } from '../../components/head';

            // Create head with enhanced SEO
            createHead(
                'Keyword Density Analyzer & SEO Content Optimization Tool',
                'Free online keyword density analyzer and content optimization tool. Analyze keyword frequency, find keyword clusters, and optimize your content for search engines. Perfect for SEO writers and content marketers.'
            );
        </script>

        <!-- Enhanced SEO Meta Tags -->
        <meta name="keywords"
            content="keyword density analyzer, keyword analysis tool, seo content optimization, keyword frequency counter, content analyzer, keyword clustering, text analysis, seo writing tool, keyword density calculator, content optimization">
        <meta name="author" content="JSreact">
        <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">

        <!-- Enhanced Social Media Meta Tags -->
        <meta property="article:tag" content="SEO Tools">
        <meta property="article:tag" content="Content Analysis">
        <meta property="article:tag" content="Keyword Research">
        <meta property="article:tag" content="Content Optimization">

        <!-- JSON-LD Structured Data -->
        <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "WebApplication",
            "name": "JSreact Keyword Analyzer",
            "applicationCategory": "SEOApplication",
            "operatingSystem": "Any",
            "description": "Advanced keyword density analysis and content optimization tool with real-time analysis and visualization features.",
            "offers": {
                "@type": "Offer",
                "price": "0",
                "priceCurrency": "USD"
            },
            "featureList": [
                "Keyword density analysis",
                "Real-time content analysis",
                "Keyword cluster detection",
                "Content optimization suggestions",
                "Visual keyword mapping",
                "Advanced text analysis",
                "SEO content scoring"
            ],
            "keywords": "keyword analyzer, seo tool, content optimization, keyword density",
            "browserRequirements": "Modern web browsers",
            "softwareVersion": "1.0",
            "applicationSubCategory": "Content Analysis"
        }
        </script>
    </head>

    <body class="bg-gray-50">
        <script type="module">
            import { createNavbar } from '/components/navbar.js';
            createNavbar();
        </script>

        <div id="root" class="min-h-screen">
            <!-- Loading state -->
            <div class="min-h-[60vh] flex items-center justify-center">
                <div class="text-center">
                    <div
                        class="animate-spin h-8 w-8 border-4 border-primary-500 border-t-transparent rounded-full mx-auto">
                    </div>
                    <p class="mt-4 text-gray-600">Loading analyzer...</p>
                </div>
            </div>
        </div>

        <script type="module" src="./index.jsx"></script>
        <script type="module" src="../../components/footer.js"></script>
    </body>

</html>
