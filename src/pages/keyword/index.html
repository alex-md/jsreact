<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- Production-ready Tailwind CSS -->
        <script src="https://cdn.tailwindcss.com"></script>

        <!-- Load React dependencies first -->
        <script type="importmap">
        {
            "imports": {
                "react": "https://esm.sh/react@18.2.0",
                "react-dom/client": "https://esm.sh/react-dom@18.2.0/client"
            }
        }
        </script>

        <!-- Load React -->
        <script type="module">
            import React from 'react';
            import { createRoot } from 'react-dom/client';
            window.React = React;
            window.ReactDOM = { createRoot };
        </script>

        <!-- Load Components First -->
        <script type="module" src="../../components/KeywordInput.js"></script>
        <script type="module" src="../../components/ResultsDisplay.js"></script>
        <script type="module" src="../../components/HighestDensityClusterDisplay.js"></script>
        <script type="module" src="../../components/FileUpload.js"></script>
        <script type="module" src="../../components/TextInput.js"></script>
        <script type="module" src="../../utils/utils.js"></script>
        <script type="module" src="../../utils/app.js"></script>

        <!-- Load head.js last since it depends on other components -->
        <script type="module">
            import { createHead } from '../../components/head.js';
            createHead(
                'Keyword Density Analyzer',
                'Analyze keyword density, find intersection clusters, and optimize your content with our advanced SEO text analysis tool.'
            );
        </script>

        <!-- Verify React Loading -->
        <script>
            window.addEventListener('load', function () {
                if (!window.React || !window.ReactDOM) {
                    console.error('React or ReactDOM not loaded');
                    document.getElementById('root').innerHTML = `
                    <div class="min-h-screen flex items-center justify-center p-4">
                        <div class="error-message">
                            <h2 class="font-bold mb-2">Error Loading Dependencies</h2>
                            <p>React libraries failed to load. Please check your internet connection and try again.</p>
                        </div>
                    </div>
                `;
                } else {
                    console.log('React version:', React.version);
                    console.log('ReactDOM version:', ReactDOM.version);
                }
            });
        </script>

        <!-- Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

        <!-- Error Handling -->
        <script>
            window.addEventListener('error', function (e) {
                if (e.target.tagName === 'SCRIPT') {
                    console.warn('Script loading error:', e.target.src);
                }
            }, true);
        </script>

        <!-- Tailwind Configuration -->
        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        colors: {
                            primary: {
                                50: '#f0f9ff',
                                100: '#e0f2fe',
                                200: '#bae6fd',
                                300: '#7dd3fc',
                                400: '#38bdf8',
                                500: '#0ea5e9',
                                600: '#0284c7',
                                700: '#0369a1',
                                800: '#075985',
                                900: '#0c4a6e',
                            },
                            neutral: {
                                850: '#1f2937',
                            },
                        },
                        fontFamily: {
                            sans: ['Inter var', 'Inter', 'system-ui', 'sans-serif'],
                            mono: ['JetBrains Mono', 'monospace'],
                        },
                        animation: {
                            'fade-in': 'fadeIn 0.5s ease-out forwards',
                            'slide-up': 'slideUp 0.6s ease-out forwards',
                            'slide-in': 'slideIn 0.5s ease-out forwards',
                            'float': 'float 3s ease-in-out infinite',
                            'shimmer': 'shimmer 2s linear infinite',
                            'spin-slow': 'spin 3s linear infinite',
                        },
                        keyframes: {
                            fadeIn: {
                                '0%': { opacity: '0' },
                                '100%': { opacity: '1' },
                            },
                            slideUp: {
                                '0%': { transform: 'translateY(20px)', opacity: '0' },
                                '100%': { transform: 'translateY(0)', opacity: '1' },
                            },
                            slideIn: {
                                '0%': { transform: 'translateX(-20px)', opacity: '0' },
                                '100%': { transform: 'translateX(0)', opacity: '1' },
                            },
                            float: {
                                '0%, 100%': { transform: 'translateY(0)' },
                                '50%': { transform: 'translateY(-10px)' },
                            },
                            shimmer: {
                                '100%': { transform: 'translateX(100%)' },
                            },
                        },
                        typography: theme => ({
                            DEFAULT: {
                                css: {
                                    maxWidth: 'none',
                                    color: theme('colors.gray.700'),
                                    p: {
                                        marginBottom: theme('spacing.6'),
                                        lineHeight: theme('lineHeight.relaxed'),
                                    },
                                    'h1, h2, h3, h4': {
                                        color: theme('colors.gray.900'),
                                        fontWeight: theme('fontWeight.semibold'),
                                    },
                                    mark: {
                                        backgroundColor: theme('colors.yellow.100'),
                                        padding: '0.2em 0.4em',
                                        borderRadius: theme('borderRadius.md'),
                                    },
                                },
                            },
                        }),
                    },
                },
            }
        </script>

        <!-- Custom Styles -->
        <style>
            @keyframes fadeIn {
                from {
                    opacity: 0;
                }

                to {
                    opacity: 1;
                }
            }

            @keyframes slideIn {
                from {
                    opacity: 0;
                    transform: translateX(-20px);
                }

                to {
                    opacity: 1;
                    transform: translateX(0);
                }
            }

            .animate-fade-in {
                animation: fadeIn 0.5s ease-out;
            }

            .hover-lift {
                transition: transform 0.2s ease-out, box-shadow 0.2s ease-out;
            }

            .hover-lift:hover {
                transform: translateY(-2px);
                box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            }

            mark {
                transition: background-color 0.3s ease;
            }

            /* Custom scrollbar */
            ::-webkit-scrollbar {
                width: 8px;
                height: 8px;
            }

            ::-webkit-scrollbar-track {
                background: #f1f5f9;
                border-radius: 4px;
            }

            ::-webkit-scrollbar-thumb {
                background: #94a3b8;
                border-radius: 4px;
            }

            ::-webkit-scrollbar-thumb:hover {
                background: #64748b;
            }

            /* Form element styles */
            input,
            select,
            textarea {
                transition: all 0.2s ease;
            }

            input:focus,
            select:focus,
            textarea:focus {
                outline: none;
                box-shadow: 0 0 0 2px rgba(14, 165, 233, 0.2);
            }

            /* Loading state animations */
            @keyframes pulse {

                0%,
                100% {
                    opacity: 1;
                }

                50% {
                    opacity: 0.5;
                }
            }

            .animate-pulse {
                animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
            }

            /* Error state styles */
            .error-message {
                background-color: #fee2e2;
                border: 1px solid #ef4444;
                color: #b91c1c;
                padding: 0.75rem;
                border-radius: 0.375rem;
                margin: 1rem 0;
            }

            /* Modern animations with reduced motion support */
            @media (prefers-reduced-motion: no-preference) {
                .animate-fade-in {
                    animation: fadeIn 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
                }

                .animate-slide-in {
                    animation: slideIn 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
                }
            }

            /* Enhanced hover effects */
            .hover-lift {
                transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1),
                    box-shadow 0.2s cubic-bezier(0.4, 0, 0.2, 1);
                will-change: transform, box-shadow;
            }

            .hover-lift:hover {
                transform: translateY(-2px);
                box-shadow: 0 10px 25px -3px rgba(0, 0, 0, 0.1),
                    0 4px 6px -2px rgba(0, 0, 0, 0.05);
            }

            /* Modern scrollbar styling */
            ::-webkit-scrollbar {
                width: 6px;
                height: 6px;
            }

            ::-webkit-scrollbar-track {
                background: #f8fafc;
                border-radius: 8px;
            }

            ::-webkit-scrollbar-thumb {
                background: #cbd5e1;
                border-radius: 8px;
                transition: background 0.2s ease;
            }

            ::-webkit-scrollbar-thumb:hover {
                background: #94a3b8;
            }

            /* Enhanced form elements */
            input,
            select,
            textarea {
                transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
                border: 1px solid #e2e8f0;
                border-radius: 0.375rem;
            }

            input:focus,
            select:focus,
            textarea:focus {
                outline: none;
                border-color: #0ea5e9;
                box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.15);
            }

            /* Shimmer effect for loading states */
            .shimmer {
                background: linear-gradient(90deg,
                        rgba(255, 255, 255, 0) 0%,
                        rgba(255, 255, 255, 0.8) 50%,
                        rgba(255, 255, 255, 0) 100%);
                background-size: 200% 100%;
                animation: shimmer 1.5s infinite;
            }

            /* Enhanced error states */
            .error-message {
                background-color: #fef2f2;
                border: 1px solid #fee2e2;
                color: #991b1b;
                padding: 1rem;
                border-radius: 0.5rem;
                margin: 1rem 0;
                box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
                display: flex;
                align-items: center;
                gap: 0.75rem;
            }

            .error-message::before {
                content: '⚠️';
                font-size: 1.25rem;
            }

            /* Glass morphism effect */
            .glass {
                background: rgba(255, 255, 255, 0.7);
                backdrop-filter: blur(10px);
                border: 1px solid rgba(255, 255, 255, 0.2);
            }
        </style>
    </head>

    <body class="bg-gray-50/80 min-h-screen flex flex-col text-gray-700">
        <script type="module" src="../../components/navbar.js"></script>

        <!-- Main content container -->
        <main class="flex-grow container-custom py-8">
            <div id="root">
                <!-- Loading state will be replaced by React -->
                <div class="min-h-[60vh] flex items-center justify-center">
                    <div class="text-center"></div>
                    <div
                        class="animate-spin h-8 w-8 border-4 border-primary-500 border-t-transparent rounded-full mx-auto">
                    </div>
                    <p class="mt-4 text-gray-600">Loading analyzer...</p>
                </div>
            </div>
        </main>

        <!-- Enhanced error template -->
        <template id="error-template">
            <div class="min-h-[60vh] flex items-center justify-center p-4">
                <div class="card-modern max-w-lg w-full text-center space-y-6">
                    <div class="text-4xl animate-float">⚠️</div>
                    <h2 class="text-xl font-semibold text-gray-900 dark:text-gray-100">Error Loading Application</h2>
                    <p class="text-gray-600 dark:text-gray-400">Please try refreshing the page. If the problem persists,
                        contact support.</p>
                    <button onclick="location.reload()"
                        class="btn-modern bg-primary-500 hover:bg-primary-600 text-white"></button>
                    <i class="fas fa-redo-alt mr-2"></i>
                    Refresh Page
                    </button>
                </div>
            </div>
        </template>

        <script type="module" src="../../components/footer.js"></script>

        <!-- Application Scripts -->
        <script type="module">
            // Wait for all dependencies to be loaded
            const init = async () => {
                try {
                    // Verify all required components are loaded
                    if (!window.KeywordInput || !window.React || !window.ReactDOM || !window.TextInput) {
                        throw new Error('Required components not loaded');
                    }

                    const root = document.getElementById('root');
                    if (!root) throw new Error('Root element not found');

                    // Create the app container component
                    const AppContainer = () => {
                        const [text, setText] = React.useState('');
                        const [keywords, setKeywords] = React.useState([]);
                        const [matchingStrategy, setMatchingStrategy] = React.useState('partial');
                        const [windowSize, setWindowSize] = React.useState(10);

                        return React.createElement('div', { className: 'space-y-8' },
                            // Page Header
                            React.createElement('div', { className: 'text-center mb-12' },
                                React.createElement('h1', {
                                    className: 'text-4xl font-bold text-gray-900 mb-4'
                                }, 'Keyword Density Analyzer'),
                                React.createElement('p', {
                                    className: 'text-lg text-gray-600 max-w-2xl mx-auto'
                                }, 'Analyze your text for keyword density and optimize your content for better SEO performance.')
                            ),

                            // Main Analysis Section
                            React.createElement('div', { className: 'grid grid-cols-1 lg:grid-cols-3 gap-8' },
                                // Left Column - Keywords Input
                                React.createElement('div', { className: 'lg:col-span-1' },
                                    React.createElement('div', {
                                        className: 'sticky top-4 space-y-6'
                                    },
                                        React.createElement(window.KeywordInput, {
                                            keywords,
                                            onKeywordsChange: setKeywords,
                                            matchingStrategy,
                                            onMatchingStrategyChange: setMatchingStrategy
                                        })
                                    )
                                ),

                                // Right Column - Text Input and Results
                                React.createElement('div', { className: 'lg:col-span-2 space-y-6' },
                                    // Text Input Options
                                    React.createElement('div', { className: 'grid grid-cols-1 gap-6' },
                                        React.createElement(window.TextInput, {
                                            onTextChange: setText
                                        }),
                                        React.createElement('div', {
                                            className: 'bg-white rounded-xl shadow-lg border border-gray-100 p-6'
                                        },
                                            React.createElement('h3', {
                                                className: 'text-lg font-semibold text-gray-900 mb-4'
                                            }, 'Or Upload a File'),
                                            React.createElement(window.FileUpload, {
                                                handleFileLoad: setText
                                            })
                                        )
                                    ),

                                    // Results Sections
                                    keywords.length > 0 && text && React.createElement('div', { className: 'space-y-8' },
                                        React.createElement(window.ResultsDisplay, {
                                            text,
                                            keywords,
                                            matchingStrategy,
                                            windowSize,
                                            utils: window.utils
                                        }),
                                        React.createElement(window.HighestDensityClusterDisplay, {
                                            text,
                                            keywords,
                                            windowSize,
                                            matchingStrategy,
                                            utils: window.utils
                                        })
                                    )
                                )
                            )
                        );
                    };

                    const appRoot = ReactDOM.createRoot(root);
                    appRoot.render(React.createElement(window.ErrorBoundary, null,
                        React.createElement(AppContainer)
                    ));
                    console.log('App rendered successfully');
                } catch (error) {
                    console.error('Error initializing app:', error);
                    document.getElementById('root').innerHTML = document.getElementById('error-template').innerHTML;
                }
            };

            // Initialize when everything is loaded
            window.addEventListener('load', init);
        </script>

    </body>

</html>
