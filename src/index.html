<!DOCTYPE html>
<html lang="en" class="smooth-scroll">

	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Web Tools Hub</title>
		<!-- Use Inter font for modern, readable typography -->
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
		<!-- Font Awesome 6 Free CDN -->
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
			crossorigin="anonymous" referrerpolicy="no-referrer" />
		<link rel="stylesheet" href="/assets/styles/main-header.css">
		<!-- Tailwind CSS (if not already included globally) -->
		<script src="https://cdn.tailwindcss.com"></script>
	</head>

	<body class="js-ready min-h-screen flex flex-col relative"
		style="background: linear-gradient(135deg, #f8fafc 0%, #ffffff 100%); color: #222">
		<!-- Enhanced grid overlay background with blur effect -->
		<div
			class="pointer-events-none fixed inset-0 z-0 bg-[linear-gradient(to_right,#94a3b8_1px,transparent_1px),linear-gradient(to_bottom,#94a3b8_1px,transparent_1px)] bg-[size:24px_24px] opacity-30 backdrop-blur-[6px] filter blur-[1.5px]">
		</div>
		</div>
		<script type="module">
			import { createNavbar } from './components/navbar.js';
			createNavbar();
		</script>
		<script type="module">
			import { createToolCards } from './components/toolCards.js';
			createToolCards();
		</script>

		<header class="header-banner">
			<div class="header-grid"></div>
			<div class="header-accent"></div>
			<div class="header-accent"></div>

			<div class="header-content">
				<div class="header-badge">
					<i class="fas fa-sparkles"></i>
					<span>Developer Tools</span>
				</div>
				<h1 class="header-title relative animate-slide-up">
					Web Tools <span class="border inline-block inline-flex mb-3 px-4">
						Hub
						<span
							class="absolute -bottom-1 left-0 w-full h-1 bg-gradient-to-r from-blue-500 to-purple-500 rounded animate-pulse-slow"></span>
					</span>
				</h1>
				<p class="header-description relative animate-slide-up" style="animation-delay: 200ms;">
					A collection of <span class="font-semibold text-blue-500">free developer tools</span> to
					<span class="relative inline-block">
						simplify your workflow
						<i class="fas fa-sparkles text-xs text-yellow-400 absolute -top-2 -right-2 animate-sparkle"></i>
					</span>
					and boost productivity
				</p>
				<div class="mt-4 flex justify-center gap-2 animate-slide-up" style="animation-delay: 300ms;">
					<span
						class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-blue-100 text-blue-800">
						<i class="fas fa-bolt mr-1"></i> Fast
					</span>
					<span
						class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-green-100 text-green-800">
						<i class="fas fa-check mr-1"></i> Free
					</span>
					<span
						class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-purple-100 text-purple-800">
						<i class="fas fa-lock mr-1"></i> Secure
					</span>
				</div>
				</p>
			</div>
		</header>

		<main role="main" class="w-full relative z-10" style="background: transparent;">
			<div class="container max-w-7xl mx-auto px-4 sm:px-6 py-8 md:py-16">
				<nav id="tool-cards-container" role="navigation" aria-label="Tools navigation"
					class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 lg:gap-6">
					<!-- Tool Cards will be loaded here dynamically -->
				</nav>
			</div>
		</main>

		<footer>
			<script type="module">
				import { createFooter } from './components/footer.js';
				createFooter();
			</script>
		</footer>

	</body>

</html>
