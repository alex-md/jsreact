<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="icon" type="image/x-icon" href="/favicon.ico">
		<title>JSreact - Modern Web Development Tools & Utilities</title>

		<!-- Styles -->
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
			crossorigin="anonymous" referrerpolicy="no-referrer" />
		<link rel="stylesheet" href="/assets/styles/global.css">
		<script src="https://cdn.tailwindcss.com"></script>

		<!-- Enhanced SEO Meta Tags -->
		<meta name="keywords"
			content="web development tools, online code editor, javascript tools, css tools, developer utilities, code playground, minification tools, text tools">
		<meta name="author" content="JSreact">
		<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">

		<!-- Enhanced Social Media Meta Tags -->
		<meta property="article:tag" content="Web Development">
		<meta property="article:tag" content="Developer Tools">
		<meta property="article:tag" content="Code Editor">
		<meta property="article:tag" content="Frontend Tools">
	</head>

	<body class="js-ready min-h-screen flex flex-col relative bg-gradient-radial from-background to-background/50">
		<script type="module">
			import { createNavbar } from './components/navbar.js';
			createNavbar();
		</script>

		<!-- Enhanced grid overlay background with blur effect -->
		<div class="pointer-events-none fixed inset-0 z-0">
			<div class="absolute inset-0 bg-grid-pattern opacity-[0.15]"></div>
			<div class="absolute inset-0 bg-gradient-noise mix-blend-overlay opacity-25"></div>
		</div>

		<!-- Hero Section -->
		<main class="flex-1 flex items-center">
			<header class="w-full">
				<div class="header-accent-container absolute inset-0 -z-10 pointer-events-none overflow-hidden">
					<div
						class="absolute inset-0 bg-gradient-radial from-primary/20 via-transparent to-transparent opacity-80">
					</div>
					<div class="absolute inset-x-0 -top-40 -z-10 transform-gpu overflow-hidden blur-3xl sm:-top-80">
						<div
							class="relative left-[calc(50%-11rem)] aspect-[1155/678] w-[36.125rem] -translate-x-1/2 rotate-[30deg] bg-gradient-to-tr from-primary to-secondary opacity-30 sm:left-[calc(50%-30rem)] sm:w-[72.1875rem]">
						</div>
					</div>
				</div>

				<div class="mx-auto max-w-7xl px-6 lg:px-8">
					<div class="mx-auto max-w-3xl text-center">


						<h1 class="text-4xl font-bold text-foreground sm:text-6xl animate-slide-up">
							Developer Web Tools

							<div class="absolute inset-x-0 -bottom-0.5 h-0.5 bg-gradient-title animate-pulse-slow">
							</div>
							</span>
						</h1>

						<p class="mt-6 text-lg leading-8 text-muted-foreground animate-slide-up"
							style="animation-delay: 200ms;">
							A comprehensive suite of <span class="font-bold">free tools</span> designed
							to
							<span class="relative inline-block">streamline your workflow
								<i
									class="fas fa-sparkles text-xs text-yellow-400 absolute -top-2 -right-2 animate-sparkle"></i>
							</span>
							and boost productivity.
						</p>
						<div class="mt-12 flex flex-col sm:flex-row justify-center items-center gap-4 animate-slide-up"
							style="animation-delay: 400ms;"> <a href="/tools/"
								class="w-full sm:w-auto btn-primary rounded-full px-8 py-4 text-lg">
								<i class="fas fa-tools mr-2"></i>
								Explore All Tools
							</a>
							<a href="/playground/"
								class="w-full sm:w-auto btn-secondary rounded-full px-8 py-4 text-lg">
								<i class="fas fa-code mr-2"></i>
								Try Code Playground
							</a>
						</div>
						<!-- made with love by alex-md github -->
						<div class="mt-8 flex justify-center items-center gap-2 animate-slide-up"
							style="animation-delay: 600ms;">
							<!-- github icon -->
							<a href="https://github.com/alex-md" class="text-blue-600 hover:text-blue-800 underline">
								<i class="fab fa-github"></i>
							</a>
							<span class="text-sm text-muted-foreground">Made with <i
									class="fas fa-heart text-red-500"></i> by
								<a href="https://github.com/alex-md"
									class="text-blue-600 hover:text-blue-800 underline">alex-md</a>

						</div>
					</div>
				</div>
				</div>
			</header>
		</main>

		<footer>
			<script type="module">
				import { createFooter } from '@components/footer.js';
				createFooter();
			</script>
		</footer>
	</body>

</html>
