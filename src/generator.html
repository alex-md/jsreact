<!DOCTYPE html>
<html lang="en">

    <head>
        <!-- Google tag (gtag.js) -->
        <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZEFG04PXR7"></script>
        <script>
            window.dataLayer = window.dataLayer || [];
            function gtag() { dataLayer.push(arguments); }
            gtag('js', new Date());
            gtag('config', 'G-ZEFG04PXR7');
        </script>
        <title>AI Name Generator</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Generate a name for your startup or domain using AI.">
        <link rel="icon" type="image/png" href="./images/icon.png">
        <link rel="icon" type="image/png" sizes="16x16" href="./images/icon-16x16.png">
        <link rel="shortcut icon" href="./images/favicon.ico">
        <meta name="theme-color" content="#ffffff">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/7.2.0/mdb.min.css">
        <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="./styles/global.css">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
        <style>
            body,
            input {
                font-family: Roboto, sans-serif;
                color: #303040
            }

            .input-form {
                text-align: center;
                border-bottom: solid 1px #ddd;
                padding: 16px;
                background: #fff;
                box-shadow: 0 2px 3px rgba(0, 0, 0, .1)
            }

            .input-form>label {
                display: inline;
                font-weight: 700
            }

            .input-form>.input {
                border: 0;
                border-bottom: solid 1px #ccc;
                padding: 8px 0;
                width: 128px
            }

            .input-form>.input:focus {
                border-bottom-color: #333
            }

            .input-form>.submit {
                border: 0;
                border-radius: 3px;
                margin-left: 16px;
                font-weight: 700;
                text-align: center;
                font-size: 12px;
                text-transform: uppercase;
                letter-spacing: .02em;
                cursor: pointer
            }

            .results-list {
                max-width: 960px;
                padding: 16px;
                margin: 64px auto 16px auto;
                display: flex;
                flex-wrap: wrap
            }

            .result-item {
                display: block;
                flex: 0 0 50%;
                flex-wrap: wrap;
                font-size: 18px;
                color: #333;
                text-decoration: none
            }

            @media (min-width:768px) {
                .result-item {
                    flex: 0 0 33%
                }

                .result-item:nth-child(3n+1) {
                    transform: translate3d(0, -48px, 0)
                }

                .result-item:nth-child(3n+3) {
                    transform: translate3d(0, 48px, 0)
                }
            }

            .result-item>span {
                display: block;
                background: #fff;
                height: 160px;
                line-height: 160px;
                margin: 8px;
                box-shadow: 0 2px 3px rgba(0, 0, 0, .1);
                text-align: center;
                animation: pop-in .3s ease-out
            }

            @media (min-width:768px) {
                .result-item>span {
                    margin: 16px
                }
            }

            .result-item>span {
                font-size: 1.2em;
                text-transform: uppercase;
                letter-spacing: .2em;
                font-size: 1.1em
            }

            .result-item:hover>span {
                transform: scale(0) translate3d(0, 0, 0);
                transition: transform 150ms ease
            }

            .result-item:nth-child(3n+2)>span {
                text-transform: none;
                font-weight: 200;
                letter-spacing: 0;
                font-size: 1.9em
            }

            .result-item:nth-child(7n+3)>span {
                text-transform: none;
                font-weight: 700;
                letter-spacing: -.05em;
                font-size: 1.7em
            }

            .result-item:nth-child(5n+0)>span {
                text-transform: uppercase;
                font-weight: 900;
                letter-spacing: .2em;
                font-size: 1.1em
            }

            .result-item:hover>span {
                transform: scale(1) translate3d(0, 0, 0)
            }

            #copyButton:hover {
                transition: transform .3s ease-in-out
            }

            @media (min-width:768px) {

                .result-item:hover>span,
                .result-item:nth-child(9n+5)>span {
                    background: #303030;
                    color: #fff;
                    transform: scale(1.05) translate3d(0, 0, 0)
                }

                .result-item:nth-child(9n+5)>span {
                    transform: scale(1.1) translate3d(0, 0, 0)
                }
            }

            .results-list>hr {
                flex: 1 1 100%;
                background: #888;
                height: 1px;
                margin: 16px 32px
            }

            @keyframes pop-in {
                0% {
                    opacity: 0;
                    transform: scale(.8)
                }
            }
        </style>
    </head>

    <body class="bg-light">
        <header class="py-5 bg-white mb-4">
            <div class="container">
                <h1 class="fw-bold mt-4 text-center display-4 text-muted">AI Name Generator</h1>
                <p class="text-center lead text-muted">Generate a name for your startup or domain</p>
            </div>
        </header>

        <main class="container pb-5">
            <div class="row g-4">
                <div class="col-12">
                    <div class="card">
                        <div class="card-body p-4">
                            <form id='form'>
                                <div class="mb-3">
                                    <label for="input" class="form-label">Let's name your startup using the
                                        words:</label>
                                    <input type='text' class='form-control shadow-sm' id='input'
                                        placeholder='Tortoise Bun' value="Tortoise Bun">
                                </div>
                                <div class="d-flex gap-3 align-items-center">
                                    <button id='submit' class="btn btn-primary">Generate Names</button>
                                    <div id="optionsCard" class="d-none">
                                        <div class="d-flex gap-3 align-items-center">
                                            <span class="text-muted">Copy Options:</span>
                                            <div class="form-check">
                                                <input class="form-check-input" type="radio" name="copyOption"
                                                    id="copyWithTLD" value="withTLD" checked>
                                                <label class="form-check-label" for="copyWithTLD">With TLD</label>
                                            </div>
                                            <div class="form-check">
                                                <button id='copyButton' class='btn btn-secondary d-none'>Copy
                                                    Names</button>
                                            </div>
                                        </div>
                                    </div>
                            </form>
                        </div>
                    </div>
                </div>
                <div class="col-12">
                    <div id='results' class='results-list'></div>
                </div>
            </div>
        </main>
        <footer>
        </footer>
        <script src="./components/navbar.js"></script>
        <script src="./scripts/generator.js"></script>
        <script src="https://unpkg.com/@rstacruz/startup-name-generator@latest/dist/startup-name-generator.js"></script>
        <script type="text/javascript"
            src="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/7.2.0/mdb.umd.min.js"></script>
    </body>

</html>
