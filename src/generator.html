<!DOCTYPE html>
<html lang="en" class="scroll-smooth dark">
    <head>
        <script src="./components/head.js"></script>
        <script>
            createHead(
                'AI Name Generator',
                'Generate creative names for your projects using startup name generator'
            );
        </script>
    </head>

    <body class="bg-gray-50 dark:bg-gray-900">
        <script src="./components/header.js"></script>
        <script>
            document.body.appendChild(
                createHeader(
                    'AI Name Generator',
                    'Generate creative names for your projects'
                )
            );
        </script>

        <main class="container mx-auto px-4 py-12 max-w-7xl">
            <div class="space-y-6">
                <!-- Input Section -->
                <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm hover:shadow-md transition-shadow duration-300 overflow-hidden border border-gray-200 dark:border-gray-700">
                    <div class="p-6 space-y-6">
                        <div class="space-y-4">
                            <label for="input-text" class="block text-sm font-medium text-gray-700 dark:text-gray-300">
                                Enter words to generate names from
                            </label>
                            <textarea id="input-text" rows="3" placeholder="Enter words or phrases..."
                                class="w-full px-4 py-3 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-shadow text-gray-900 dark:text-white"></textarea>
                        </div>

                        <!-- Action Buttons -->
                        <div class="flex flex-wrap gap-4">
                            <button id="generate-button"
                                class="px-6 py-3 bg-primary text-white font-medium rounded-lg hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors">
                                Generate Names
                            </button>
                            <button id="clear-button"
                                class="px-6 py-3 bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors">
                                Clear All
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Results Section -->
                <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm hover:shadow-md transition-shadow duration-300 overflow-hidden border border-gray-200 dark:border-gray-700">
                    <div class="border-b border-gray-200 dark:border-gray-700 px-6 py-4 flex justify-between items-center">
                        <h2 class="text-lg font-semibold text-gray-900 dark:text-white">Generated Names</h2>
                        <button id="copy-all-button" class="px-4 py-2 bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors text-sm font-medium flex items-center gap-2">
                            <i class="fas fa-copy text-xs"></i> Copy All
                        </button>
                    </div>
                    <div class="p-6">
                        <div id="results" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                            <!-- Results will be dynamically added here -->
                        </div>
                        <div id="loading" class="hidden">
                            <div class="flex items-center justify-center py-8">
                                <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-primary"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <script src="https://unpkg.com/@rstacruz/startup-name-generator@latest/dist/startup-name-generator.js"></script>
        <script src="./components/navbar.js"></script>
        <script src="./components/footer.js"></script>
        <script src="./components/toast.js"></script>
        <script src="./scripts/generator.js"></script>
    </body>
</html>
