<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

    <head>
        <!-- Google Analytics -->
        <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZEFG04PXR7"></script>
        <script src="./scripts/common.js"></script>
        <script>
            initializeCommon();
        </script>

        <!-- Dark mode initialization -->
        <script>
            // Set light mode as default
            if (!('theme' in localStorage)) {
                localStorage.theme = 'light';
            }
        </script>

        <!-- Page-specific meta -->
        <title>AI Name Generator</title>
        <meta name="description" content="Generate a name for your startup or domain using AI.">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <!-- Canonical URL -->
        <link rel="canonical" href="https://jsreact.com/generator.html">

        <!-- Favicons -->
        <link rel="icon" type="image/png" href="./images/icon.png">
        <link rel="icon" type="image/png" sizes="16x16" href="./images/icon-16x16.png">
        <link rel="shortcut icon" href="./images/favicon.ico">

        <!-- Tailwind CSS -->
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = {
                darkMode: 'class',
                theme: {
                    extend: {
                        colors: {
                            primary: '#0ea5e9',
                            secondary: '#27272a',
                        }
                    }
                }
            }
        </script>

        <!-- Font Awesome -->
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

        <!-- Custom styles -->
        <link href="./styles/global.css" rel="stylesheet">

        <!-- Theme color -->
        <meta name="theme-color" content="#09090b">
    </head>

    <body class="bg-gray-50 dark:bg-gray-900">
        <header class="py-16 bg-white dark:bg-gray-800 shadow-sm">
            <div class="container mx-auto px-4 max-w-7xl">
                <h1 class="text-4xl md:text-5xl font-bold text-center text-gray-900 dark:text-white">
                    AI Name Generator
                </h1>
                <p class="mt-4 text-xl text-gray-600 dark:text-gray-300 text-center max-w-3xl mx-auto">
                    Generate a name for your startup or domain
                </p>
            </div>
        </header>

        <main class="container mx-auto px-4 py-12 max-w-7xl">
            <div class="space-y-6">
                <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm hover:shadow-md transition-shadow duration-300 overflow-hidden border border-gray-200 dark:border-gray-700">
                    <div class="p-6">
                        <form id='form' class="space-y-6">
                            <div>
                                <label for="input" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                                    Let's name your startup using the words:
                                </label>
                                <input type='text' id='input'
                                    class="w-full px-4 py-3 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-shadow"
                                    placeholder='Tortoise Bun' value="Tortoise Bun">
                            </div>
                            <div class="flex flex-wrap items-center gap-4">
                                <button id='submit' type="submit"
                                    class="px-6 py-2 bg-primary text-white font-medium rounded-lg hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors">
                                    Generate Names
                                </button>
                                <div id="optionsCard" class="hidden">
                                    <div class="flex items-center gap-4">
                                        <span class="text-gray-600 dark:text-gray-400">Copy Options:</span>
                                        <label class="inline-flex items-center">
                                            <input type="radio" name="copyOption" id="copyWithTLD" value="withTLD" checked
                                                class="w-4 h-4 text-primary bg-gray-100 border-gray-300 focus:ring-primary dark:bg-gray-700 dark:border-gray-600">
                                            <span class="ml-2 text-sm text-gray-700 dark:text-gray-300">With TLD</span>
                                        </label>
                                        <button id='copyButton'
                                            class="hidden px-4 py-2 bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors">
                                            Copy Names
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>

                <div id='results' class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
            </div>
        </main>

        <script src="./components/navbar.js"></script>
        <script src="./scripts/generator.js"></script>
        <script src="https://unpkg.com/@rstacruz/startup-name-generator@latest/dist/startup-name-generator.js"></script>
    </body>

</html>
