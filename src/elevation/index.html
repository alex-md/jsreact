<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/x-icon" href="/public/favicon.ico">
        <title>Elevation Finder - Find Elevation Data for Any Location | JSreact</title>
        <meta name="description"
            content="Find elevation data for any location using address search or map clicking. Free online elevation finder tool with interactive maps.">

        <!-- Enhanced SEO Meta Tags -->
        <meta name="keywords"
            content="elevation finder, elevation data, topographic data, altitude finder, elevation lookup, geographic elevation, map elevation, terrain elevation">
        <meta name="author" content="JSreact">
        <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">

        <!-- Enhanced Social Media Meta Tags -->
        <meta property="article:tag" content="Elevation Data">
        <meta property="article:tag" content="Geographic Tools">
        <meta property="article:tag" content="Mapping">
        <meta property="article:tag" content="Topography">

        <!-- External Resources -->
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
            crossorigin="anonymous" referrerpolicy="no-referrer" />
        <link rel="stylesheet" href="/assets/styles/global.css">
        <script src="https://cdn.tailwindcss.com"></script>

        <!-- JSON-LD Structured Data -->
        <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "WebApplication",
            "name": "JSreact Elevation Finder",
            "applicationCategory": "UtilityApplication",
            "operatingSystem": "Any",
            "description": "Free online tool for finding elevation data for any location using address search or interactive map clicking.",
            "offers": {
                "@type": "Offer",
                "price": "0",
                "priceCurrency": "USD"
            },
            "featureList": [
                "Address-based elevation lookup",
                "Interactive map clicking",
                "Coordinate-based search",
                "Real-time elevation data",
                "Multiple data sources"
            ]
        }
        </script>
    </head>

    <body class="bg-background text-foreground">
        <script type="module">
            import { createHead } from '@components/head.js';
            createHead(
                'Elevation Finder - Find Elevation Data for Any Location',
                'Find elevation data for any location using address search or map clicking. Free online elevation finder tool with interactive maps.'
            );
        </script>

        <script type="module">
            import { createNavbar } from '@components/navbar.js';
            createNavbar();
        </script>

        <div id="header"></div>
        <script type="module">
            import { createHeader } from '@components/header.js';
            const header = createHeader(
                '🏔️ Elevation Finder',
                'Find the elevation for any location. Just click the map or search an address.'
            );
            document.getElementById('header').appendChild(header);
        </script>

        <main class="container mx-auto px-4 py-8 max-w-7xl">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <!-- Input Section -->
                <section class="space-y-6">
                    <!-- Address Search Card -->
                    <div
                        class="bg-card text-card-foreground rounded-xl shadow-lg hover:shadow-xl transition-shadow duration-300 overflow-hidden border border-border">
                        <div class="p-6 space-y-4">
                            <h2 class="text-lg font-semibold flex items-center gap-2">
                                <i class="fas fa-search text-primary"></i>
                                Address Search
                            </h2>
                            <div class="flex gap-3">
                                <input type="text" id="addressInput"
                                    placeholder="Enter an address (e.g., 1600 Amphitheatre Parkway, Mountain View, CA)"
                                    class="flex-1 px-4 py-3 bg-input border border-border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all">
                                <button id="searchBtn"
                                    class="px-6 py-3 bg-primary text-primary-foreground rounded-lg hover:bg-primary/90 transition-colors font-medium flex items-center gap-2">
                                    <i class="fas fa-search text-sm"></i>
                                    Search
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Coordinate Input Card -->
                    <div
                        class="bg-card text-card-foreground rounded-xl shadow-lg hover:shadow-xl transition-shadow duration-300 overflow-hidden border border-border">
                        <div class="p-6 space-y-4">
                            <h2 class="text-lg font-semibold flex items-center gap-2">
                                <i class="fas fa-crosshairs text-primary"></i>
                                Coordinate Search
                            </h2>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                                <div class="space-y-2">
                                    <label for="latInput"
                                        class="text-sm font-medium text-muted-foreground">Latitude:</label>
                                    <input type="number" id="latInput" step="any" placeholder="e.g., 37.4419"
                                        class="w-full px-4 py-3 bg-input border border-border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all">
                                </div>
                                <div class="space-y-2">
                                    <label for="lngInput"
                                        class="text-sm font-medium text-muted-foreground">Longitude:</label>
                                    <input type="number" id="lngInput" step="any" placeholder="e.g., -122.1430"
                                        class="w-full px-4 py-3 bg-input border border-border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all">
                                </div>
                            </div>
                            <button id="coordBtn"
                                class="w-full py-3 bg-primary text-primary-foreground rounded-lg hover:bg-primary/90 transition-colors font-medium flex items-center justify-center gap-2">
                                <i class="fas fa-map-marker-alt text-sm"></i>
                                Get Elevation
                            </button>
                        </div>
                    </div>

                    <!-- Map Instructions Card -->
                    <div class="bg-primary-light border border-primary/20 rounded-xl p-4">
                        <div class="flex items-start gap-3">
                            <div class="text-primary text-xl">💡</div>
                            <div>
                                <p class="text-sm font-medium text-primary">Interactive Map</p>
                                <p class="text-sm text-primary/80">Click anywhere on the map to get elevation data for
                                    that location</p>
                            </div>
                        </div>
                    </div>

                    <!-- Results Section -->
                    <div class="space-y-4">
                        <div id="loading"
                            class="hidden bg-card text-card-foreground rounded-xl shadow-lg border border-border p-6">
                            <div class="flex flex-col items-center space-y-4">
                                <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-primary"></div>
                                <p class="text-muted-foreground">Getting elevation data...</p>
                            </div>
                        </div>

                        <div id="results"
                            class="hidden bg-card text-card-foreground rounded-xl shadow-lg hover:shadow-xl transition-shadow duration-300 overflow-hidden border border-border">
                            <div class="p-6 space-y-4">
                                <h3 class="text-lg font-semibold flex items-center gap-2">
                                    <i class="fas fa-mountain text-primary"></i>
                                    Elevation Results
                                </h3>
                                <div class="space-y-3">
                                    <div class="flex justify-between items-center p-3 bg-muted rounded-lg">
                                        <span class="font-medium text-muted-foreground">Location:</span>
                                        <span id="resultLocation"
                                            class="font-semibold text-right max-w-xs truncate"></span>
                                    </div>
                                    <div class="flex justify-between items-center p-3 bg-muted rounded-lg">
                                        <span class="font-medium text-muted-foreground">Coordinates:</span>
                                        <span id="resultCoords" class="font-semibold text-right"></span>
                                    </div>
                                    <div class="flex justify-between items-center p-3 bg-primary-light rounded-lg">
                                        <span class="font-medium text-primary">Elevation:</span>
                                        <span id="resultElevation" class="font-bold text-primary text-lg"></span>
                                    </div>
                                    <div class="flex justify-between items-center p-3 bg-muted rounded-lg">
                                        <span class="font-medium text-muted-foreground">Dataset:</span>
                                        <span id="resultDataset" class="font-semibold text-right"></span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div id="error" class="hidden bg-destructive/10 border border-destructive/20 rounded-xl p-6">
                            <div class="flex items-start gap-3">
                                <i class="fas fa-exclamation-triangle text-destructive text-xl"></i>
                                <div>
                                    <h3 class="font-semibold text-destructive mb-2">Error</h3>
                                    <p id="errorMessage" class="text-destructive/80"></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Map Section -->
                <section
                    class="bg-card text-card-foreground rounded-xl shadow-lg hover:shadow-xl transition-shadow duration-300 overflow-hidden border border-border">
                    <div class="p-6">
                        <h2 class="text-lg font-semibold flex items-center gap-2 mb-4">
                            <i class="fas fa-map text-primary"></i>
                            Interactive Map
                        </h2>
                        <div class="h-96 lg:h-[600px] rounded-lg overflow-hidden border border-border">
                            <div id="map" class="w-full h-full"></div>
                        </div>
                    </div>
                </section>
            </div>
        </main>

        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
        <script type="module" src="./script.js"></script>
        <script type="module">
            import { createFooter } from '@components/footer.js';
            createFooter();
        </script>
    </body>

</html>
