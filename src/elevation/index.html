<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <script type="module">
        import { createHead } from '../components/head.js';
        createHead(
            'Elevation Finder',
            'Find the elevation of any location on Earth'
        );
    </script>
    <link rel="stylesheet" href="../assets/styles/global.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-sA+eC2s7DyY8dNg+J20qo7+evSeZIUpHgrKyI/sL0wM=" crossorigin="">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-SmSRw+VFUEEHB1y/69xM8CWE3RcxnEEnFMLFu+oT4gA=" crossorigin=""></script>
    <link rel="stylesheet" href="./style.css">
</head>
<body class="bg-background text-foreground">
    <script type="module">
        import { createNavbar } from '../components/navbar.js';
        createNavbar();
    </script>

    <header class="py-8 text-center">
        <h1 class="text-3xl font-bold">🏔️ Elevation Finder</h1>
    </header>

    <main class="container mx-auto px-4 py-6 space-y-6 max-w-3xl">
        <div class="controls space-y-4">
            <form id="addressForm" class="flex flex-col sm:flex-row gap-2">
                <input id="addressInput" type="text" placeholder="Enter any address..." class="flex-1 p-2 border rounded">
                <button type="submit" class="px-4 py-2 bg-primary text-primary-foreground rounded">Search</button>
            </form>
            <div class="flex flex-col sm:flex-row gap-2">
                <input id="latInput" type="number" step="any" placeholder="Latitude" class="flex-1 p-2 border rounded">
                <input id="lngInput" type="number" step="any" placeholder="Longitude" class="flex-1 p-2 border rounded">
                <button id="coordBtn" class="px-4 py-2 bg-primary text-primary-foreground rounded">Get Elevation</button>
            </div>
        </div>
        <div id="map" class="map-container"></div>
        <div id="results" class="p-4 border rounded bg-muted space-y-1">
            <p>Elevation: <span id="elevationValue">-</span> m</p>
            <p>Latitude: <span id="latValue">-</span></p>
            <p>Longitude: <span id="lngValue">-</span></p>
            <p id="errorMsg" class="text-red-500"></p>
        </div>
    </main>

    <script type="module" src="./script.js"></script>
    <script type="module">
        import { createFooter } from '../components/footer.js';
        createFooter();
    </script>
</body>
</html>
